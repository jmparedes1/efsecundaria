/* === MEJORA ESTÉTICA: tarjetas más profesionales, elegantes y modernas === */
:root{
  --surface: rgba(255,255,255,0.78);
  --surface-strong: rgba(255,255,255,0.92);
  --stroke: rgba(15,23,42,0.10);
  --stroke-strong: rgba(15,23,42,0.14);
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 10px 28px rgba(2,6,23,0.12);
  --shadow-lg: 0 22px 55px rgba(2,6,23,0.18);
}

/* Fondo más "premium" sin cambiar el layout */
body{
  background:
    radial-gradient(1200px 600px at 12% 8%, color-mix(in srgb, var(--brand) 18%, transparent), transparent 60%),
    radial-gradient(900px 500px at 88% 18%, rgba(168,85,247,0.12), transparent 55%),
    radial-gradient(1100px 650px at 50% 110%, rgba(16,185,129,0.10), transparent 55%),
    linear-gradient(180deg, #f8fafc 0%, #f1f5f9 55%, #eef2ff 100%);
}

/* Tarjeta */
.card{
  background: var(--surface);
  border: 1px solid var(--stroke);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  border-radius: 18px;
  padding: 14px 14px 14px 20px;
  min-height: 72px;

  box-shadow: var(--shadow-sm);
  transform: translateZ(0);
}

/* Borde elegante izquierda (refinado) */
.card::before{
  top: 12px;
  bottom: 12px;
  width: 5px;
  border-radius: 999px;
  background: linear-gradient(
    180deg,
    color-mix(in srgb, var(--brand), white 10%),
    color-mix(in srgb, var(--brand), black 20%)
  );
  box-shadow: 0 0 0 1px rgba(255,255,255,0.5) inset;
}

/* Hover "premium" */
.card:hover{
  background: var(--surface-strong);
  border-color: var(--stroke-strong);
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}

/* Título + texto */
.card-title, .title, .tool-card .title{
  font-weight: 950;
  letter-spacing: -0.02em;
}

.subtitle, .tool-card .subtitle{
  opacity: 0.9;
}

/* Badge más moderno */
.badge{
  border: 1px solid rgba(15,23,42,0.10);
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-radius: 999px;
  padding: 6px 10px;
  font-weight: 900;
}

/* Botones de acción: icono dentro de "pill" */
.action-btn{
  border: 1px solid rgba(15,23,42,0.10);
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-radius: 14px;
  box-shadow: 0 1px 0 rgba(255,255,255,0.7) inset;
  transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}

.action-btn:hover{
  transform: translateY(-1px);
  border-color: rgba(15,23,42,0.16);
  box-shadow: 0 10px 24px rgba(2,6,23,0.14);
}

/* Ajuste de densidad: más “dashboard” */
.grid{
  gap: 12px;
}

@media (max-width: 600px){
  .card{ border-radius: 16px; }
}


/* === BORDE IZQUIERDO 3D ELEGANTE (MEJORA) === */
.card::before{
  content:"";
  position:absolute;
  left:0;
  top:10px;
  bottom:10px;
  width:6px;
  border-radius:999px;

  background:
    linear-gradient(
      180deg,
      color-mix(in srgb, var(--brand), white 25%),
      var(--brand),
      color-mix(in srgb, var(--brand), black 25%)
    );

  box-shadow:
    inset 1px 0 0 rgba(255,255,255,0.55),
    inset -1px 0 0 rgba(0,0,0,0.25),
    0 0 0 1px rgba(255,255,255,0.35),
    0 6px 14px rgba(2,6,23,0.35);
}

/* Realce al hover */
.card:hover::before{
  box-shadow:
    inset 1px 0 0 rgba(255,255,255,0.7),
    inset -1px 0 0 rgba(0,0,0,0.35),
    0 0 0 1px rgba(255,255,255,0.55),
    0 10px 22px rgba(2,6,23,0.45);
}


/* === BORDE 3D INTEGRADO AL CONTORNO DE LA FICHA === */
.card{
  position: relative;
  border-left: 6px solid transparent;
  border-image-slice: 1;
  border-image-source: linear-gradient(
    180deg,
    color-mix(in srgb, var(--brand), white 25%),
    var(--brand),
    color-mix(in srgb, var(--brand), black 30%)
  );
}

/* Efecto 3D sutil usando sombras internas */
.card{
  box-shadow:
    inset 2px 0 0 rgba(255,255,255,0.55),
    inset -1px 0 0 rgba(0,0,0,0.12),
    var(--shadow-sm);
}

/* Hover: más profundidad */
.card:hover{
  box-shadow:
    inset 2px 0 0 rgba(255,255,255,0.7),
    inset -1px 0 0 rgba(0,0,0,0.18),
    var(--shadow-md);
}

/* Eliminamos el pseudo-elemento anterior si existía */
.card::before{
  content:none !important;
}


/* === ESTILO PROFESIONAL UNIFICADO PARA TODAS LAS FICHAS === */
:root{
  --radius-card: 18px;
  --pad-card-y: 14px;
  --pad-card-x: 16px;
  --text-strong: #0f172a;
  --text-soft: rgba(15,23,42,0.68);
  --stroke-soft: rgba(15,23,42,0.10);
  --stroke-hover: rgba(15,23,42,0.16);
  --glass: rgba(255,255,255,0.78);
  --glass-strong: rgba(255,255,255,0.92);
}

/* Tarjeta base (cubre .card y .tool-card por si queda alguna) */
.card,
.tool-card{
  position: relative;
  overflow: hidden;

  border-radius: var(--radius-card);
  background: var(--glass);
  border: 1px solid var(--stroke-soft);

  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  padding: var(--pad-card-y) var(--pad-card-x) var(--pad-card-y) calc(var(--pad-card-x) + 4px);
  min-height: 74px;

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;

  box-shadow: var(--shadow-sm);
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
  transform: translateZ(0);
}

/* Borde 3D integrado (izquierda) */
.card,
.tool-card{
  border-left: 6px solid transparent;
  border-image-slice: 1;
  border-image-source: linear-gradient(
    180deg,
    color-mix(in srgb, var(--brand), white 25%),
    var(--brand),
    color-mix(in srgb, var(--brand), black 30%)
  );
}

/* Relieve interior para sensación 3D */
.card,
.tool-card{
  box-shadow:
    inset 2px 0 0 rgba(255,255,255,0.55),
    inset -1px 0 0 rgba(0,0,0,0.10),
    var(--shadow-sm);
}

/* Hover premium */
.card:hover,
.tool-card:hover{
  background: var(--glass-strong);
  border-color: var(--stroke-hover);
  box-shadow:
    inset 2px 0 0 rgba(255,255,255,0.70),
    inset -1px 0 0 rgba(0,0,0,0.14),
    var(--shadow-md);
  transform: translateY(-2px);
}

/* Focus accesible (teclado) */
.card:focus-within,
.tool-card:focus-within{
  outline: none;
  border-color: color-mix(in srgb, var(--brand), black 20%);
  box-shadow:
    inset 2px 0 0 rgba(255,255,255,0.70),
    inset -1px 0 0 rgba(0,0,0,0.14),
    0 0 0 3px color-mix(in srgb, var(--brand), white 70%),
    var(--shadow-md);
}

/* Tipografía y jerarquía dentro de la tarjeta */
.card-title,
.title,
.tool-card .title{
  margin: 0;
  font-size: 0.92rem;
  line-height: 1.15;
  font-weight: 950;
  letter-spacing: -0.02em;
  color: var(--text-strong);
}

.subtitle,
.tool-card .subtitle{
  margin-top: 2px;
  font-size: 0.74rem;
  line-height: 1.2;
  font-weight: 850;
  color: var(--text-soft);
}

/* Alineación del bloque de texto (si existe contenedor) */
.card .meta,
.tool-card .meta{
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

/* Badge profesional */
.badge{
  display: inline-flex;
  align-items: center;
  gap: 6px;

  border: 1px solid rgba(15,23,42,0.10);
  background: rgba(255,255,255,0.72);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);

  padding: 6px 10px;

/* Botones de acción coherentes */
.action-btn,

  border-radius: 14px;
  border: 1px solid rgba(15,23,42,0.10);

  backdrop-filter: blur(8px);

  box-shadow: 0 1px 0 rgba(255,255,255,0.70) inset;
  transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease, background .16s ease;
}

.action-btn:hover,
.btn-delete:hover{
  transform: translateY(-1px);
  border-color: rgba(15,23,42,0.16);

.action-btn:active,

/* Separación visual del área de acciones si hay contenedor */
.card .actions,

/* Text overflow elegante */
.card-title,

/* Ajuste de densidad grid (más pro) */

/* === BORDE REDONDEADO + SOMBRA 3D ENVOLVENTE === */
.card,
.tool-card{
  border-radius: 22px;
  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,0.95),
      rgba(255,255,255,0.75)
    );

  box-shadow:
    /* sombra principal */
    0 18px 40px rgba(2,6,23,0.22),
    /* sombra cercana */
    0 6px 14px rgba(2,6,23,0.14),
    /* relieve interior */
    inset 0 1px 0 rgba(255,255,255,0.85),
    inset 0 -1px 0 rgba(0,0,0,0.06);
}

/* Hover: efecto flotante elegante */
.card:hover,
.tool-card:hover{
  box-shadow:
    0 26px 60px rgba(2,6,23,0.30),
    0 10px 22px rgba(2,6,23,0.20),
    inset 0 1px 0 rgba(255,255,255,0.9),
    inset 0 -1px 0 rgba(0,0,0,0.08);
}

/* Refuerzo del borde de color con suavizado */
.card,
.tool-card{
  outline: 1px solid rgba(255,255,255,0.55);
  outline-offset: -1px;
}


/* === UNIFICACIÓN DE BORDES CON EL ENTORNO (COLOR + SOMBRA) === */
.card,
.tool-card{
  /* Fondo integrado con el entorno */
  background:
    linear-gradient(
      180deg,
      color-mix(in srgb, var(--brand) 6%, white),
      color-mix(in srgb, var(--brand) 2%, white)
    );

  /* Borde suave que hereda el color del tema */
  border: 1px solid color-mix(in srgb, var(--brand), rgba(15,23,42,0.12) 70%);

  /* Halo externo para fundirse con el fondo */
  box-shadow:
    0 0 0 1px color-mix(in srgb, var(--brand), transparent 85%),
    0 18px 40px rgba(2,6,23,0.22),
    0 6px 14px rgba(2,6,23,0.14),
    inset 0 1px 0 rgba(255,255,255,0.9),
    inset 0 -1px 0 rgba(0,0,0,0.05);
}

/* Hover: integración más intensa */
.card:hover,
.tool-card:hover{
  background:
    linear-gradient(
      180deg,
      color-mix(in srgb, var(--brand) 10%, white),
      color-mix(in srgb, var(--brand) 4%, white)
    );

  border-color: color-mix(in srgb, var(--brand), rgba(15,23,42,0.18) 60%);

  box-shadow:
    0 0 0 1px color-mix(in srgb, var(--brand), transparent 75%),
    0 26px 60px rgba(2,6,23,0.30),
    0 10px 22px rgba(2,6,23,0.20),
    inset 0 1px 0 rgba(255,255,255,0.95),
    inset 0 -1px 0 rgba(0,0,0,0.08);
}


/* === BORDE IZQUIERDO MÁS GRUESO Y 3D (PROTAGONISTA) === */
.card,
.tool-card{
  border-left-width: 10px;
  border-left-style: solid;
  border-image-slice: 1;
  border-image-source: linear-gradient(
    180deg,
    color-mix(in srgb, var(--brand), white 35%),
    var(--brand),
    color-mix(in srgb, var(--brand), black 35%)
  );

  /* Profundidad 3D reforzada */
  box-shadow:
    inset 3px 0 0 rgba(255,255,255,0.75),
    inset -2px 0 0 rgba(0,0,0,0.18),
    0 22px 50px rgba(2,6,23,0.26),
    0 8px 18px rgba(2,6,23,0.18);
}

/* Hover: canto aún más marcado */
.card:hover,
.tool-card:hover{
  box-shadow:
    inset 4px 0 0 rgba(255,255,255,0.85),
    inset -2px 0 0 rgba(0,0,0,0.22),
    0 30px 70px rgba(2,6,23,0.34),
    0 12px 26px rgba(2,6,23,0.24);
}


/* === BORDE IZQUIERDO 3D REDONDEADO Y ADAPTADO A LA FICHA === */
.card,
.tool-card{
  position: relative;
  overflow: hidden; /* clave para recortar el borde a la forma */
}

/* Borde izquierdo como canto integrado y redondeado */
.card::before,
.tool-card::before{
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 12px;

  background: linear-gradient(
    180deg,
    color-mix(in srgb, var(--brand), white 35%),
    var(--brand),
    color-mix(in srgb, var(--brand), black 35%)
  );

  border-top-left-radius: 22px;
  border-bottom-left-radius: 22px;

  box-shadow:
    inset 2px 0 0 rgba(255,255,255,0.75),
    inset -2px 0 0 rgba(0,0,0,0.22),
    0 0 0 1px rgba(255,255,255,0.4);
}

/* Ajuste de padding para no tapar contenido */
.card,
.tool-card{
  padding-left: calc(var(--pad-card-x) + 14px);
}

/* Hover: refuerzo del efecto 3D */
.card:hover::before,
.tool-card:hover::before{
  box-shadow:
    inset 3px 0 0 rgba(255,255,255,0.85),
    inset -2px 0 0 rgba(0,0,0,0.28),
    0 6px 16px rgba(2,6,23,0.35);
}

/* Desactivamos el border-image previo para evitar duplicados */
.card,
.tool-card{
  border-left: none !important;
}


/* === ELIMINAR TODOS LOS BORDES DE LAS FICHAS === */
.card,
.tool-card{
  border: none !important;
  outline: none !important;
  border-radius: 22px;
}

/* Eliminar cualquier canto o borde lateral */
.card::before,
.tool-card::before{
  content: none !important;
}

/* Mantener solo sombra y fondo (sin bordes visibles) */
.card,
.tool-card{
  box-shadow:
    0 22px 50px rgba(2,6,23,0.26),
    0 8px 18px rgba(2,6,23,0.18),
    inset 0 1px 0 rgba(255,255,255,0.9);
}


/* === TÍTULOS ADAPTATIVOS Y TIPOGRAFÍA MODERNA === */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

.card-title,
.title,
.tool-card .title{
  font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 0.9rem;
  font-weight: 800;
  line-height: 1.25;
  letter-spacing: -0.015em;
  color: #0f172a;

  /* Ajuste para que quepa dentro de la ficha */
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2; /* máximo 2 líneas */
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: normal;
}

/* Variante compacta en pantallas pequeñas */
@media (max-width: 600px){
  .card-title,
  .title,
  .tool-card .title{
    font-size: 0.85rem;
    -webkit-line-clamp: 3;
  }
}


/* === BADGE SIN TEXTO: DEGRADADO DEL COLOR DEL TEMA === */
.badge.badge-theme{
  padding: 0;
  width: 58px;
  height: 14px;
  border-radius: 999px;
  border: none !important;

  background: linear-gradient(
    90deg,
    color-mix(in srgb, var(--brand), white 18%),
    var(--brand),
    color-mix(in srgb, var(--brand), black 16%)
  );

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.55),
    inset 0 -1px 0 rgba(0,0,0,0.18),
    0 10px 22px rgba(2,6,23,0.16);

  flex: 0 0 auto;
}

/* Si quedase algún badge con texto, lo ocultamos en este modo */
.badge.badge-theme{
  color: transparent;
  font-size: 0;
  line-height: 0;
}


/* === FICHA AÑADIR NUEVO RECURSO === */
.add-card{
  cursor: pointer;
  justify-content: center;
  align-items: center;
  text-align: center;
  background:
    linear-gradient(
      180deg,
      color-mix(in srgb, var(--brand) 12%, white),
      color-mix(in srgb, var(--brand) 4%, white)
    );
  transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
}
.add-card:hover{
  transform: translateY(-4px) scale(1.02);
  background:
    linear-gradient(
      180deg,
      color-mix(in srgb, var(--brand) 18%, white),
      color-mix(in srgb, var(--brand) 8%, white)
    );
}
.add-icon{
  width: 52px;
  height: 52px;
  margin: 0 auto 8px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius: 16px;
  font-size: 2rem;
  font-weight: 900;
  color: #fff;
  background: var(--brand);
  box-shadow:
    0 12px 28px color-mix(in srgb, var(--brand), transparent 55%),
    inset 0 1px 0 rgba(255,255,255,0.4);
}


/* === BORDE ELEGANTE AL HOVER DE FICHAS === */
.card,
.tool-card{
  position: relative;
}

.card::after,
.tool-card::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:22px;
  pointer-events:none;
  opacity:0;
  transition: opacity .2s ease, box-shadow .2s ease;
  box-shadow:
    0 0 0 2px color-mix(in srgb, var(--brand), white 20%),
    0 0 0 6px color-mix(in srgb, var(--brand), transparent 85%);
}

.card:hover::after,
.tool-card:hover::after{
  opacity:1;
  box-shadow:
    0 0 0 2px var(--brand),
    0 0 0 6px color-mix(in srgb, var(--brand), transparent 80%);
}


/* === ANIMACIÓN MODERNA BARRA DE COLOR SUPERIOR === */
.card .badge.badge-theme{
  position: relative;
  overflow: hidden;
}

.card .badge.badge-theme::after{
  content:"";
  position:absolute;
  inset:0;
  background: linear-gradient(
    120deg,
    transparent 0%,
    rgba(255,255,255,0.45) 45%,
    rgba(255,255,255,0.85) 50%,
    rgba(255,255,255,0.45) 55%,
    transparent 100%
  );
  transform: translateX(-120%);
  animation: shimmer 3.5s infinite;
}

@keyframes shimmer{
  0%   { transform: translateX(-120%); }
  40%  { transform: translateX(120%); }
  100% { transform: translateX(120%); }
}

/* Intensificación al hover */
.card:hover .badge.badge-theme::after{
  animation-duration: 1.6s;
}


/* === FONDO "LÍNEAS CAÍDAS" (CSS) · inspirado en la imagen de referencia === */
:root{
  /* Paleta base (light) */
  --bgp-a: #0b2f6f;
  --bgp-b: #0a4ea3;
  --bgp-c: #0ea5e9;
  --bgp-d: #bfe9ff;

  /* Patrón: capas de degradado + líneas diagonales */
  --bg-pattern:
    /* brillos suaves */
    radial-gradient(900px 520px at 18% 12%, rgba(255,255,255,0.22), transparent 60%),
    radial-gradient(700px 480px at 82% 18%, rgba(255,255,255,0.14), transparent 62%),
    radial-gradient(900px 600px at 55% 110%, rgba(255,255,255,0.10), transparent 58%),

    /* base azul */
    linear-gradient(180deg, var(--bgp-a) 0%, var(--bgp-b) 40%, var(--bgp-c) 78%, var(--bgp-d) 120%),

    /* líneas finas (diagonales) */
    repeating-linear-gradient(
      115deg,
      rgba(255,255,255,0.22) 0px,
      rgba(255,255,255,0.22) 1px,
      rgba(255,255,255,0.00) 10px,
      rgba(255,255,255,0.00) 26px
    ),

    /* líneas medias (más separadas) */
    repeating-linear-gradient(
      115deg,
      rgba(255,255,255,0.10) 0px,
      rgba(255,255,255,0.10) 2px,
      rgba(255,255,255,0.00) 18px,
      rgba(255,255,255,0.00) 58px
    ),

    /* “rayas” de contraste (muy sutiles) */
    repeating-linear-gradient(
      115deg,
      rgba(2,6,23,0.10) 0px,
      rgba(2,6,23,0.10) 1px,
      rgba(2,6,23,0.00) 14px,
      rgba(2,6,23,0.00) 44px
    );
}

/* Ajuste del patrón en dark: líneas un poco más suaves */
/* =====================
   FONDO ESTILO "HERO" (similar a la referencia)
   - Gradiente oscuro
   - Blobs suaves de color
   - Glass overlay para legibilidad
===================== */
:root{
  /* Light (suave, pero inspirado en el look oscuro) */
  --bg-hero-a:#0b1220;
  --bg-hero-b:#0f1b3a;
  --bg-hero-c:#111827;

  --blob-1: rgba(168,85,247,.42);
  --blob-2: rgba(59,130,246,.36);
  --blob-3: rgba(34,197,94,.22);

  --glass-tint: rgba(255,255,255,.62);
  --glass-tint-2: rgba(255,255,255,.46);
  --glass-blur: 10px;

  --card-bg: rgba(255,255,255,.70);
  --card-bg-strong: rgba(255,255,255,.86);
  --card-shadow: 0 18px 45px rgba(2,6,23,.18);

  --nav-bg: rgba(255,255,255,.70);
  --nav-border: rgba(255,255,255,.35);

  /* patrón base */
  --bg-pattern:
    radial-gradient(900px 600px at 70% 25%, var(--blob-1), transparent 58%),
    radial-gradient(800px 560px at 25% 15%, var(--blob-2), transparent 60%),
    radial-gradient(900px 650px at 50% 110%, var(--blob-3), transparent 60%),
    linear-gradient(120deg, var(--bg-hero-a) 0%, var(--bg-hero-b) 55%, var(--bg-hero-c) 100%);
}

/* Dark (muy cercano a la referencia) */
/* === BACKDROP HERO (capas) === */
body{
  position: relative;
  min-height: 100vh;
  background: transparent;
}

/* Fondo base */
body::before{
  content:"";
  position: fixed;
  inset: 0;
  z-index: -2;
  background-image: var(--bg-pattern);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

/* Capa glass para legibilidad + “niebla” suave */
body::after{
  content:"";
  position: fixed;
  inset: 0;
  z-index: -1;
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  background:
    radial-gradient(900px 520px at 78% 20%, rgba(255,255,255,.10), transparent 60%),
    linear-gradient(180deg, var(--glass-tint) 0%, var(--glass-tint-2) 60%, var(--glass-tint) 110%);
}


/* =====================
   AJUSTE ESTÉTICO (cards + navbar) estilo referencia
===================== */
.navbar{
  background: var(--nav-bg) !important;
  border: 1px solid var(--nav-border) !important;
}

.user-profile{
  background: color-mix(in srgb, var(--nav-bg) 75%, transparent) !important;
  border: 1px solid color-mix(in srgb, var(--nav-border) 75%, transparent) !important;
}

.card,
.tool-card{
  background: var(--card-bg) !important;
  box-shadow: var(--card-shadow) !important;
}

/* “Borde” premium al hover (más visible en dark) */
.card:hover::after,
.tool-card:hover::after{
  box-shadow:
    0 0 0 2px color-mix(in srgb, var(--brand), white 10%),
    0 0 0 6px color-mix(in srgb, var(--brand), transparent 78%),
    0 18px 55px rgba(0,0,0,.18);
}

/* Badge superior: más “neón” suave */
.badge.badge-theme{
  filter: saturate(1.15) contrast(1.05);
}

/* Inputs más integrados */
.search-input{
  background: color-mix(in srgb, var(--nav-bg) 70%, rgba(255,255,255,0.35)) !important;
  border-color: color-mix(in srgb, var(--nav-border), rgba(2,6,23,0.06) 60%) !important;
}

/* Botones glass */
.action-btn{
  background: color-mix(in srgb, var(--nav-bg) 72%, transparent) !important;
  border-color: color-mix(in srgb, var(--nav-border) 70%, transparent) !important;
}


/* =====================
   REFINO HERO V30
   - Panel central más marcado
   - Widgets decorativos (cuadros degradados)
   - 3 formas flotantes (sin interferir)
   - Iluminación / contraste
===================== */

/* Panel central (zona de contenido) */
.container{
  position: relative;
}

.container::before{
  content:"";
  position: absolute;
  left: -18px;
  right: -18px;
  top: 0;
  bottom: -28px;
  border-radius: 34px;
  pointer-events: none;
  /* panel glass */
  background: linear-gradient(
      180deg,
      color-mix(in srgb, var(--nav-bg) 72%, transparent),
      color-mix(in srgb, var(--nav-bg) 56%, transparent)
    );
  border: 1px solid color-mix(in srgb, var(--nav-border) 65%, transparent);
  box-shadow:
    0 26px 80px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.18);
  z-index: -0;
}

/* En dark: más marcado */
/* Widgets decorativos (cuadros degradados) */
.container::after{
  content:"";
  position:absolute;
  right: 22px;
  top: 108px;
  width: 240px;
  height: 240px;
  border-radius: 28px;
  pointer-events:none;
  background:
    radial-gradient(120px 120px at 28% 28%, rgba(255,255,255,.35), transparent 60%),
    linear-gradient(135deg, rgba(168,85,247,.55), rgba(59,130,246,.45));
  filter: blur(.0px);
  opacity: .28;
  transform: rotate(6deg);
  box-shadow:
    0 18px 55px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.35);
  z-index: -0;
}

/* Segundo widget */
body .widget-deco-2{
  position: fixed;
  left: 26px;
  top: 220px;
  width: 190px;
  height: 190px;
  border-radius: 26px;
  pointer-events:none;
  background:
    radial-gradient(110px 110px at 25% 25%, rgba(255,255,255,.30), transparent 62%),
    linear-gradient(135deg, rgba(34,197,94,.45), rgba(96,165,250,.40));
  opacity: .22;
  transform: rotate(-10deg);
  box-shadow:
    0 18px 55px rgba(0,0,0,.16),
    inset 0 1px 0 rgba(255,255,255,.28);
  z-index: -1;
}

/* Tercer widget (más pequeño) */
body .widget-deco-3{
  position: fixed;
  right: 90px;
  bottom: 70px;
  width: 150px;
  height: 150px;
  border-radius: 24px;
  pointer-events:none;
  background:
    radial-gradient(90px 90px at 30% 30%, rgba(255,255,255,.28), transparent 62%),
    linear-gradient(135deg, rgba(96,165,250,.50), rgba(168,85,247,.40));
  opacity: .18;
  transform: rotate(12deg);
  box-shadow:
    0 16px 45px rgba(0,0,0,.14),
    inset 0 1px 0 rgba(255,255,255,.25);
  z-index: -1;
}

/* 3 formas flotantes (blobs) */
body .float-shape{
  position: fixed;
  pointer-events: none;
  z-index: -2;
  filter: blur(0px);
  opacity: .55;
  mix-blend-mode: screen;
}

body .float-1{
  width: 420px; height: 420px;
  left: -160px; top: -120px;
  background: radial-gradient(circle at 30% 30%, rgba(96,165,250,.55), transparent 62%),
              radial-gradient(circle at 70% 70%, rgba(168,85,247,.55), transparent 60%);
  animation: floaty1 14s ease-in-out infinite;
}

body .float-2{
  width: 520px; height: 520px;
  right: -220px; top: 80px;
  background: radial-gradient(circle at 35% 35%, rgba(168,85,247,.60), transparent 62%),
              radial-gradient(circle at 65% 65%, rgba(34,197,94,.35), transparent 60%);
  animation: floaty2 16s ease-in-out infinite;
}

body .float-3{
  width: 520px; height: 520px;
  left: 10%; bottom: -260px;
  background: radial-gradient(circle at 40% 40%, rgba(34,197,94,.30), transparent 64%),
              radial-gradient(circle at 70% 60%, rgba(96,165,250,.45), transparent 60%);
  animation: floaty3 18s ease-in-out infinite;
}

@keyframes floaty1{
  0%,100%{ transform: translate(0,0) scale(1); }
  50%{ transform: translate(30px, 22px) scale(1.03); }
}
@keyframes floaty2{
  0%,100%{ transform: translate(0,0) scale(1); }
  50%{ transform: translate(-28px, 18px) scale(1.04); }
}
@keyframes floaty3{
  0%,100%{ transform: translate(0,0) scale(1); }
  50%{ transform: translate(22px, -18px) scale(1.05); }
}

/* Ajuste iluminación/contraste: subimos nitidez del contenido y bajamos velo */
body::after{
  background:
    radial-gradient(900px 520px at 78% 20%, rgba(255,255,255,.12), transparent 60%),
    linear-gradient(180deg, color-mix(in srgb, var(--glass-tint) 92%, transparent) 0%, var(--glass-tint-2) 60%, color-mix(in srgb, var(--glass-tint) 92%, transparent) 110%) !important;
}

/* Responsive: escondemos decoraciones en móvil para no cargar */
@media (max-width: 600px){
  .container::after, .widget-deco-2, .widget-deco-3{ display:none; }
  .float-1,.float-2,.float-3{ opacity:.35; }
}


/* =====================

   - Superficies limpias
   - Bordes finos
   - Sombras suaves
   - Decoración reducida
===================== */

/* Tipografía estilo iOS */
body{

  letter-spacing: -0.01em;
}

/* Fondo minimal (suave, limpio) */
:root{
  --ios-bg-1: #f7f7fa;
  --ios-bg-2: #ffffff;
  --ios-stroke: rgba(15,23,42,0.10);
  --ios-stroke-2: rgba(15,23,42,0.14);
  --ios-shadow: 0 10px 30px rgba(2,6,23,0.08);
  --ios-shadow-sm: 0 2px 10px rgba(2,6,23,0.06);
  --ios-radius-xl: 28px;
  --ios-radius-lg: 22px;
  --ios-radius-md: 16px;
}

/* Dark iOS minimal */
/* Reemplaza el hero decorativo por un look limpio */
body::before{
  background-image:
    radial-gradient(900px 520px at 15% 10%, color-mix(in srgb, var(--brand) 16%, transparent), transparent 60%),
    radial-gradient(900px 520px at 90% 15%, rgba(168,85,247,0.10), transparent 60%),
    linear-gradient(180deg, var(--ios-bg-2) 0%, var(--ios-bg-1) 100%);
}
/* Menos velo */
body::after{
  backdrop-filter: blur(8px) !important;
  -webkit-backdrop-filter: blur(8px) !important;
  background: transparent !important;
}

/* Oculta decoraciones pesadas */
.float-shape,
.widget-deco-2,
.widget-deco-3,
.container::after{
  display:none !important;
}

/* Panel central discreto */
.container::before{
  background: color-mix(in srgb, var(--ios-bg-2) 88%, transparent) !important;
  border: 1px solid var(--ios-stroke) !important;
  box-shadow: var(--ios-shadow) !important;
  border-radius: var(--ios-radius-xl) !important;
}

/* Navbar estilo iOS */
.navbar{
  top: 14px !important;
  border-radius: var(--ios-radius-xl) !important;
  background: color-mix(in srgb, var(--ios-bg-2) 82%, transparent) !important;
  border: 1px solid var(--ios-stroke) !important;
  box-shadow: var(--ios-shadow-sm) !important;
}
/* Inputs estilo iOS */
.search-input{
  border-radius: var(--ios-radius-lg) !important;
  background: color-mix(in srgb, var(--ios-bg-2) 82%, transparent) !important;
  border: 1px solid var(--ios-stroke) !important;
  box-shadow: none !important;
}
/* Botones redondos iOS */
.action-btn{
  width: 42px !important;
  height: 42px !important;
  border-radius: 999px !important;
  background: color-mix(in srgb, var(--ios-bg-2) 82%, transparent) !important;
  border: 1px solid var(--ios-stroke) !important;
  box-shadow: none !important;
}
.action-btn:hover{
  transform: translateY(-1px);
  box-shadow: var(--ios-shadow-sm) !important;
}

/* Cards minimal */
.card,
.tool-card{
  border-radius: var(--ios-radius-lg) !important;
  background: color-mix(in srgb, var(--ios-bg-2) 86%, transparent) !important;
  border: 1px solid var(--ios-stroke) !important;
  box-shadow: none !important;
}
.card:hover,
.tool-card:hover{
  background: color-mix(in srgb, var(--ios-bg-2) 94%, transparent) !important;
  border-color: var(--ios-stroke-2) !important;
  box-shadow: var(--ios-shadow-sm) !important;
  transform: translateY(-1px) !important;
}

/* Borde hover elegante (más sutil) */
.card::after,
.tool-card::after{
  border-radius: var(--ios-radius-lg) !important;
  box-shadow:
    0 0 0 1px color-mix(in srgb, var(--brand), transparent 55%),
    0 0 0 6px color-mix(in srgb, var(--brand), transparent 92%) !important;
}
.card:hover::after,
.tool-card:hover::after{
  opacity:1;
}

/* Badge superior más discreto */
.badge.badge-theme{
  height: 10px !important;
  width: 54px !important;
  opacity: .95;
  box-shadow: none !important;
}
.card:hover .badge.badge-theme::after{
  animation-duration: 2.2s;
}

/* Perfil usuario más limpio */
.user-profile{
  border-radius: 999px !important;
  background: color-mix(in srgb, var(--ios-bg-2) 82%, transparent) !important;
  border: 1px solid var(--ios-stroke) !important;
  box-shadow: none !important;
}
.user-avatar{
  border-radius: 999px !important;
}

/* Grid con aire tipo iOS */
.grid{
  gap: 14px !important;
  padding: 14px !important;
}

/* Modal visor: estilo iOS sheet */
#viewer{
  border-radius: 34px !important;
  border: 1px solid var(--ios-stroke) !important;
  box-shadow: var(--ios-shadow) !important;
}


/* =====================
   INDICADOR "ESPERA GIRANDO" EN FICHAS (V32)
===================== */

/* Spinner sutil en la esquina superior derecha */
.card,
.tool-card{
  position: relative;
}

.card::before,
.tool-card::before{
  content:"";
  position:absolute;
  top: 10px;
  right: 10px;
  width: 14px;
  height: 14px;
  border-radius: 999px;
  border: 2px solid color-mix(in srgb, var(--text-muted), transparent 55%);
  border-top-color: color-mix(in srgb, var(--brand), white 10%);
  opacity: .55;
  animation: spinWait 1.05s linear infinite;
  pointer-events:none;
}

/* Al hover, un pelín más visible (sin molestar) */
.card:hover::before,
.tool-card:hover::before{
  opacity: .8;
}

/* Si prefieres desactivar en móviles (opcional), comenta este bloque */
@media (max-width: 600px){
  .card::before, .tool-card::before{ opacity:.45; }
}

@keyframes spinWait{
  to{ transform: rotate(360deg); }
}


/* =====================
   CAMBIO TOTAL DE ESTÉTICA (V33) · Neo‑Brutal / Editorial
   - Tipografía fuerte
   - Bordes marcados
   - Colores sólidos
   - Sin glass / sin blur
   - Layout tipo “tarjetas póster”
===================== */

/* Import tipografía editorial */
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');

:root{
  --bg: #fff7ed;            /* crema */
  --surface: #ffffff;       /* blanco puro */
  --text-main: #111827;     /* casi negro */
  --text-muted: #334155;    /* slate */
  --brand: #ff3d8d;         /* magenta vivo */
  --accent: #00d1b2;        /* turquesa */
  --accent2: #fbbf24;       /* amarillo */
  --stroke: #111827;        /* borde negro */
  --shadow: 6px 6px 0 rgba(17,24,39,1);  /* sombra dura */
  --shadow-soft: 10px 12px 0 rgba(17,24,39,1);
  --radius: 18px;
}

/* Modo oscuro con la misma estética */
/* Reset de fondos/overlays anteriores */
body::before, body::after, .container::before, .container::after,
.float-shape, .widget-deco-2, .widget-deco-3{
  content: none !important;
  display:none !important;
}

body{
  font-family: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif !important;
  background:
    radial-gradient(1200px 500px at 12% 8%, color-mix(in srgb, var(--brand) 16%, transparent), transparent 60%),
    radial-gradient(900px 520px at 88% 20%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 62%),
    linear-gradient(180deg, var(--bg) 0%, color-mix(in srgb, var(--bg) 85%, white) 100%) !important;
  color: var(--text-main) !important;
  padding-top: 18px !important;
}

/* Navbar brutal + compacto */
.navbar{
  position: sticky;
  top: 14px !important;
  background: var(--surface) !important;
  border: 2.5px solid var(--stroke) !important;
  border-radius: var(--radius) !important;
  box-shadow: var(--shadow-soft) !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
}

.text-info h1{
  font-weight: 800 !important;
  letter-spacing: -0.03em !important;
}
.text-info h1 span{ color: var(--brand) !important; }
.text-info p.subtitle{
  color: var(--text-muted) !important;
  font-weight: 700 !important;
}

/* Perfil usuario como “etiqueta” */
.user-profile{
  background: color-mix(in srgb, var(--accent2) 22%, var(--surface)) !important;
  border: 2px solid var(--stroke) !important;
  box-shadow: var(--shadow) !important;
  border-radius: 999px !important;
}
.user-avatar{
  background: var(--brand) !important;
  border-radius: 999px !important;
}

/* Buscador estilo “input sticker” */
.search-input{
  background: var(--surface) !important;
  border: 2px solid var(--stroke) !important;
  border-radius: 999px !important;
  box-shadow: var(--shadow) !important;
  padding-left: 3.2rem !important;
}
.search-icon{ color: var(--stroke) !important; }

/* Botones cuadrados + sombra dura */
.action-btn{
  border: 2px solid var(--stroke) !important;
  background: var(--surface) !important;
  border-radius: 14px !important;
  box-shadow: var(--shadow) !important;
}
.action-btn.active{
  background: var(--brand) !important;
  color: white !important;
}
.action-btn:hover{
  transform: translate(-1px,-1px) !important;
}

/* Grid más aireado */
.grid{
  gap: 16px !important;
  padding: 8px 0 6rem !important;
}

/* Tarjetas tipo “póster” */
.card, .tool-card{
  background: var(--surface) !important;
  border: 2.5px solid var(--stroke) !important;
  border-radius: var(--radius) !important;
  box-shadow: var(--shadow) !important;
  padding: 14px 14px 14px 16px !important;
  min-height: 84px !important;
  transition: transform .15s ease, box-shadow .15s ease, background .15s ease !important;
}

/* franja lateral a color (diferente por tarjeta, usando el badge como pista) */
.card::before, .tool-card::before{
  content:"" !important;
  position:absolute !important;
  left: 10px !important;
  top: 12px !important;
  bottom: 12px !important;
  width: 8px !important;
  border-radius: 999px !important;
  background: linear-gradient(180deg, var(--brand), var(--accent)) !important;
  opacity: .95 !important;
  display:block !important;
}
.card, .tool-card{ padding-left: 28px !important; overflow:hidden !important; }

/* Hover: “salta” */
.card:hover, .tool-card:hover{
  transform: translate(-2px,-2px) !important;
  box-shadow: calc(6px + 2px) calc(6px + 2px) 0 rgba(17,24,39,1) !important;
}

/* Borde hover elegante (desactivamos el overlay anterior) */
.card::after, .tool-card::after{ content:none !important; }

/* Badge superior: ahora como “sticker” */
.badge.badge-theme{
  width: auto !important;
  height: auto !important;
  padding: 6px 10px !important;
  background: color-mix(in srgb, var(--accent2) 65%, white) !important;
  border: 2px solid var(--stroke) !important;
  border-radius: 999px !important;
  box-shadow: var(--shadow) !important;
  opacity: 1 !important;
}

/* Quitamos shimmer */
.badge.badge-theme::after{ content:none !important; animation:none !important; }

/* Títulos */
.card-title, .title, .tool-card .title{
  font-size: 0.95rem !important;
  font-weight: 800 !important;
  color: var(--text-main) !important;
  letter-spacing: -0.02em !important;
}

/* Subtítulos */
.subtitle, .tool-card .subtitle{
  color: var(--text-muted) !important;
  font-weight: 700 !important;
}

/* Botón eliminar rojo brutal */
.btn-delete{
  border-color: var(--stroke) !important;
  color: var(--stroke) !important;
  background: color-mix(in srgb, #ef4444 18%, var(--surface)) !important;
}
.btn-delete:hover{
  background: #ef4444 !important;
  color: #fff !important;
}

/* Modal viewer más limpio y con borde marcado */
#viewer{
  border-radius: 22px !important;
  border: 3px solid var(--stroke) !important;
  box-shadow: 16px 16px 0 rgba(17,24,39,1) !important;
}


/* =====================
   AJUSTE CONTRASTE BOTONES (V34)
===================== */

/* Botones base: texto siempre oscuro/claro según fondo */
.action-btn{
  color: var(--text-main) !important;
}

/* Botón activo (brand) */
.action-btn.active{
  background: var(--brand) !important;
  color: #ffffff !important;
}

/* Hover general */
.action-btn:hover{
  background: color-mix(in srgb, var(--brand) 18%, var(--surface)) !important;
  color: var(--text-main) !important;
}

/* Botones primarios */
.btn-primary{
  background: var(--brand) !important;
  color: #ffffff !important;
  border-color: var(--stroke) !important;
}
.btn-primary:hover{
  background: #e11d74 !important;
  color: #ffffff !important;
}

/* Botón eliminar */
.btn-delete{
  background: #ef4444 !important;
  color: #ffffff !important;
  border-color: var(--stroke) !important;
}
.btn-delete:hover{
  background: #b91c1c !important;
  color: #ffffff !important;
}

/* Botones secundarios claros */
.btn-secondary{
  background: var(--surface) !important;
  color: var(--text-main) !important;
}


/* =====================
   WCAG AA/AAA · Botones (V35)
   Nota: Para texto normal (≈14px) AAA requiere contraste >= 7:1
===================== */
:root{
  --brand-cta: #a02658;     /* magenta más oscuro: AAA con texto blanco */
  --brand-cta-hover:#8e224e;
  --danger-cta:#a60f0f;     /* rojo más oscuro: AAA con texto blanco */
  --danger-cta-hover:#7f1d1d;
}

/* En dark mantenemos la misma base (ya cumple); si quieres otro tono lo ajustamos aquí */
/* CTA / primarios: siempre AAA con blanco */
.btn-primary,
.action-btn.active{
  background: var(--brand-cta) !important;
  color: #ffffff !important;
}

.btn-primary:hover,
.action-btn.active:hover{
  background: var(--brand-cta-hover) !important;
  color: #ffffff !important;
}

/* Eliminar: AAA con blanco */
.btn-delete{
  background: var(--danger-cta) !important;
  color: #ffffff !important;
}
.btn-delete:hover{
  background: var(--danger-cta-hover) !important;
  color:#ffffff !important;
}

/* Hover de botones no-activos: aseguramos contraste manteniendo fondo claro */
.action-btn:hover:not(.active){
  background: color-mix(in srgb, var(--surface) 85%, var(--brand-cta)) !important;
  color: var(--text-main) !important;
}


/* =====================
   VERSIÓN FONDO BLANCO (V36)
   Minimal · Editorial · WCAG AAA
===================== */

:root{
  --bg: #ffffff;
  --surface: #ffffff;
  --text-main: #0f172a;
  --text-muted: #334155;

  --stroke: #0f172a;
  --shadow: 6px 6px 0 rgba(15,23,42,1);
  --shadow-soft: 10px 12px 0 rgba(15,23,42,1);
}

/* Fondo totalmente blanco */
body{
  background: #ffffff !important;
  color: var(--text-main) !important;
}

/* Elimina cualquier rastro decorativo */
body::before,
body::after{
  display:none !important;
}

/* Navbar blanca y nítida */

  background: #ffffff !important;
  border: 2.5px solid var(--stroke) !important;
  box-shadow: var(--shadow-soft) !important;
}

/* Panel central limpio */

  background: #ffffff !important;

}

/* Tarjetas sobre blanco */
.card,
.tool-card{
  background: #ffffff !important;
  border: 2.5px solid var(--stroke) !important;
  box-shadow: var(--shadow) !important;
}

/* Inputs */

  background: #ffffff !important;
  color: var(--text-main) !important;
  border: 2px solid var(--stroke) !important;
}

/* Botones neutros */
.action-btn{
  background: #ffffff !important;

}

/* Grid con más aire */
.grid{
  background: #ffffff !important;
}


/* =====================
   MODO TABLET AULA (V37)
   Objetivo: uso en clase con dedos + proyector
   - Targets táctiles grandes
   - Grid 2 columnas (o 1 si estrecho)
   - Menos micro-animaciones
   - Mejor contraste y jerarquía
===================== */

/* Activación manual */
html.classroom body{
  zoom: 1;
}

/* Detecta tablets/touch: aplica automáticamente si no hay ratón (pointer coarse) */
@media (pointer: coarse){
  body{ -webkit-tap-highlight-color: transparent; }
  .card:hover, .tool-card:hover, .action-btn:hover{ transform: none !important; }
}

/* Reglas base para modo aula (manual o auto por media query) */
html.classroom .navbar,
@media (min-width: 700px) and (max-width: 1200px) and (pointer: coarse){
  /* */
}

html.classroom .navbar{
  top: 10px !important;
}

html.classroom .action-btn{
  width: 52px !important;
  height: 52px !important;
  border-radius: 16px !important;
}

html.classroom .search-input{
  height: 54px !important;
  font-size: 1rem !important;
  padding: 0 18px 0 56px !important;
}

html.classroom .search-icon{
  left: 18px !important;
}

html.classroom .text-info h1{
  font-size: 1.05rem !important;
}
html.classroom .text-info p.subtitle{
  font-size: .9rem !important;
}

/* Grid: 2 columnas grandes en tablet; 1 en móvil */
html.classroom .grid{
  gap: 18px !important;
  padding: 14px 8px 6.5rem !important;
}
html.classroom .grid{
  grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
}
@media (max-width: 640px){
  html.classroom .grid{ grid-template-columns: 1fr !important; }
}

/* Tarjetas: tamaño “touch” */
html.classroom .card,
html.classroom .tool-card{
  min-height: 104px !important;
  padding: 18px 16px 18px 34px !important;
}

html.classroom .card-title,
html.classroom .title{
  font-size: 1.05rem !important;
}

html.classroom .subtitle{
  font-size: .95rem !important;
  line-height: 1.25 !important;
}

/* Botones de acción dentro de ficha: más grandes */

#classroomBtn.active{

}

===================== */

  color:#0f172a !important; /* casi negro */
}

/* =====================
   BOTONES ABRIR = COLOR DEL TEMA (V39)
===================== */

/* Botón de abrir recurso */
.card .action-btn,
.tool-card .action-btn{
  background: var(--brand-cta) !important;

}

/* Hover */
.card .action-btn:hover,
.tool-card .action-btn:hover{
  background: var(--brand-cta-hover) !important;
  color:#ffffff !important;
}

/* En modo oscuro mantiene contraste */
/* =====================
   SOMBRAS CON COLOR DEL TEMA (V40)
===================== */

/* Variables de sombra basadas en el color del tema */
:root{
  --shadow-brand-soft: 0 8px 24px color-mix(in srgb, var(--brand-cta) 35%, transparent);
  --shadow-brand: 0 12px 32px color-mix(in srgb, var(--brand-cta) 45%, transparent);
  --shadow-brand-strong: 0 18px 48px color-mix(in srgb, var(--brand-cta) 55%, transparent);
}

/* Botones: sombra del color del tema */
.card .action-btn,
.tool-card .action-btn{
  box-shadow: var(--shadow-brand-soft) !important;
}
.card .action-btn:hover,
.tool-card .action-btn:hover{
  box-shadow: var(--shadow-brand) !important;
}

/* Tarjetas: sombra sutil teñida con el color del tema */
.card,
.tool-card{
  box-shadow: var(--shadow-brand-soft) !important;
}
.card:hover,
.tool-card:hover{
  box-shadow: var(--shadow-brand-strong) !important;
}

/* Navbar y panel central */
.navbar{
  box-shadow: var(--shadow-brand-soft) !important;
}
.container::before{
  box-shadow: var(--shadow-brand) !important;
}


/* =====================
   REFINO PROFESIONAL · FONDO + SOMBRA 3D (V41)
===================== */

/* Fondo más profesional (ligero, neutro, sin “amarilleo”) */
:root{
  --pro-bg: #f6f7fb;                 /* gris muy suave */
  --pro-bg-2:#ffffff;                /* blanco limpio */
  --pro-surface: #ffffff;

  /* Sombras 3D modernas (suaves) con tinte del tema */
  --card-3d:
    0 14px 30px color-mix(in srgb, var(--brand-cta) 14%, rgba(2,6,23,0.16)),
    0 2px 0 rgba(255,255,255,0.85) inset;
  --card-3d-hover:
    0 18px 42px color-mix(in srgb, var(--brand-cta) 18%, rgba(2,6,23,0.18)),
    0 2px 0 rgba(255,255,255,0.88) inset;

  --nav-3d:
    0 16px 34px rgba(2,6,23,0.10),
    0 2px 0 rgba(255,255,255,0.85) inset;
}

/* Dark: fondo profundo + sombras realistas */
/* Aplica fondo */
body{
  background: linear-gradient(180deg, var(--pro-bg-2) 0%, var(--pro-bg) 100%) !important;
}

/* Navbar + panel central: más “premium” */
.navbar{
  background: var(--pro-bg-2) !important;
  box-shadow: var(--nav-3d) !important;
}
/* Panel central (si existe pseudo panel) */
.container::before{
  background: color-mix(in srgb, var(--pro-bg-2) 88%, transparent) !important;
  box-shadow: var(--nav-3d) !important;
}

/* Tarjetas: 3D suave (sin sombra “dura”) */
.card,
.tool-card{
  background: var(--pro-surface) !important;
  box-shadow: var(--card-3d) !important;
  border-color: color-mix(in srgb, var(--stroke) 16%, transparent) !important;
}

/* Hover */
.card:hover,
.tool-card:hover{
  box-shadow: var(--card-3d-hover) !important;
}

/* Botones: sombra coherente pero discreta */
.card .action-btn,
.tool-card .action-btn{
  box-shadow:
    0 10px 22px color-mix(in srgb, var(--brand-cta) 22%, transparent) !important;
}
.card .action-btn:hover,
.tool-card .action-btn:hover{
  box-shadow:
    0 14px 30px color-mix(in srgb, var(--brand-cta) 28%, transparent) !important;
}

/* Reduce “ruido” de sombras globales anteriores (si quedaron) */
:root{
  --shadow-brand-soft: none;
  --shadow-brand: none;
  --shadow-brand-strong: none;
}


/* =====================
   BOTONES ABRIR + FAVORITOS · COLOR DEL TEMA (V42)
===================== */

/* Botón Abrir dentro de fichas */
.card .action-btn:not(.btn-delete),
.tool-card .action-btn:not(.btn-delete){
  background: var(--brand-cta) !important;
  color: #ffffff !important;
  border-color: transparent !important;
  box-shadow:
    0 10px 22px color-mix(in srgb, var(--brand-cta) 28%, transparent) !important;
}

/* Hover Abrir */
.card .action-btn:not(.btn-delete):hover,
.tool-card .action-btn:not(.btn-delete):hover{
  background: var(--brand-cta-hover) !important;
  color:#ffffff !important;
}

/* Botón Favoritos (estado activo) */
.action-btn.active{
  background: var(--brand-cta) !important;
  color:#ffffff !important;
  box-shadow:
    0 8px 20px color-mix(in srgb, var(--brand-cta) 26%, transparent) !important;
}

/* Favoritos inactivo: versión suave del color del tema */
.action-btn:not(.active){
  background: color-mix(in srgb, var(--brand-cta) 14%, #ffffff) !important;
  color: var(--brand-cta) !important;
  border-color: transparent !important;
}

/* Dark mode ajustes */

/* =====================
   PALETA PROFESIONAL DE FICHAS (V45)
   Objetivo: sobria, educativa, limpia
===================== */

:root{
  /* Paleta base profesional */
  --brand-cta:#2563eb;          /* azul académico */
  --brand-cta-hover:#1d4ed8;

  --accent-soft:#e0e7ff;        /* azul muy claro */
  --accent-soft-2:#f1f5f9;      /* gris frío */

  --card-bg:#ffffff;
  --card-border:#cbd5e1;        /* gris profesional */
  --card-title:#0f172a;         /* casi negro */
  --card-subtitle:#475569;      /* gris medio */

  --shadow-card:
    0 8px 22px rgba(2,6,23,0.08),
    0 1px 0 rgba(255,255,255,0.9) inset;
  --shadow-card-hover:
    0 14px 34px rgba(2,6,23,0.12),
    0 1px 0 rgba(255,255,255,0.95) inset;
}

/* Fichas */
.card,
.tool-card{
  background: var(--card-bg) !important;
  border: 1.5px solid var(--card-border) !important;
  box-shadow: var(--shadow-card) !important;
}

/* Hover sobrio */
.card:hover,
.tool-card:hover{
  box-shadow: var(--shadow-card-hover) !important;
}

/* Títulos y texto */
.card-title,
.title{
  color: var(--card-title) !important;
  font-weight: 700 !important;
}
.subtitle{
  color: var(--card-subtitle) !important;
}

/* Badge superior: discreto */
.badge.badge-theme{
  background: linear-gradient(90deg, #2563eb, #60a5fa) !important;
  box-shadow: none !important;
  height: 8px !important;
}

/* Botón abrir profesional */
.card .action-btn,
.tool-card .action-btn{
  background: var(--brand-cta) !important;
  color: #ffffff !important;
  border-radius: 10px !important;
  box-shadow:
    0 6px 16px rgba(37,99,235,0.35) !important;
}
.card .action-btn:hover,
.tool-card .action-btn:hover{
  background: var(--brand-cta-hover) !important;
}

/* Favoritos */
.action-btn.active{
  background: var(--brand-cta) !important;
  color:#fff !important;
}
.action-btn:not(.active){
  background: var(--accent-soft) !important;
  color: var(--brand-cta) !important;
}


/* =====================
   SPINNER -> ESFERA (V46)
===================== */

/* Sustituye el indicador giratorio por una esfera (glossy) */
.card::before,
.tool-card::before{
  content:"" !important;
  position:absolute !important;
  top: 10px !important;
  right: 10px !important;
  width: 14px !important;
  height: 14px !important;
  border-radius: 999px !important;
  border: none !important;

  /* Esfera con brillo */
  background:
    radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.35) 28%, rgba(255,255,255,0.0) 55%),
    radial-gradient(circle at 70% 75%, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0.0) 55%),
    conic-gradient(from 0deg,
      color-mix(in srgb, var(--brand-cta) 95%, #ffffff) 0%,
      color-mix(in srgb, var(--brand-cta) 70%, #ffffff) 25%,
      color-mix(in srgb, var(--brand-cta) 95%, #ffffff) 50%,
      color-mix(in srgb, var(--brand-cta) 70%, #ffffff) 75%,
      color-mix(in srgb, var(--brand-cta) 95%, #ffffff) 100%
    );

  box-shadow:
    0 6px 14px rgba(2,6,23,0.14),
    inset 0 1px 2px rgba(255,255,255,0.65),
    inset 0 -2px 4px rgba(0,0,0,0.18);

  opacity: .85 !important;
  pointer-events:none !important;

  /* Animación sutil (giro del brillo) */
  animation: sphereSpin 1.8s linear infinite !important;
}

/* Un poco más visible al hover */
.card:hover::before,
.tool-card:hover::before{
  opacity: 1 !important;
  transform: scale(1.05);
}

@keyframes sphereSpin{
  to{ transform: rotate(360deg); }
}


/* =====================
   LIMPIEZA + MINIMALISMO FINAL (V48)
===================== */

/* Elimina decoraciones extra */
.card::before,
.tool-card::before{
  display:none !important;
}

/* Fichas ultra limpias */
.card,
.tool-card{
  background:#ffffff !important;
  border:1px solid #e2e8f0 !important;
  box-shadow: 0 4px 14px rgba(2,6,23,0.06) !important;
  border-radius:14px !important;
}

/* Hover muy sutil */
.card:hover,
.tool-card:hover{
  box-shadow: 0 8px 22px rgba(2,6,23,0.08) !important;
  transform: translateY(-1px);
}

/* Barra superior casi invisible */
.badge.badge-theme{
  height:4px !important;
  opacity:.85 !important;
}

/* Botón abrir minimal */
.card .action-btn,
.tool-card .action-btn{
  background:#2563eb !important;
  color:#ffffff !important;
  border-radius:999px !important;
  font-size:0.8rem !important;
  padding:6px 12px !important;
  box-shadow:none !important;
}

/* Botón favoritos discreto */
.action-btn:not(.active){
  background:transparent !important;
  color:#2563eb !important;
  border:1px solid #2563eb !important;
}
.action-btn.active{
  background:#2563eb !important;
  color:#ffffff !important;
}

/* Tipografía contenida */
.card-title{
  font-size:0.95rem !important;
  font-weight:600 !important;
}
.subtitle{
  font-size:0.8rem !important;
  color:#64748b !important;
}

/* Grid más aireado */
.grid{
  gap:18px !important;
}


/* =====================
   SUBTÍTULO MÁS OSCURO (V49)
===================== */

.subtitle,
.tool-card .subtitle{
  color: #334155 !important; /* gris más oscuro, WCAG AA */
  font-weight: 500 !important;
}


/* =====================
   HEADER MODERNIZADO (V50)
===================== */

.navbar{
  background: rgba(255,255,255,0.9) !important;
  backdrop-filter: saturate(180%) blur(10px);
  -webkit-backdrop-filter: saturate(180%) blur(10px);

}

/* =====================
   HEADER PRO (TIPOGRAFÍA + SOMBRAS) · V51
===================== */

/* Sombra del header: más profesional, multicapa */
.navbar{

}

.text-info p.subtitle{

  line-height: 1.2 !important;
  font-weight: 520 !important;

/* Botones del header: relieve sutil */
.navbar .action-btn{

}

}


/* =====================
   FICHAS CON EFECTO METÁLICO (V52)
===================== */

/* Superficie metálica clara */
.card,
.tool-card{
  background:
    linear-gradient(
      135deg,
      #f8fafc 0%,
      #e5e7eb 20%,
      #ffffff 45%,
      #e5e7eb 70%,
      #f8fafc 100%
    ) !important;

  border: 1px solid rgba(148,163,184,0.45) !important;

  box-shadow:
    0 6px 18px rgba(2,6,23,0.12),
    inset 0 1px 0 rgba(255,255,255,0.9),
    inset 0 -1px 0 rgba(0,0,0,0.06) !important;
}

/* Hover: brillo metálico ligeramente desplazado */
.card:hover,
.tool-card:hover{
  background:
    linear-gradient(
      135deg,
      #ffffff 0%,
      #e2e8f0 22%,
      #f8fafc 50%,
      #e2e8f0 78%,
      #ffffff 100%
    ) !important;

  box-shadow:
    0 10px 28px rgba(2,6,23,0.16),
    inset 0 1px 0 rgba(255,255,255,0.95),
    inset 0 -1px 0 rgba(0,0,0,0.08) !important;
}

/* Mantener legibilidad del contenido */
.card-title,
.subtitle{
  position: relative;
  z-index: 1;
}


/* =====================
   BOTÓN "ABRIR" (y CTA) EN 3D (V53)
===================== */

/* 3D para botones CTA dentro de fichas (excluye eliminar) */
.card .action-btn:not(.btn-delete),
.tool-card .action-btn:not(.btn-delete){
  position: relative;
  transform: translateY(-1px);
  background:
    linear-gradient(180deg,
      color-mix(in srgb, var(--brand-cta) 92%, white 8%) 0%,
      var(--brand-cta) 55%,
      color-mix(in srgb, var(--brand-cta) 88%, black 12%) 100%
    ) !important;

  border: 1px solid color-mix(in srgb, var(--brand-cta) 55%, black 45%) !important;

  box-shadow:
    0 10px 0 color-mix(in srgb, var(--brand-cta) 40%, black 60%),
    0 14px 28px rgba(2,6,23,0.18),
    inset 0 1px 0 rgba(255,255,255,0.40),
    inset 0 -2px 0 rgba(0,0,0,0.18) !important;

  transition: transform .12s ease, box-shadow .12s ease, filter .12s ease !important;
}

/* Brillo superior tipo “cap” */
.card .action-btn:not(.btn-delete)::after,
.tool-card .action-btn:not(.btn-delete)::after{
  content:"";
  position:absolute;
  left:10%;
  right:10%;
  top:18%;
  height:36%;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0.0));
  opacity: .9;
  pointer-events:none;
}

/* Hover: más “levantado” */
.card .action-btn:not(.btn-delete):hover,
.tool-card .action-btn:not(.btn-delete):hover{
  transform: translateY(-2px);
  filter: saturate(1.05);
  box-shadow:
    0 11px 0 color-mix(in srgb, var(--brand-cta) 38%, black 62%),
    0 18px 34px rgba(2,6,23,0.22),
    inset 0 1px 0 rgba(255,255,255,0.45),
    inset 0 -2px 0 rgba(0,0,0,0.20) !important;
}

/* Active (click): efecto “presionado” */
.card .action-btn:not(.btn-delete):active,
.tool-card .action-btn:not(.btn-delete):active{
  transform: translateY(6px);
  box-shadow:
    0 4px 0 color-mix(in srgb, var(--brand-cta) 40%, black 60%),
    0 10px 18px rgba(2,6,23,0.18),
    inset 0 1px 0 rgba(255,255,255,0.35),
    inset 0 -2px 0 rgba(0,0,0,0.22) !important;
}


/* =====================
   SINCRONIZA FICHAS CON EL TEMA (V54)
   - Metal tintado con el color del tema
   - CTA hereda del tema
===================== */

/* Asegura que el CTA use el tema seleccionado */
:root{
  --brand-cta: var(--brand);
  --brand-cta-hover: color-mix(in srgb, var(--brand) 82%, black 18%);
}

/* Metal “aluminio” tintado por el tema */
.card,
.tool-card{
  background:
    linear-gradient(
      135deg,
      color-mix(in srgb, #ffffff 92%, var(--brand) 8%) 0%,
      color-mix(in srgb, #e5e7eb 88%, var(--brand) 12%) 20%,
      color-mix(in srgb, #ffffff 86%, var(--brand) 14%) 45%,
      color-mix(in srgb, #e5e7eb 88%, var(--brand) 12%) 70%,
      color-mix(in srgb, #f8fafc 92%, var(--brand) 8%) 100%
    ) !important;

  border: 1px solid color-mix(in srgb, #94a3b8 55%, var(--brand) 45%) !important;

  box-shadow:
    0 8px 22px color-mix(in srgb, rgba(2,6,23,0.14) 70%, var(--brand) 30%),
    inset 0 1px 0 rgba(255,255,255,0.92),
    inset 0 -1px 0 rgba(0,0,0,0.06) !important;
}

.card:hover,
.tool-card:hover{
  background:
    linear-gradient(
      135deg,
      color-mix(in srgb, #ffffff 90%, var(--brand) 10%) 0%,
      color-mix(in srgb, #e2e8f0 86%, var(--brand) 14%) 22%,
      color-mix(in srgb, #f8fafc 84%, var(--brand) 16%) 50%,
      color-mix(in srgb, #e2e8f0 86%, var(--brand) 14%) 78%,
      color-mix(in srgb, #ffffff 90%, var(--brand) 10%) 100%
    ) !important;

  box-shadow:
    0 12px 30px color-mix(in srgb, rgba(2,6,23,0.18) 70%, var(--brand) 30%),
    inset 0 1px 0 rgba(255,255,255,0.95),
    inset 0 -1px 0 rgba(0,0,0,0.08) !important;
}

/* Barra/indicador superior alineado al tema */
.badge.badge-theme{
  background: linear-gradient(90deg, var(--brand), color-mix(in srgb, var(--brand) 55%, white 45%)) !important;
}

/* Favoritos: inactivo más sobrio pero temático */
.action-btn:not(.active){
  background: color-mix(in srgb, var(--brand) 12%, #ffffff) !important;
  color: color-mix(in srgb, var(--brand) 90%, black 10%) !important;
  border: 1px solid color-mix(in srgb, var(--brand) 55%, #ffffff 45%) !important;
}
.action-btn.active{
  background: var(--brand) !important;
  color:#fff !important;
}


/* =====================
   FAVORITOS SIN SOMBRA 3D (V55)
===================== */

/* Quita relieve/sombra 3D solo al botón de favoritos */
.card .action-btn.favorite,
.tool-card .action-btn.favorite,
.card .action-btn[data-fav],
.tool-card .action-btn[data-fav]{
  box-shadow: none !important;
  transform: none !important;
}

/* Hover limpio */
.card .action-btn.favorite:hover,
.tool-card .action-btn.favorite:hover,
.card .action-btn[data-fav]:hover,
.tool-card .action-btn[data-fav]:hover{
  box-shadow: none !important;
}


/* =====================
   FAVORITOS EN FICHAS · MINIMAL + PRO (V56)
   - Solo icono
   - Sin sombras
   - Borde fino
   - Activo: fondo del tema, icono blanco
===================== */

.card .action-btn.fav-card-btn,
.tool-card .action-btn.fav-card-btn{
  width: 40px !important;
  height: 40px !important;
  border-radius: 999px !important;

  background: transparent !important;
  border: 1px solid color-mix(in srgb, var(--brand) 55%, rgba(15,23,42,0.22) 45%) !important;
  color: color-mix(in srgb, var(--brand) 85%, rgba(2,6,23,1) 15%) !important;

  box-shadow: none !important;
  transform: none !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;

  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;

  transition: background .15s ease, border-color .15s ease, transform .15s ease, color .15s ease !important;
}

.card .action-btn.fav-card-btn:hover,
.tool-card .action-btn.fav-card-btn:hover{
  background: color-mix(in srgb, var(--brand) 10%, transparent) !important;
  border-color: color-mix(in srgb, var(--brand) 70%, rgba(15,23,42,0.22) 30%) !important;
  box-shadow: none !important;
  transform: translateY(-1px) !important;
}

/* Activo: sólido, limpio */
.card .action-btn.fav-card-btn.active,
.tool-card .action-btn.fav-card-btn.active{
  background: var(--brand) !important;
  border-color: var(--brand) !important;
  color: #ffffff !important;
  box-shadow: none !important;
  transform: none !important;
}

/* En activo, forzamos el corazón relleno en blanco */
.card .action-btn.fav-card-btn.active svg,
.tool-card .action-btn.fav-card-btn.active svg{
  fill: currentColor !important;
}

/* Tamaño de icono consistente */
.card .action-btn.fav-card-btn svg,
.tool-card .action-btn.fav-card-btn svg{
  width: 18px !important;
  height: 18px !important;
}


/* =====================
   ABRIR EN FICHAS · MINIMAL + 3D MODERNO (V57)
   - Pastilla limpia
   - Profundidad suave (no “pedestal” duro)
   - Press real
===================== */

.card .action-btn.open-card-btn,
.tool-card .action-btn.open-card-btn{
  height: 40px !important;
  padding: 0 14px !important;
  border-radius: 999px !important;

  background:
    linear-gradient(180deg,
      color-mix(in srgb, var(--brand) 84%, #ffffff 16%) 0%,
      var(--brand) 100%
    ) !important;

  color: #ffffff !important;
  border: 1px solid color-mix(in srgb, var(--brand) 55%, rgba(2,6,23,0.45) 45%) !important;

  /* 3D suave (shadow + inner highlight) */
  box-shadow:
    0 10px 18px rgba(2,6,23,0.14),
    0 2px 0 rgba(255,255,255,0.25) inset,
    0 -2px 0 rgba(2,6,23,0.14) inset !important;

  transform: translateY(-1px);
  transition: transform .12s ease, box-shadow .12s ease, filter .12s ease !important;

  font-weight: 650 !important;
  letter-spacing: -0.01em !important;
}

/* Brillo superior sutil */
.card .action-btn.open-card-btn::after,
.tool-card .action-btn.open-card-btn::after{
  content:"";
  position:absolute;
  inset: 2px 10px auto 10px;
  height: 42%;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,0.38), rgba(255,255,255,0));
  pointer-events:none;
  opacity: .9;
}

/* Hover */
.card .action-btn.open-card-btn:hover,
.tool-card .action-btn.open-card-btn:hover{
  filter: saturate(1.05);
  transform: translateY(-2px);
  box-shadow:
    0 14px 26px rgba(2,6,23,0.18),
    0 2px 0 rgba(255,255,255,0.28) inset,
    0 -2px 0 rgba(2,6,23,0.16) inset !important;
}

/* Press */
.card .action-btn.open-card-btn:active,
.tool-card .action-btn.open-card-btn:active{
  transform: translateY(2px);
  box-shadow:
    0 8px 14px rgba(2,6,23,0.18),
    0 2px 0 rgba(255,255,255,0.18) inset,
    0 -2px 0 rgba(2,6,23,0.20) inset !important;
}

/* Si el texto del botón incluye "Abrir · Título", lo hacemos más compacto */
.card .action-btn.open-card-btn{
  font-size: 0.82rem !important;
  gap: 8px;
  white-space: nowrap;
  max-width: 100%;
}


/* =====================
   REPASO FINAL ABRIR 3D (V58)
   Selector robusto (sin depender de clases)
===================== */

/* Modern browsers: botón que contiene texto 'Abrir' */
@supports selector(button:has(span)){
  .card button:has(:is(span,svg,em,strong)):not(.fav-card-btn),
  .tool-card button:has(:is(span,svg,em,strong)):not(.fav-card-btn){
    /* noop safeguard */
  }
}

/* Fallback universal: primer botón de acción en la ficha = ABRIR */
.card .actions .action-btn:first-of-type,
.tool-card .actions .action-btn:first-of-type{
  height: 40px !important;
  padding: 0 14px !important;
  border-radius: 999px !important;

  background:
    linear-gradient(180deg,
      color-mix(in srgb, var(--brand) 84%, #ffffff 16%) 0%,
      var(--brand) 100%
    ) !important;

  color:#ffffff !important;
  border:1px solid color-mix(in srgb, var(--brand) 55%, rgba(2,6,23,0.45) 45%) !important;

  box-shadow:
    0 10px 18px rgba(2,6,23,0.14),
    0 2px 0 rgba(255,255,255,0.25) inset,
    0 -2px 0 rgba(2,6,23,0.14) inset !important;

  transform: translateY(-1px);
  transition: transform .12s ease, box-shadow .12s ease, filter .12s ease !important;

  font-weight: 650 !important;
  letter-spacing: -0.01em !important;
  font-size: .82rem !important;
}

/* Hover */
.card .actions .action-btn:first-of-type:hover,
.tool-card .actions .action-btn:first-of-type:hover{
  filter: saturate(1.05);
  transform: translateY(-2px);
  box-shadow:
    0 14px 26px rgba(2,6,23,0.18),
    0 2px 0 rgba(255,255,255,0.28) inset,
    0 -2px 0 rgba(2,6,23,0.16) inset !important;
}

/* Active */
.card .actions .action-btn:first-of-type:active,
.tool-card .actions .action-btn:first-of-type:active{
  transform: translateY(2px);
  box-shadow:
    0 8px 14px rgba(2,6,23,0.18),
    0 2px 0 rgba(255,255,255,0.18) inset,
    0 -2px 0 rgba(2,6,23,0.20) inset !important;
}


/* =====================
   ABRIR SIN BORDE NEGRO (V59)
===================== */

/* Elimina el borde oscuro del botón ABRIR */
.card .actions .action-btn:first-of-type,
.tool-card .actions .action-btn:first-of-type{
  border: none !important;
}

/* Mantiene definición solo con sombra */
.card .actions .action-btn:first-of-type{
  outline: none !important;
}


/* =====================
   SOMBRA DE FICHAS PROFESIONAL (V60)
   - Más suave
   - Multicapa
   - Sin efecto “flotante excesivo”
===================== */

.card,
.tool-card{
  box-shadow:
    0 1px 2px rgba(2,6,23,0.06),
    0 8px 20px rgba(2,6,23,0.10),
    0 20px 40px rgba(2,6,23,0.08) !important;
}

/* Hover muy sutil */
.card:hover,
.tool-card:hover{
  box-shadow:
    0 2px 4px rgba(2,6,23,0.08),
    0 10px 24px rgba(2,6,23,0.12),
    0 24px 48px rgba(2,6,23,0.10) !important;
}


/* =====================
   INDICADOR SUPERIOR MÁS PROFESIONAL (V61)
   Sustituye el “dibujo” superior por un marcador limpio (dot + línea)
===================== */

.badge.badge-theme{
  position: relative !important;
  width: 10px !important;
  height: 10px !important;
  border-radius: 999px !important;

  background: var(--brand) !important;
  opacity: 1 !important;

  /* halo muy sutil */
  box-shadow:
    0 0 0 4px color-mix(in srgb, var(--brand) 14%, transparent) !important;

  /* anula estilos anteriores */
  padding: 0 !important;
  border: none !important;
  overflow: visible !important;
}

.badge.badge-theme::after{
  content:"";
  position:absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 48px;
  height: 2px;
  border-radius: 999px;
  background: linear-gradient(
    90deg,
    color-mix(in srgb, var(--brand) 45%, transparent),
    transparent
  );
  opacity: .95;
}

/* Si existía shimmer, lo desactivamos */
.badge.badge-theme::before{
  content: none !important;
}


/* =====================
   ANIMACIÓN ELEGANTE INDICADOR (V62)
===================== */

/* Pulso suave del punto */
@keyframes dotPulse {
  0%, 100% { transform: translateZ(0) scale(1); opacity: 1; }
  50%      { transform: translateZ(0) scale(1.18); opacity: .92; }
}

/* Barrido sutil en la línea */
@keyframes lineSweep {
  0%   { background-position: 0% 50%; opacity: .75; }
  50%  { background-position: 100% 50%; opacity: 1; }
  100% { background-position: 0% 50%; opacity: .75; }
}

.badge.badge-theme{
  animation: dotPulse 2.6s ease-in-out infinite;
  will-change: transform, opacity;
}

/* Línea con brillo desplazándose */
.badge.badge-theme::after{
  background: linear-gradient(
    90deg,
    transparent,
    color-mix(in srgb, var(--brand) 55%, transparent),
    transparent
  ) !important;
  background-size: 200% 100% !important;
  animation: lineSweep 3.2s ease-in-out infinite;
  will-change: background-position, opacity;
}

/* Reduce movimiento si el usuario lo solicita */
@media (prefers-reduced-motion: reduce){
  .badge.badge-theme,
  .badge.badge-theme::after{
    animation: none !important;
  }
}

</style>
</head>

function b64ToUtf8(b64){
  const bin = atob(b64);
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}

/* ========= IndexedDB (para guardar archivos grandes en un HTML suelto) ========= */
const IDB_DB_NAME = "ef_resources_db_v1";
const IDB_STORE = "files";

function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) {
        db.createObjectStore(IDB_STORE, { keyPath: "id" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbPut(record) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(record);
    tx.oncomplete = () => { db.close(); resolve(true); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  });
}

async function idbGet(id) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readonly");
    const req = tx.objectStore(IDB_STORE).get(id);
    req.onsuccess = () => { db.close(); resolve(req.result || null); };
    req.onerror = () => { db.close(); reject(req.error); };
  });
}

async function idbDelete(id) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).delete(id);
    tx.oncomplete = () => { db.close(); resolve(true); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  });
}


async function idbDel(id) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).delete(id);
    tx.oncomplete = () => { db.close(); resolve(true); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  });
}

function makeIdbId() {
  // crypto.randomUUID no existe en navegadores antiguos
  return "idb:" + (crypto?.randomUUID ? crypto.randomUUID() : (Date.now() + "-" + Math.random().toString(16).slice(2)));
}

let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playTick() {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
    gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.05);
}

  // src puede ser URL normal, dataURL, o idb:<uuid>

  // Limpieza previa
  frame.removeAttribute('srcdoc');
  frame.src = 'about:blank';

  // Helper local
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, ch => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[ch]));
  }

  function canIframe(mime){
    return mime === "application/pdf" || mime.startsWith("image/") || mime === "text/html";
  }

  // 1) Si viene de IndexedDB, construimos un Blob URL
  if (typeof src === "string" && src.startsWith("idb:")) {
    const rec = await idbGet(src);
    if (!rec || !rec.blob) {
      frame.srcdoc = `<div style="padding:18px; font-family: system-ui;">No se encontró el archivo en el almacenamiento del navegador.</div>`;
      currentResourceUrl = null;
    } else {
      const blobUrl = URL.createObjectURL(rec.blob);
      currentResourceUrl = blobUrl;

      const mime = (rec.mime || "application/octet-stream").toLowerCase();

      if (mime === "text/html") {
        // Para HTML: leer como texto y usar srcdoc (evita limitaciones de navegación)
        const htmlText = await rec.blob.text();
        frame.srcdoc = htmlText;
      } else if (mime.startsWith("text/")) {
        const text = await rec.blob.text();
        frame.srcdoc = `
          <div style="padding:18px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;">
            <h3 style="margin:0 0 10px 0; font-family: inherit;">Vista previa (texto)</h3>
            <pre style="white-space: pre-wrap; background:#f8fafc; border:1px solid #e2e8f0; padding:12px; border-radius:12px;">${escapeHtml(text)}</pre>
          </div>
        `;
      } else if (canIframe(mime)) {
        frame.src = blobUrl;
      } else {
        // No previsualizable: mostramos acciones
        frame.srcdoc = `
          <div style="padding:22px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;">
            <h3 style="margin:0 0 8px 0;">Este tipo de archivo no se puede previsualizar aquí</h3>
            <p style="margin:0 0 14px 0; color:#64748b; font-weight:700;">
              Tipo: <span style="color:#0f172a; font-weight:900;">${escapeHtml(mime)}</span>
            </p>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
              <a href="${blobUrl}" target="_blank"
                 style="display:inline-flex; align-items:center; gap:8px; padding:10px 14px; border-radius:14px; background:#0ea5e9; color:white; text-decoration:none; font-weight:900;">
                 Abrir en nueva ventana
              </a>
              <a href="${blobUrl}" download="${escapeHtml(rec.filename || title)}"
                 style="display:inline-flex; align-items:center; gap:8px; padding:10px 14px; border-radius:14px; background:#f1f5f9; color:#0f172a; text-decoration:none; font-weight:900; border:1px solid #e2e8f0;">
                 Descargar
              </a>
            </div>
            <p style="margin-top:14px; color:#94a3b8; font-weight:700; font-size:0.85rem;">
              Nota: el enlace temporal (blob) se libera al cerrar el visor o recargar.
            </p>
          </div>
        `;
      }
    }

  // 2) DataURL (por compatibilidad con recursos embebidos o antiguos)
  } else if (isDataUrl(src)) {
    currentResourceUrl = src;
    frame.src = src;

  // 3) Recursos internos embebidos por clave
  } else if (EMBEDDED_B64[src]) {
    currentResourceUrl = src;
    frame.srcdoc = b64ToUtf8(EMBEDDED_B64[src]);

  // 4) URL normal
  } else {
    currentResourceUrl = src;
    frame.src = src;
  }

  v.style.display = 'flex';
  document.getElementById('overlay').style.display = 'block';
  setTimeout(() => v.classList.add('open'), 10);
}

function closeModal() {
  const v = document.getElementById('viewer');
  const frame = document.getElementById('vFrame');
  v.classList.remove('open');
  document.getElementById('overlay').style.display = 'none';

  // Liberar blob URLs (si el recurso viene de IndexedDB)
  try {
    if (typeof currentResourceUrl === "string" && currentResourceUrl.startsWith("blob:")) {
      URL.revokeObjectURL(currentResourceUrl);
    }
  } catch(e) {}
  currentResourceUrl = null;

  setTimeout(() => { 
    v.style.display = 'none'; 
    frame.src = 'about:blank'; 
    frame.removeAttribute('srcdoc');
  }, 400);
}

function closeAllModals() { closeModal(); closeAddResourceModal(); return false; }

document.getElementById('fullScreenBtn').onclick = () => {
  if(!currentResourceUrl) return;

  if (isDataUrl(currentResourceUrl)) {
    window.open(currentResourceUrl, '_blank');
    return;
  }

  if (EMBEDDED_B64[currentResourceUrl]) {
    const html = b64ToUtf8(EMBEDDED_B64[currentResourceUrl]);
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    // Nota: el navegador liberará el blob cuando cierre la pestaña; aún así lo revocamos al rato
    setTimeout(() => URL.revokeObjectURL(url), 60_000);
    return;
  }

  window.open(currentResourceUrl, '_blank');
};
document.getElementById('searchInput').oninput = (e) => { searchTerm = e.target.value; render(); };

function toggleFav(n) {
  if (favs.includes(n)) favs = favs.filter(f => f !== n);
  else favs.push(n);
  localStorage.setItem('ef_favs_v8', JSON.stringify(favs));
  render();
}

document.getElementById('sortBtn').onclick = (e) => { 
    isAZ = !isAZ; 
    e.currentTarget.classList.toggle('active', isAZ); 
    render(); 
};

document.getElementById('favBtn').onclick = (e) => { 
    showFavs = !showFavs; 
    e.currentTarget.classList.toggle('active', showFavs); 
    render(); 
};

document.getElementById('styleBtn').onclick = () => {
  const colors = ['c1', 'c2', 'c3', 'c8'];
  const current = document.documentElement.getAttribute('data-color');
  document.documentElement.setAttribute('data-color', colors[(colors.indexOf(current) + 1) % colors.length]);
};

window.onload = render;
</script>

<script>
function openAddResourceModal(){
  document.getElementById("overlay").style.display = "block";
  document.getElementById("addResourceModal").classList.add("open");
  // foco
  setTimeout(() => document.getElementById("newName")?.focus(), 50);
}
function closeAddResourceModal(){
  document.getElementById("overlay").style.display = "none";
  document.getElementById("addResourceModal").classList.remove("open");
}
async function addResource(){
  const name = document.getElementById("newName").value.trim();
  const link = document.getElementById("newLink").value.trim();
  const fileInput = document.getElementById("newUpload");
  const file = fileInput?.files?.[0] || null;

  if(!name){ alert("Escribe un nombre para el recurso"); return; }
  if(!file && !link){ alert("Adjunta un archivo o añade un enlace/archivo"); return; }

  try{
    // Caso 1: archivo adjunto (se guarda en IndexedDB y se referencia con idb:)
    if(file){
      const id = "idb:" + (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + "_" + Math.random().toString(16).slice(2));
      await idbPut({
        id,
        blob: file,
        mime: (file.type || "application/octet-stream"),
        filename: file.name
      });

      customTools.push({ id, name, custom:true });
    } else {
      // Caso 2: enlace o archivo existente (ruta relativa/URL)
      customTools.push({ id: link, name, custom:true });
    }

    localStorage.setItem('ef_custom_tools_v1', JSON.stringify(customTools));

    // limpiar
    document.getElementById("newName").value = "";
    document.getElementById("newLink").value = "";
    if(fileInput) fileInput.value = "";

    render();
    closeAddResourceModal();
  } catch(err){
    console.error(err);
    alert("No se pudo guardar el recurso. Revisa el tipo de archivo o el almacenamiento del navegador.");
  }
}

async function deleteCustomTool(id){
  if(!confirm("¿Eliminar este recurso?")) return;

  try{
    // eliminar de la lista
    customTools = (customTools || []).filter(t => t.id !== id);
    localStorage.setItem('ef_custom_tools_v1', JSON.stringify(customTools));

    // si es un adjunto guardado en IndexedDB, eliminamos también el blob
    if(String(id).startsWith("idb:")){
      await idbDelete(id);
    }

    render();
  } catch(err){
    console.error(err);
    alert("No se pudo eliminar el recurso.");
  }
}

</script>
<div id="addResourceModal" class="modal-window" style="width:460px;background:white;border-radius:26px;padding:22px;">
  <h3 style="font-weight:900;margin-bottom:6px">Nuevo recurso</h3>
  <p style="margin:0 0 14px;color:#64748b;font-weight:750;font-size:0.85rem">
    Añade un recurso desde tu ordenador o pega un enlace (URL) / nombre de archivo.
  </p>

  <div style="display:flex;flex-direction:column;gap:12px">
    <input id="newName" class="search-input" placeholder="Nombre del recurso">

    <!-- Subida de archivo -->
    <div style="display:flex;gap:10px;align-items:center">
      <label for="newUpload" class="btn-primary" style="flex:0 0 auto; padding:0.75rem 1rem;">
        Adjuntar archivo
      </label>
      <input id="newUpload" type="file" style="display:none"
             accept=".html,.htm,.pdf,.png,.jpg,.jpeg,.webp,.gif,.txt,.md">
      <span id="fileHint" style="font-size:0.8rem;color:#64748b;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;">
        Ningún archivo seleccionado
      </span>
    </div>

    <div style="display:flex;align-items:center;gap:10px">
      <div style="height:1px;background:#e2e8f0;flex:1"></div>
      <span style="font-size:0.75rem;color:#94a3b8;font-weight:900;letter-spacing:.08em;text-transform:uppercase">o</span>
      <div style="height:1px;background:#e2e8f0;flex:1"></div>
    </div>

    <!-- Enlace o archivo existente -->
    <input id="newLink" class="search-input" placeholder="URL o archivo (ej: mi-recurso.html)">
  </div>

  <div style="display:flex;gap:10px;margin-top:18px">
    <button class="btn-primary" onclick="addResource()">Guardar</button>
    <button class="btn-primary btn-delete" onclick="closeAddResourceModal()">Cancelar</button>
  </div>
</div>

<script>
// feedback del nombre de archivo seleccionado
(function(){
  const input = document.getElementById("newUpload");
  const hint = document.getElementById("fileHint");
  if(!input || !hint) return;
  input.addEventListener("change", () => {
    const f = input.files && input.files[0];
    hint.textContent = f ? f.name : "Ningún archivo seleccionado";
    // si elige archivo, vaciamos el link para evitar confusiones
    if(f) {
      const link = document.getElementById("newLink");
      if(link) link.value = "";
    }
  });
})();

// ===== Modo tablet aula =====
const classroomBtn = document.getElementById('classroomBtn');
(function initClassroom(){
  const saved = localStorage.getItem('ef_classroom_v1');
  if(saved === '1'){
    document.documentElement.classList.add('classroom');
    if(classroomBtn) classroomBtn.classList.add('active');
  }
})();

function toggleClassroom(){
  const on = document.documentElement.classList.toggle('classroom');
  localStorage.setItem('ef_classroom_v1', on ? '1' : '0');
  if(classroomBtn) classroomBtn.classList.toggle('active', on);
}

if(classroomBtn){
  classroomBtn.addEventListener('click', toggleClassroom);
}

</script>
