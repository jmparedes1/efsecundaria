<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Probabilidades · PREMIR</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* =====================
   SISTEMA DE DISEÑO PRO
===================== */
:root {
  --bg: #f8fafc;
  --text: #0f172a;
  --muted: #64748b;
  --glass: #ffffff;
  --glass-border: #e2e8f0;
  --primary: #003865; /* Azul PREMIR */
  --primary-light: #0062a8;
  --accent: #2563eb;
  --danger: #e11d48;
  --warning: #f59e0b;
  --success: #10b981;
  
  --shadow-lg: 0 20px 25px -5px rgba(15, 23, 42, 0.12);
  --radius: 24px;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  padding: 20px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  background-color: var(--bg);
  background-image: 
    radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.05) 0px, transparent 50%),
    radial-gradient(at 100% 100%, rgba(0, 56, 101, 0.05) 0px, transparent 50%);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.shell {
  width: 100%;
  max-width: 540px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  position: relative;
}

/* Header con Logo Actualizado */
header {
  padding: 40px 32px 24px;
  text-align: center;
  border-bottom: 1px solid #f1f5f9;
  background: linear-gradient(to bottom, #ffffff, #fcfdfe);
}

.logo-container {
  margin-bottom: 24px;
}

.logo-container img {
  height: 2cm;
  width: auto;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.03));
}

header h1 {
  margin: 0;
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--primary);
  letter-spacing: -0.025em;
}

header p {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 0.95rem;
}

/* Formulario */
.content {
  padding: 32px;
}

.input-grid {
  display: flex;
  flex-direction: column;
  gap: 20px;
  margin-bottom: 32px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.field label {
  font-size: 0.875rem;
  font-weight: 700;
  color: var(--text);
  padding-left: 4px;
}

input[type="number"] {
  width: 100%;
  padding: 16px;
  font-size: 1.05rem;
  font-weight: 600;
  font-family: inherit;
  border: 2px solid #f1f5f9;
  border-radius: 16px;
  background: #f8fafc;
  transition: all 0.2s ease;
  color: var(--text);
  outline: none;
}

input:focus {
  border-color: var(--accent);
  background: #fff;
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
}

.btn-calculate {
  width: 100%;
  padding: 18px;
  border: none;
  border-radius: 16px;
  background: var(--primary);
  color: white;
  font-size: 1.1rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  box-shadow: 0 4px 12px rgba(0, 56, 101, 0.2);
}

.btn-calculate:hover {
  background: var(--primary-light);
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(0, 56, 101, 0.25);
}

/* Resultados dinámicos */
#result-area {
  margin-top: 32px;
  padding: 28px;
  border-radius: 20px;
  text-align: center;
  display: none;
  animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}

.result-positive { background: #ecfdf5; border: 1px solid #d1fae5; color: var(--success); }
.result-negative { background: #fff1f2; border: 1px solid #ffe4e6; color: var(--danger); }
.result-warning { background: #fffbeb; border: 1px solid #fef3c7; color: var(--warning); }

@keyframes slideIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.result-label {
  display: block;
  font-size: 0.85rem;
  font-weight: 800;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  opacity: 0.7;
}

.result-value {
  font-size: 3.8rem;
  font-weight: 800;
  line-height: 1;
  margin: 10px 0;
  letter-spacing: -0.02em;
}

.result-msg {
  font-size: 1.1rem;
  color: var(--text);
  line-height: 1.4;
  font-weight: 700;
  margin-top: 16px;
}

.advice-box {
  margin-top: 12px;
  font-size: 0.95rem;
  font-weight: 500;
  line-height: 1.5;
  color: var(--muted);
}

footer {
  padding: 24px;
  text-align: center;
  background: #fcfdfe;
  border-top: 1px solid #f1f5f9;
}

.copyright {
  font-size: 0.85rem;
  color: var(--muted);
  font-weight: 600;
}

.loader {
  width: 22px; height: 22px;
  border: 3px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  border-top-color: white;
  animation: spin 0.8s linear infinite;
  display: none;
}

@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 480px) {
  body { padding: 10px; }
  .shell { border-radius: 0; min-height: 100vh; }
  .content { padding: 24px; }
}
</style>
</head>
<body>

<div class="shell">
  <header>
    <div class="logo-container">
      <!-- Logo Oficial solicitado -->
      <img src="https://www.salvour.com/s/cc_images/teaserbox_2491734547.gif?t=1767110894">
    </div>
    <h1>Calculadora de Probabilidades</h1>
        <p style="font-size:0.75rem;color:#64748b;margin-top:6px;">Profesor: José Manuel Paredes</p>
  </header>

  <main class="content">
    <form id="probForm">
      <div class="input-grid">
        <div class="field">
          <label for="totalTopics">Total de temas del temario</label>
          <input type="number" id="totalTopics" value="65" min="1" required>
        </div>
        
        <div class="field">
          <label for="preparedTopics">Temas que llevas preparados</label>
          <input type="number" id="preparedTopics" placeholder="Ej: 50" min="0" required>
        </div>

        <div class="field">
          <label for="extractedBalls">Bolas que se extraen (Sorteo)</label>
          <input type="number" id="extractedBalls" value="4" min="1" required>
        </div>
      </div>

      <button type="submit" class="btn-calculate" id="submitBtn">
        <span class="btn-text">Verificar Probabilidad</span>
        <div class="loader" id="loader"></div>
      </button>
    </form>

    <div id="result-area">
      <span class="result-label">Cálculo Estadístico</span>
      <div class="result-value" id="percentage">0%</div>
      <p class="result-msg" id="message"></p>
      <div class="advice-box" id="advice"></div>
    </div>
  </main>

  <footer>
    <div class="copyright"></div>
  </footer>
</div>

<script>
// Lógica de combinatoria
function combination(n, k) {
  if (k < 0 || k > n) return 0;
  if (k === 0 || k === n) return 1;
  if (k > n / 2) k = n - k;
  let result = 1;
  for (let i = 1; i <= k; i++) {
    result *= (n - i + 1);
    result /= i;
  }
  return result;
}

const form = document.getElementById('probForm');
const resultArea = document.getElementById('result-area');
const percentageDisplay = document.getElementById('percentage');
const messageDisplay = document.getElementById('message');
const adviceDisplay = document.getElementById('advice');
const submitBtn = document.getElementById('submitBtn');
const loader = document.getElementById('loader');
const btnText = submitBtn.querySelector('.btn-text');

form.addEventListener('submit', (e) => {
  e.preventDefault();
  
  // UI Loading state
  btnText.style.opacity = '0';
  loader.style.display = 'block';
  submitBtn.disabled = true;
  resultArea.style.display = 'none';

  setTimeout(() => {
    const N = parseInt(document.getElementById('totalTopics').value);
    const m = parseInt(document.getElementById('preparedTopics').value);
    const n = parseInt(document.getElementById('extractedBalls').value);

    // Validación básica
    if (m > N || n > N) {
      alert("Error: Revisa los datos introducidos.");
      resetButton();
      return;
    }

    const noPreparados = N - m;
    let probExito;
    
    if (noPreparados < n) {
      probExito = 1;
    } else {
      const combTotales = combination(N, n);
      const combFracaso = combination(noPreparados, n);
      probExito = 1 - (combFracaso / combTotales);
    }

    const finalPerc = (probExito * 100).toFixed(2);
    percentageDisplay.textContent = finalPerc + '%';
    
    // Limpiar clases previas
    resultArea.classList.remove('result-positive', 'result-negative', 'result-warning');

    // LÓGICA DE MENSAJES EXIGENTES
    if (probExito >= 0.98) {
      // SOLO POSITIVO SI ES >= 98%
      resultArea.classList.add('result-positive');
      messageDisplay.textContent = "¡Nivel de excelencia PREMIR!";
      adviceDisplay.textContent = "Has alcanzado la zona de seguridad. Sigue repasando para mantener la frescura de los contenidos y la plaza será tuya.";
    } else if (probExito >= 0.90) {
      // COMENTARIO NEGATIVO / ADVERTENCIA (90-97.9%)
      resultArea.classList.add('result-warning');
      messageDisplay.textContent = "Riesgo detectado. No es suficiente.";
      adviceDisplay.textContent = "Aunque parece alto, ese margen de error puede dejarte fuera. En PREMIR no nos la jugamos: estudia 4 o 5 temas más para llegar al 98%.";
    } else if (probExito >= 0.70) {
      // COMENTARIO NEGATIVO (70-89.9%)
      resultArea.classList.add('result-negative');
      messageDisplay.textContent = "Preparación muy arriesgada.";
      adviceDisplay.textContent = "Estás dejando tu futuro en manos de la suerte. Tienes que aumentar el ritmo de estudio y ampliar temas inmediatamente.";
    } else {
      // MUY NEGATIVO (< 70%)
      resultArea.classList.add('result-negative');
      messageDisplay.textContent = "Situación crítica.";
      adviceDisplay.textContent = "Con este número de temas las probabilidades están en tu contra. ¡No te rindas! Todavía puedes reaccionar y doblar tu esfuerzo este mes.";
    }

    resultArea.style.display = 'block';
    resetButton();
    resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 600);
});

function resetButton() {
  btnText.style.opacity = '1';
  loader.style.display = 'none';
  submitBtn.disabled = false;
}
</script>

</body>
</html>
