<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>PREMIR · Objetivos ESO (Compacto)</title>

  <style>
    :root{
      --bg: #f6f8fc;
      --bg2:#ffffff;
      --panel:#ffffff;
      --border:#d5dced;
      --text:#0b1220;
      --muted:#516079;
      --primary:#2563eb;
      --primary-2:#1d4ed8;
      --primary-soft:#e8efff;
      --ok:#15803d;
      --bad:#b91c1c;
      --warn:#a16207;

      --radius:22px;
      --shadow: 0 14px 40px rgba(2, 6, 23, .12);
      --shadow-soft: 0 6px 18px rgba(2, 6, 23, .10);
      --focus: 0 0 0 4px rgba(37,99,235,.22);
    }
    [data-theme="dark"]{
      --bg:#070a12;
      --bg2:#0b1020;
      --panel:#0b1220;
      --border:#1f2a44;
      --text:#e8eefc;
      --muted:#a7b3cf;
      --primary:#60a5fa;
      --primary-2:#3b82f6;
      --primary-soft:rgba(96,165,250,.12);
      --shadow: 0 18px 55px rgba(0, 0, 0, .50);
      --shadow-soft: 0 10px 25px rgba(0, 0, 0, .38);
      --focus: 0 0 0 4px rgba(96,165,250,.25);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial;
      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(37,99,235,.14), transparent 60%),
        radial-gradient(900px 500px at 95% 10%, rgba(99,102,241,.10), transparent 55%),
        linear-gradient(180deg,var(--bg2) 0%, var(--bg) 100%);
      color:var(--text);
      background-attachment: fixed;
    }

    /* Header */
    header{
      position: sticky; 
      top: 12px; 
      z-index: 100;
      margin: 12px auto;
      max-width: 1400px;
      width: calc(100% - 24px);
      backdrop-filter: saturate(150%) blur(12px);
      background: color-mix(in srgb, var(--bg2) 85%, transparent);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .header-inner{
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand{ display:flex; align-items:center; gap:14px; }
    .logo{height:1.5cm; width:auto}
    .title-wrap{display:flex;flex-direction:column;gap:1px}
    h1{font-size:16px;margin:0;font-weight:850;letter-spacing:.2px}
    .subtitle{font-size:11px;color:var(--muted)}

    .prof-card-3d {
      background: linear-gradient(145deg, var(--bg2), color-mix(in srgb, var(--bg), #000 2%));
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 12px;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.04);
      border-bottom: 2px solid color-mix(in srgb, var(--primary) 30%, var(--border));
      text-align: right;
    }
    .prof-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 800; }
    .prof-val { font-size: 13px; font-weight: 850; color: var(--primary); }

    /* Toolbar */
    .toolbar{
      max-width:1400px;
      margin: 0 auto 12px;
      padding: 0 18px;
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
    }
    .btn{
      appearance:none; border:1px solid var(--border);
      background:color-mix(in srgb, var(--panel) 90%, transparent);
      color:var(--text); padding:6px 12px; border-radius:999px;
      font-weight:750; font-size:11px; cursor:pointer;
      transition: all .15s ease; display:inline-flex; align-items:center; gap:6px;
    }
    .btn.primary{
      background:linear-gradient(180deg,var(--primary) 0%, var(--primary-2) 100%);
      color:#fff; border-color:var(--primary);
    }
    .btn:hover{transform:translateY(-1px); box-shadow:var(--shadow-soft); border-color:var(--primary)}

    .chip{
      display:inline-flex; align-items:center; gap:8px; padding:6px 12px;
      border-radius:999px; background:var(--panel);
      border:1px solid var(--border); font-size:12px; font-weight:650;
    }
    .dot{width:7px;height:7px;border-radius:50%;background:#94a3b8}
    .dot.ok{background:var(--ok)}
    .dot.warn{background:var(--warn)}

    .spacer{flex:1}
    .stat{ display:flex; gap:8px; align-items:center; color:var(--muted); font-size:11px; font-weight:650; }

    .progress{
      width:120px; height:8px; border-radius:999px;
      background:var(--border); overflow:hidden;
    }
    .progress > div{
      height:100%; width:0%;
      background:linear-gradient(90deg,var(--primary), #22c55e);
      transition:width .4s ease;
    }

    /* Layout */
    .wrap{
      max-width:1400px; margin:0 auto; padding:0 12px 20px;
      display:flex; flex-direction: column; gap:16px;
    }

    .panel{
      background:color-mix(in srgb, var(--panel) 92%, transparent);
      border:1px solid var(--border); border-radius:18px;
      box-shadow:var(--shadow); padding:16px;
    }
    .panel-head{ margin-bottom:12px; }
    .panel h2{ margin:0; font-size:11px; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); font-weight: 800; }

    /* Cuadrícula compacta de 4 Columnas */
    .cards, .targets { 
      display:grid; 
      grid-template-columns: repeat(4, 1fr); 
      gap:8px; 
    }

    @media (max-width: 1200px) { .cards, .targets { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 900px) { .cards, .targets { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .cards, .targets { grid-template-columns: 1fr; } }

    /* Tarjetas Compactas */
    .card{
      background:var(--panel);
      border:1px solid var(--border); border-radius:10px;
      padding:8px 10px; cursor:grab; user-select:none;
      transition: all .15s ease; display:flex; align-items:center;
      min-height: 0; /* Espacio mínimo */
    }
    .card:hover{ border-color:var(--primary); transform: translateY(-1px); }
    .card.selected{ border-color:var(--primary); background:var(--primary-soft); }
    .card p{margin:0; font-size:12px; font-weight:700; line-height:1.2; flex:1}
    .card .meta{display:none} /* Ocultamos meta para ahorrar altura */

    .dropzone{
      border:1px dashed var(--border);
      border-radius:14px; padding:10px; min-height: 0;
    }

    .target{
      background:color-mix(in srgb, var(--primary-soft) 25%, transparent);
      border:1px solid var(--border); border-radius:14px;
      padding:6px 10px; min-height: 0; display:flex; flex-direction:row; align-items:center; gap:10px;
      transition:all .2s ease; position:relative;
    }
    .target.over{ border-color:var(--primary); background:var(--primary-soft); }
    
    .letter{
      width:24px; height:24px; border-radius:6px;
      background:var(--primary); color:#fff;
      display:flex; align-items:center; justify-content:center;
      font-weight:900; font-size:12px; flex-shrink: 0;
    }
    .slot{flex:1; display:flex; flex-direction:column; min-height: 36px; justify-content: center;}
    .mark{
      position:absolute; right:-5px; top:-5px;
      font-size:10px; font-weight:900; width:20px; height:20px;
      border-radius:50%; border:1px solid var(--border);
      display:none; align-items: center; justify-content: center;
      z-index: 10;
    }
    .target.correct .mark{ display:flex; color:var(--ok); border-color:var(--ok); background:#f0fdf4; }
    .target.wrong .mark{ display:flex; color:var(--bad); border-color:var(--bad); background:#fef2f2; }

    .toast{
      position:fixed; left:50%; bottom:20px; transform:translateX(-50%);
      background:var(--panel); border:1px solid var(--border);
      box-shadow:var(--shadow); border-radius:999px;
      padding:10px 20px; font-size:12px; font-weight:800;
      opacity:0; transition: all .3s ease; 
      pointer-events:none; z-index:1000;
    }
    .toast.show{ opacity:1; transform:translateX(-50%) translateY(-5px); }

    @media print{ header, .toolbar, .toast { display:none!important } }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <img src="https://www.salvour.com/s/cc_images/teaserbox_2491734547.gif?t=1767110894" class="logo" alt="Logo Premir"/>
      <div class="title-wrap">
        <h1>Objetivos de etapa · ESO</h1>
        <div class="subtitle">Asociación interactiva compacta</div>
      </div>
    </div>
    <div class="prof-card-3d">
      <div class="prof-label">Docente</div>
      <div class="prof-val">José Manuel Paredes</div>
    </div>
  </div>
</header>

<div class="toolbar">
  <button class="btn" id="shuffleBtn">🔀 Mezclar</button>
  <button class="btn" id="resetBtn">↩️ Reiniciar</button>
  <button class="btn" id="hintBtn">✅ Corregir</button>
  <button class="btn primary" id="checkBtn">🏁 Finalizar</button>
  <button class="btn" id="solveBtn">🧩 Solución</button>

  <span class="chip">
    <span class="dot" id="dot"></span>
    <span id="badgeText">Sin empezar</span>
  </span>

  <span class="chip">
    <span class="stat" id="scoreText">0/14</span>
    <span class="progress"><div id="progressBar"></div></span>
  </span>

  <span class="spacer"></span>

  <span class="chip">
    <span class="stat">⏱ <span id="timer">00:00</span></span>
  </span>
  
  <button class="btn" id="themeBtn">🌓</button>
</div>

<div class="wrap">
  <!-- MÓDULO SUPERIOR -->
  <section class="panel">
    <div class="panel-head"><h2>Objetivos Disponibles</h2></div>
    <div class="dropzone" id="pool">
      <div class="cards" id="cards"></div>
    </div>
  </section>

  <!-- MÓDULO INFERIOR -->
  <section class="panel">
    <div class="panel-head"><h2>Panel de Asociación</h2></div>
    <div class="targets" id="targets"></div>
  </section>
</div>

<div class="toast" id="toast">Listo</div>

<script>
  let audioCtx = null;
  function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

  function playSound(type) {
    try {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      if (type === 'ok') {
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1); 
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      } else {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      }
      osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    } catch(e) {}
  }

  const objectives = [
    ["a","Ciudadanía democrática y derechos"], ["b","Disciplina y trabajo"],
    ["c","Igualdad de género"], ["d","Convivencia pacífica"],
    ["e","Competencia digital crítica"], ["f","Método científico integrado"],
    ["g","Autonomía y emprendimiento"], ["h","Comunicación y literatura bilingüe"],
    ["i","Lenguas extranjeras"], ["j","Cultura e historia"],
    ["k","Salud, cuerpo, EF y deporte"], ["l","Expresión artística"],
    ["m","Patrimonio y diversidad gallegas"], ["n","Lengua gallega e identidad"]
  ];

  let placement = {};
  let gameStarted = false;
  let startTime = 0;
  let timerInterval = null;
  let selectedLetter = null;

  const cardsEl = document.getElementById("cards");
  const targetsEl = document.getElementById("targets");
  const timerEl = document.getElementById("timer");
  const progressBar = document.getElementById("progressBar");
  const scoreText = document.getElementById("scoreText");

  function fmtTime(ms) {
    const s = Math.floor(ms / 1000);
    const mm = String(Math.floor(s/60)).padStart(2,"0");
    const ss = String(s%60).padStart(2,"0");
    return `${mm}:${ss}`;
  }

  function toast(msg, type="") {
    const t = document.getElementById("toast");
    t.textContent = msg; t.className = `toast show ${type}`;
    setTimeout(() => t.classList.remove("show"), 2000);
  }

  function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function startTimer() {
    if (gameStarted) return;
    gameStarted = true; startTime = Date.now();
    timerInterval = setInterval(() => { timerEl.textContent = fmtTime(Date.now() - startTime); }, 1000);
    document.getElementById("dot").className = "dot warn";
    document.getElementById("badgeText").textContent = "En curso...";
  }

  function render() {
    cardsEl.innerHTML = ""; targetsEl.innerHTML = "";
    const placedValues = Object.values(placement);
    let available = objectives.filter(obj => !placedValues.includes(obj[0]));
    available = shuffleArray(available);
    
    available.forEach(([l, t]) => cardsEl.appendChild(createCard(l, t)));
    
    objectives.forEach(([l]) => {
      const target = createTarget(l);
      targetsEl.appendChild(target);
      if (placement[l]) {
        const fullObj = objectives.find(o => o[0] === placement[l]);
        target.querySelector(".slot").appendChild(createCard(fullObj[0], fullObj[1], true));
      }
    });
    updateStats();
  }

  function createCard(l, t, inSlot = false) {
    const div = document.createElement("div");
    div.className = `card ${selectedLetter === l ? 'selected' : ''}`;
    div.draggable = true;
    div.innerHTML = `<p>${t}</p>`;
    div.ondragstart = (e) => { startTimer(); e.dataTransfer.setData("text", l); };
    div.onclick = () => { startTimer(); selectedLetter = (selectedLetter === l) ? null : l; render(); };
    return div;
  }

  function createTarget(l) {
    const div = document.createElement("div");
    div.className = "target";
    div.innerHTML = `<div class="letter">${l}</div><div class="slot"></div><div class="mark"></div>`;
    div.ondragover = (e) => { e.preventDefault(); div.classList.add("over"); };
    div.ondragleave = () => div.classList.remove("over");
    div.ondrop = (e) => { e.preventDefault(); div.classList.remove("over"); handlePlace(e.dataTransfer.getData("text"), l); };
    div.onclick = () => { if (selectedLetter) { handlePlace(selectedLetter, l); selectedLetter = null; } };
    return div;
  }

  function handlePlace(objLetter, targetLetter) {
    for (let key in placement) if (placement[key] === objLetter) delete placement[key];
    placement[targetLetter] = objLetter;
    render();
  }

  function updateStats() {
    let correct = 0;
    for (let key in placement) if (key === placement[key]) correct++;
    scoreText.textContent = `${correct}/${objectives.length}`;
    progressBar.style.width = `${(correct/objectives.length)*100}%`;
  }

  function check(isFinal = false) {
    let correctCount = 0;
    document.querySelectorAll(".target").forEach(t => {
      const l = t.querySelector(".letter").textContent;
      const p = placement[l];
      t.classList.remove("correct", "wrong");
      if (p) {
        if (p === l) { t.classList.add("correct"); t.querySelector(".mark").textContent = "✓"; correctCount++; }
        else { t.classList.add("wrong"); t.querySelector(".mark").textContent = "✕"; }
      }
    });

    if (correctCount === objectives.length) {
      clearInterval(timerInterval); playSound('ok');
      toast("¡Perfecto!", "ok");
      document.getElementById("dot").className = "dot ok";
      document.getElementById("badgeText").textContent = "Completado";
    } else if (isFinal || correctCount > 0) {
      playSound('bad');
      toast(isFinal ? `Aciertos: ${correctCount}/14` : "Revisa errores", "bad");
    }
  }

  document.getElementById("hintBtn").onclick = () => check(false);
  document.getElementById("checkBtn").onclick = () => check(true);
  document.getElementById("resetBtn").onclick = () => {
    clearInterval(timerInterval); gameStarted = false; placement = {}; timerEl.textContent = "00:00";
    document.getElementById("dot").className = "dot";
    document.getElementById("badgeText").textContent = "Sin empezar";
    render(); toast("Reiniciado");
  };
  document.getElementById("solveBtn").onclick = () => {
    objectives.forEach(o => placement[o[0]] = o[0]); render(); check(true);
  };
  document.getElementById("shuffleBtn").onclick = () => { render(); toast("Mezcladas"); };
  document.getElementById("themeBtn").onclick = () => {
    const dark = document.documentElement.getAttribute("data-theme") === "dark";
    document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  };

  render();
</script>
</body>
</html>
