        let activeExam = 'tema26';

        function loadExam(examId) {
            activeExam = examId;
            const buttons = ['tema26', 'tema27', 'tema28', 'tema29', 'tema30', 'tema31', 'tema32', 'tema33', 'tema34', 'tema35', 'tema36'];
            
            buttons.forEach(id => {
                const btn = document.getElementById('btn' + id.slice(-2));
                if(btn) {
                    if(id === examId) {
                        btn.className = "tab-btn px-4 py-2 bg-blue-600 text-white rounded-lg font-semibold shadow";
                    } else {
                        btn.className = "tab-btn px-4 py-2 bg-gray-200 text-gray-700 rounded-lg font-semibold hover:bg-gray-300";
                    }
                }
            });

            const container = document.getElementById('questionsContainer');
            container.innerHTML = "";
            document.getElementById('results').classList.add('hidden');
            
            data[examId].forEach((item, index) => {
                container.innerHTML += `
                    <div class="p-4 border rounded-lg bg-gray-50">
                        <p class="mb-3 font-medium text-gray-700">${item.q}</p>
                        <div class="flex gap-4">
                            <label><input type="radio" name="q${index}" value="true" class="mr-1"> Verdadero</label>
                            <label><input type="radio" name="q${index}" value="false" class="mr-1"> Falso</label>
                        </div>
                    </div>
                `;
            });
        }

        function evaluateQuiz() {
            let score = 0;
            const feedbackContainer = document.getElementById('feedbackContainer');
            feedbackContainer.innerHTML = "";
            
            data[activeExam].forEach((item, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                const isCorrect = selected && (selected.value === item.a.toString());
                if (isCorrect) score++;

                feedbackContainer.innerHTML += `
                    <div class="p-4 border-l-4 ${isCorrect ? 'border-green-500 bg-green-50' : 'border-red-500 bg-red-50'}">
                        <p class="font-bold">Pregunta ${index + 1}: ${isCorrect ? 'Correcto' : 'Incorrecto'}</p>
                        <p class="text-sm text-gray-600 mt-1"><strong>Justificación:</strong> ${item.j}</p>
                    </div>
                `;
            });

            document.getElementById('score').innerText = `Tu puntuación: ${score} / 10`;
            document.getElementById('results').classList.remove('hidden');
            window.scrollTo(0, document.body.scrollHeight);
        }

        loadExam('tema26');
    </script>
</body>
</html>
