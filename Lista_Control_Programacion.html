            const darkBtn = document.getElementById('btn-dark');

            const prev = document.getElementById('float-prev');
            const next = document.getElementById('float-next');
            const exit = document.getElementById('float-exit');
            const fb = document.getElementById('floatbar');
            if (fb) fb.setAttribute('aria-hidden', document.body.classList.contains('presentation-mode') ? 'false' : 'true');

            if (prev) prev.addEventListener('click', () => scrollToSectionByIndex(currentSectionIdx - 1));
            if (next) next.addEventListener('click', () => scrollToSectionByIndex(currentSectionIdx + 1));
            if (exit) exit.addEventListener('click', () => window.togglePresentationMode && window.togglePresentationMode());

        });

    
        // Encabezado: desaparece al bajar y reaparece suavemente al subir
        (function () {
            const header = document.querySelector('.xunta-header');
            if (!header) return;

            let lastY = window.scrollY || 0;
            let ticking = false;

            // estado inicial
            header.classList.add('is-shown');

            const onScroll = () => {
                const y = window.scrollY || document.documentElement.scrollTop;

                // Si estamos cerca del top, siempre visible
                if (y < 20) {
                    header.classList.remove('is-hidden');
                    header.classList.add('is-shown');
                    lastY = y;
                    return;
                }

                // Determina dirección
                const goingDown = y > lastY;

                if (goingDown && y > 80) {
                    header.classList.add('is-hidden');
                    header.classList.remove('is-shown');
                } else {
                    header.classList.remove('is-hidden');
                    header.classList.add('is-shown');
                }

                lastY = y;
            };

            window.addEventListener('scroll', () => {
                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        onScroll();
                        ticking = false;
                    });
                    ticking = true;
                }
            }, { passive: true });

            // En modo proyector, preferimos siempre visible (puedes cambiarlo si quieres)
            const syncForProjector = () => {
                if (document.body.classList.contains('presentation-mode')) {
                    header.classList.remove('is-hidden');
                    header.classList.add('is-shown');
                }
            };

            // hook: si existe toggle proyector, re-sincroniza
            const oldToggle = window.togglePresentationMode;
            if (oldToggle) {
                window.togglePresentationMode = function () {
                    oldToggle();
                    syncForProjector();
                };
            }
        })();

            const exit = document.getElementById('float-exit');
            const fb = document.getElementById('floatbar');
            if (fb) fb.setAttribute('aria-hidden', document.body.classList.contains('presentation-mode') ? 'false' : 'true');

            if (prev) prev.addEventListener('click', () => scrollToSectionByIndex(currentSectionIdx - 1));
            if (next) next.addEventListener('click', () => scrollToSectionByIndex(currentSectionIdx + 1));
            if (exit) exit.addEventListener('click', () => window.togglePresentationMode && window.togglePresentationMode());

            syncModeIcons();
        });

    
        // Encabezado: desaparece al bajar y reaparece suavemente al subir
        (function () {
            const header = document.querySelector('.xunta-header');
            if (!header) return;

            let lastY = window.scrollY || 0;
            let ticking = false;

            // estado inicial
            header.classList.add('is-shown');

            const onScroll = () => {
                const y = window.scrollY || document.documentElement.scrollTop;

                // Si estamos cerca del top, siempre visible
                if (y < 20) {
                    header.classList.remove('is-hidden');
                    header.classList.add('is-shown');
                    lastY = y;
                    return;
                }

                // Determina dirección
                const goingDown = y > lastY;

                if (goingDown && y > 80) {
                    header.classList.add('is-hidden');
                    header.classList.remove('is-shown');
                } else {
                    header.classList.remove('is-hidden');
                    header.classList.add('is-shown');
                }

                lastY = y;
            };

            window.addEventListener('scroll', () => {
                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        onScroll();
                        ticking = false;
                    });
                    ticking = true;
                }
            }, { passive: true });

            // En modo proyector, preferimos siempre visible (puedes cambiarlo si quieres)
            const syncForProjector = () => {
                if (document.body.classList.contains('presentation-mode')) {
                    header.classList.remove('is-hidden');
                    header.classList.add('is-shown');
                }
            };

            // hook: si existe toggle proyector, re-sincroniza
            const oldToggle = window.togglePresentationMode;
            if (oldToggle) {
                window.togglePresentationMode = function () {
                    oldToggle();
                    syncForProjector();
                };
            }
        })();

            const essentialLabel = (sec) => {

                    '71': '7.1 Transversais',
                    '72': '7.2 Actividades',
                    '81': '8.1 Práctica',
                    '82': '8.2 Mellora',
                    'vf': 'Final'
                };
                if (byId[sec.id]) return byId[sec.id];

                // Fallback: conserva numeración e colle 1–2 palabras clave
                const full = String(sec.fullTitle || '').replace(/\s+/g, ' ').trim();
                const last = full.includes('—') ? full.split('—').pop().trim() : full;
                const m = last.match(/^([0-9]+(?:\.[0-9]+)*)(?:\.)?\s+(.*)$/);
                if (m) {
                    const num = m[1];
                    const words = (m[2] || '').split(' ').filter(Boolean).slice(0, 2).join(' ');
                    return (num + ' ' + words).trim();
                }
                return last.split(' ').filter(Boolean).slice(0, 2).join(' ');
            };

            // Construcción de botones con tooltip personalizado (texto completo arriba)
            barContainer.innerHTML = sections.map(sec => `
                <div id="seg-${sec.id}"
                     class="segment-tag"
                     onclick="scrollToSection('${sec.id}')"
                     data-full="${String(sec.fullTitle || '').replace(/"/g,'&quot;')}">
                    ${essentialLabel(sec)}
                </div>
            `).join('');

            const tip = document.getElementById('seg-tooltip');

            const positionTip = (el) => {
                const full = el.getAttribute('data-full') || '';
                tip.textContent = full;
                tip.classList.remove('hidden');

                const r = el.getBoundingClientRect();
                const tw = tip.offsetWidth;
                const th = tip.offsetHeight;

                let left = r.left + (r.width / 2) - (tw / 2);
                left = Math.max(8, Math.min(left, window.innerWidth - tw - 8));

                let top = r.top - th - 8; // encima
                if (top < 8) top = r.bottom + 8; // si no cabe, debajo

                tip.style.left = left + 'px';
                tip.style.top = top + 'px';
            };

            const hideTip = () => tip.classList.add('hidden');

            barContainer.querySelectorAll('.segment-tag').forEach(el => {
                el.addEventListener('mouseenter', () => positionTip(el));
                el.addEventListener('mousemove', () => positionTip(el));
                el.addEventListener('mouseleave', hideTip);
                el.addEventListener('focus', () => positionTip(el));
                el.addEventListener('blur', hideTip);
            });

render();
            updateAllProgress();
        }

        function scrollToSection(id) {
            const element = document.getElementById(`section-${id}`);
            if (element) {
                const offset = 180; // Ajuste para el header fijo
                const bodyRect = document.body.getBoundingClientRect().top;
                const elementRect = element.getBoundingClientRect().top;
                const elementPosition = elementRect - bodyRect;
                const offsetPosition = elementPosition - offset;

                window.scrollTo({
                    top: offsetPosition,
                    behavior: 'smooth'
                });
            }
        }

        function render() {
            const container = document.getElementById('main-content');
            container.innerHTML = sections.map((section, sIdx) => `
                <section id="section-${section.id}" class="section-card bg-white border border-slate-200 shadow-sm hover:shadow-md transition rounded-2xl overflow-hidden border-l-4 border-l-indigo-600">
                    <div class="bg-gradient-to-r from-slate-50 to-white px-6 py-4 border-b border-slate-200 flex justify-between items-center">

                    <div class="divide-y divide-slate-100">

                                    <p class="text-slate-700 text-[15px] leading-relaxed flex-1"><span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-indigo-50 text-indigo-700 font-extrabold text-xs mr-3">${iIdx + 1}</span>${item}</p>
                                    <div class="flex gap-1 no-print">
                                        <button onclick="setStatus('${section.id}', ${iIdx}, 1)" class="btn-status text-[10px] font-extrabold px-3 py-1.5 rounded-full shadow-sm ${val === 1 ? 'active-si' : 'bg-white text-slate-400'}">SÍ</button>
                                        <button onclick="setStatus('${section.id}', ${iIdx}, 3)" class="btn-status text-[10px] font-extrabold px-3 py-1.5 rounded-full shadow-sm ${val === 3 ? 'active-proceso' : 'bg-white text-slate-400'}">EN PROCESO</button>
                                        <button onclick="setStatus('${section.id}', ${iIdx}, 2)" class="btn-status text-[10px] font-extrabold px-3 py-1.5 rounded-full shadow-sm ${val === 2 ? 'active-no' : 'bg-white text-slate-400'}">NON</button>

                </section>
            `).join('');
        }

        window.setStatus = function(secId, itemIdx, status) {
            const key = `${secId}-${itemIdx}`;
            userProgress[key] = (userProgress[key] === status) ? 0 : status;
            localStorage.setItem('xunta_checklist_v2', JSON.stringify(userProgress));
            render();
            updateAllProgress();
        };

        function updateAllProgress() {
            let totalWeight = 0;
            let totalDoneWeight = 0;

            sections.forEach(section => {
                const count = section.items.length;
                let done = 0;
                
                section.items.forEach((_, iIdx) => {
                    const val = userProgress[`${section.id}-${iIdx}`];
                    if (val === 1) done += 1;
                    if (val === 3) done += 0.5;
                });

                const percent = Math.round((done / count) * 100);
                document.getElementById(`bar-${section.id}`).style.width = percent + '%';
                document.getElementById(`text-${section.id}`).innerText = percent + '%';

                // Actualizar estilo de la etiqueta en el header
                const segment = document.getElementById(`seg-${section.id}`);
                segment.className = 'segment-tag';
                if (percent === 100) {
                    segment.classList.add('completed');
                } else if (percent > 0) {
                    segment.classList.add('in-progress');
                }

                totalWeight += count;
                totalDoneWeight += done;
            });

            const globalPercent = Math.round((totalDoneWeight / totalWeight) * 100);
            document.getElementById('global-percent').innerText = globalPercent + '%';
        }

            if(confirm("Desexas borrar todo o progreso gardado?")) {

        // ===== Navegación por teclado + resaltado del apartado visible =====
        let currentSectionIdx = 0;

        function getSectionElements() {
            return sections.map(s => document.getElementById(`section-${s.id}`)).filter(Boolean);
        }

        function setActiveSegmentById(secId) {
            // Limpia activo
            document.querySelectorAll('#segmented-progress-bar .segment-tag').forEach(el => {
                el.classList.remove('ring-2', 'ring-indigo-500', 'ring-offset-2');
            });
            const seg = document.getElementById(`seg-${secId}`);
            if (seg) {
                seg.classList.add('ring-2', 'ring-indigo-500', 'ring-offset-2');
            }
        }

        function scrollToSectionByIndex(idx) {
            const els = getSectionElements();
            if (!els.length) return;
            currentSectionIdx = Math.max(0, Math.min(idx, els.length - 1));
            const el = els[currentSectionIdx];
            if (!el) return;

            // usa la función existente (tiene offset para header fijo)
            const sec = sections[currentSectionIdx];
            if (sec) scrollToSection(sec.id);
        }

        function setupSectionObserver() {
            const els = getSectionElements();
            if (!els.length) return;

            // Observa cuál sección es la "dominante" en viewport
            const obs = new IntersectionObserver((entries) => {
                // Escoge la entrada con mayor intersección
                let best = null;
                for (const e of entries) {
                    if (!e.isIntersecting) continue;
                    if (!best || e.intersectionRatio > best.intersectionRatio) best = e;
                }
                if (!best) return;

                const id = best.target.id.replace('section-', '');
                const idx = sections.findIndex(s => s.id === id);
                if (idx >= 0) currentSectionIdx = idx;

                setActiveSegmentById(id);
            }, {
                root: null,
                threshold: [0.25, 0.5, 0.75],
                // deja margen superior para header fijo
                rootMargin: "-160px 0px -55% 0px"
            });

            els.forEach(el => obs.observe(el));

            // Inicializa resaltado
            setActiveSegmentById(sections[0]?.id);
        }

        function setupKeyboardNav() {
            // Evita interferir al escribir (si en el futuro hay inputs)
            const isTypingTarget = (t) => {
                if (!t) return false;
                const tag = (t.tagName || '').toLowerCase();
                return tag === 'input' || tag === 'textarea' || t.isContentEditable;
            };

            window.addEventListener('keydown', (e) => {
                if (isTypingTarget(e.target)) return;

                const key = e.key;
                if (['ArrowRight', 'ArrowDown', 'PageDown'].includes(key)) {
                    e.preventDefault();
                    scrollToSectionByIndex(currentSectionIdx + 1);
                } else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(key)) {
                    e.preventDefault();
                    scrollToSectionByIndex(currentSectionIdx - 1);
                } else if (key === 'Home') {
                    e.preventDefault();
                    scrollToSectionByIndex(0);
                } else if (key === 'End') {
                    e.preventDefault();
                    scrollToSectionByIndex(sections.length - 1);
                }
            });
        }

        // Arranca tras init/render
        window.addEventListener('load', () => {
            setupSectionObserver();
            setupKeyboardNav();
        });

            const blob = new Blob(['\ufeff', htmlContent], {
                type: 'application/msword'

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Checklist_Programacion_Didactica.doc';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };

    
        // Modo proyector: visión amplia (ON/OFF)
        window.togglePresentationMode = function () {
            const body = document.body;
            const isOn = body.classList.toggle('presentation-mode');

            // Al activar: ir arriba y pantalla completa (si está disponible)
            if (isOn) {
                try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch(e) { window.scrollTo(0,0); }
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(() => {});
                }
            } else {
                // Al desactivar: salir de pantalla completa si procede
                if (document.fullscreenElement && document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                }
            }
        };

    
        // Modo oscuro ON/OFF
        window.toggleDarkMode = function () {
            document.body.classList.toggle('dark-mode');
            // Guardar preferencia
            if (document.body.classList.contains('dark-mode')) {
                localStorage.setItem('pref_dark_mode', '1');
            } else {
                localStorage.removeItem('pref_dark_mode');
            }
        };

        // Restaurar preferencia
        window.addEventListener('load', () => {
            if (localStorage.getItem('pref_dark_mode') === '1') {
                document.body.classList.add('dark-mode');
            }
        });

    
        // ===== MODO OSCURO =====
        window.toggleDarkMode = function () {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                localStorage.setItem('pref_dark_mode', '1');
            } else {
                localStorage.removeItem('pref_dark_mode');
            }
        };

        window.addEventListener('load', () => {
            if (localStorage.getItem('pref_dark_mode') === '1') {
                document.body.classList.add('dark-mode');
            }
        });

    
        // ===== UI: iconos activos + barra flotante =====
        const ICON_MOON = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5">
  <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z" />
</svg>`;
        const ICON_SUN  = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5">
  <path stroke-linecap="round" stroke-linejoin="round" d="M12 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12z" />
  <path stroke-linecap="round" stroke-linejoin="round" d="M12 2.25v1.5M12 20.25v1.5M4.22 4.22l1.06 1.06M18.72 18.72l1.06 1.06M2.25 12h1.5M20.25 12h1.5M4.22 19.78l1.06-1.06M18.72 5.28l1.06-1.06" />
</svg>`;

        function syncModeIcons() {
            const darkBtn = document.getElementById('btn-dark');
            const projBtn = document.getElementById('btn-projector');

            if (darkBtn) {
                const isDark = document.body.classList.contains('dark-mode');
                darkBtn.classList.add('icon-swap');
                darkBtn.innerHTML = isDark ? ICON_SUN : ICON_MOON;
                // animación sutil sólo cuando está activo (oscuro)
                darkBtn.classList.toggle('is-on', isDark);
            }

            if (projBtn) {
                const isProj = document.body.classList.contains('presentation-mode');
                projBtn.classList.toggle('is-on', isProj);
            }
        }

        // Hooks: re-sincroniza al cambiar modos
        const _origToggleDark = window.toggleDarkMode;
        window.toggleDarkMode = function() {
            _origToggleDark && _origToggleDark();
            syncModeIcons();
        };

        const _origToggleProj = window.togglePresentationMode || window.togglePresentationMode;
        // En tu fichero la función se llama togglePresentationMode()
        const _origTogglePres = window.togglePresentationMode;
        if (_origTogglePres) {
            window.togglePresentationMode = function() {
                _origTogglePres();
                syncModeIcons();
                // activar/desactivar accesibilidad de la barra flotante
                const fb = document.getElementById('floatbar');
                if (fb) fb.setAttribute('aria-hidden', document.body.classList.contains('presentation-mode') ? 'false' : 'true');
            };
        }

        // Barra flotante: navegación entre apartados
        window.addEventListener('load', () => {
            const prev = document.getElementById('float-prev');
            const next = document.getElementById('float-next');
            const exit = document.getElementById('float-exit');
            const fb = document.getElementById('floatbar');
            if (fb) fb.setAttribute('aria-hidden', document.body.classList.contains('presentation-mode') ? 'false' : 'true');

            if (prev) prev.addEventListener('click', () => scrollToSectionByIndex(currentSectionIdx - 1));
            if (next) next.addEventListener('click', () => scrollToSectionByIndex(currentSectionIdx + 1));
            if (exit) exit.addEventListener('click', () => window.togglePresentationMode && window.togglePresentationMode());

            syncModeIcons();
        });

    
        // Encabezado: desaparece al bajar y reaparece suavemente al subir
        (function () {
            const header = document.querySelector('.xunta-header');
            if (!header) return;

            let lastY = window.scrollY || 0;
            let ticking = false;

            // estado inicial
            header.classList.add('is-shown');

            const onScroll = () => {
                const y = window.scrollY || document.documentElement.scrollTop;

                // Si estamos cerca del top, siempre visible
                if (y < 20) {
                    header.classList.remove('is-hidden');
                    header.classList.add('is-shown');
                    lastY = y;
                    return;
                }

                // Determina dirección
                const goingDown = y > lastY;

                if (goingDown && y > 80) {
                    header.classList.add('is-hidden');
                    header.classList.remove('is-shown');
                } else {
                    header.classList.remove('is-hidden');
                    header.classList.add('is-shown');
                }

                lastY = y;
            };

            window.addEventListener('scroll', () => {
                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        onScroll();
                        ticking = false;
                    });
                    ticking = true;
                }
            }, { passive: true });

            // En modo proyector, preferimos siempre visible (puedes cambiarlo si quieres)
            const syncForProjector = () => {
                if (document.body.classList.contains('presentation-mode')) {
                    header.classList.remove('is-hidden');
                    header.classList.add('is-shown');
                }
            };

            // hook: si existe toggle proyector, re-sincroniza
            const oldToggle = window.togglePresentationMode;
            if (oldToggle) {
                window.togglePresentationMode = function () {
                    oldToggle();
                    syncForProjector();
                };
            }
        })();

    </script>
