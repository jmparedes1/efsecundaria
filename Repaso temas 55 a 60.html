                question: "Muska Mosston (1978) considera que la denominada barrera cognitiva se atraviesa cuando el alumnado deja de reproducir modelos y participa activamente en la búsqueda de soluciones motrices.",
                correct: true,
                justification: "El tema señala que atravesar la barrera cognitiva implica pasar de la instrucción directa y puramente reproductiva a la implicación cognitiva y productiva activa del alumnado."
              },
              {
                id: 2,
                question: "Dentro de los estilos basados en el descubrimiento, la prioridad principal consiste en garantizar rapidez de ejecución y repetición exacta de patrones motrices previamente definidos por el profesorado.",
                correct: false,
                justification: "El objetivo central de la enseñanza por descubrimiento no es la velocidad ni la reproducción exacta del patrón motor del docente, sino implicar cognitivamente al alumnado a través de la exploración, la curiosidad, el análisis y la toma de decisiones."
              },
              {
                id: 3,
                question: "Nulhall y Snook sitúan la fundamentación científica de estos estilos en psicología cognitiva, pedagogía evolutiva y psicología de la creatividad.",
                correct: true,
                justification: "El marco teórico del tema añade además aportaciones de autores insignes como Guilford, Piaget y el aprendizaje por descubrimiento de Bruner, justificando científicamente estas metodologías activas."
              },
              {
                id: 4,
                question: "Herman (1967) sostiene que el aprendizaje por descubrimiento debe asociarse exclusivamente a procesos inductivos y nunca puede desarrollarse mediante razonamientos deductivos.",
                correct: false,
                justification: "Herman rechaza esa visión limitada, explicando que el aprendizaje por descubrimiento puede ser tanto de naturaleza inductiva (de lo particular a lo general) como deductiva (aplicar leyes generales para solventar retos concretos)."
              },
              {
                id: 5,
                question: "Entre los principios fundamentales de la enseñanza por descubrimiento se establece que la Educación Física debe superar planteamientos centrados únicamente en el acondicionamiento muscular.",
                correct: true,
                justification: "La disciplina busca favorecer una adaptación perceptivo-motriz, la asimilación conceptual y la comprensión compleja de las acciones corporales, superando la antigua concepción del ejercicio físico puramente mecánico."
              },
              {
                id: 6,
                question: "Para provocar disonancia cognitiva, el profesorado debe proporcionar toda la información disponible inicialmente con el objetivo de reducir incertidumbre y facilitar respuestas inmediatas.",
                correct: false,
                justification: "Para generar el desequilibrio cognitivo que despierte la indagación, el docente debe restringir u ocultar inicialmente parte de la información, planteando un reto que empuje al estudiante a investigar y reconstruir la solución."
              },
              {
                id: 7,
                question: "En el Descubrimiento Guiado, el profesorado debe reforzar respuestas correctas, evitar proporcionar soluciones directas y esperar siempre la respuesta inicial del alumnado.",
                correct: true,
                justification: "Estas premisas constituyen los pilares interactivos del Descubrimiento Guiado: el docente orienta mediante indicios sin dar la respuesta final, permitiendo que el alumno sea el verdadero descubridor."
              },
              {
                id: 8,
                question: "La Resolución de Problemas constituye un proceso heurístico incompleto donde el profesorado limita significativamente las alternativas y controla estrechamente la producción motriz del alumnado.",
                correct: false,
                justification: "La Resolución de Problemas es, en esencia, un proceso heurístico completo. El docente define el problema pero deja total libertad para que el alumno explore, diseñe y ejecute múltiples soluciones válidas."
              },
              {
                id: 9,
                question: "Thorndike aparece relacionado con el diseño de problemas mediante la denominada ley de disposición, vinculada al interest y predisposición para aprender.",
                correct: true,
                justification: "La ley de disposición de Thorndike argumenta que el aprendizaje se optimiza si existe una motivación, interés interno y predisposición de la persona hacia el objeto de estudio, lo cual se fomenta mediante problemas atractivos."
              },
              {
                id: 10,
                question: "Entre los inconvenientes de los estilos basados en descubrimiento, el tema señala resistencia docente al cambio, lentitud del proceso y dificultades con grupos numerosos o tareas de riesgo.",
                correct: true,
                justification: "A pesar de sus innegables ventajas pedagógicas, su aplicación real conlleva retos prácticos bien definidos como la lentitud en la adquisición del modelo motriz, la gestión de la seguridad física y la resistencia del profesorado tradicional."
              }
            ]
          }
        };

        function App() {
          const [activeTopic, setActiveTopic] = useState('tema55');
          const [currentIdx, setCurrentIdx] = useState(0);
          const [answers, setAnswers] = useState(Array(DATASETS['tema55'].questions.length).fill(null));
          const [mode, setMode] = useState('practice'); // 'practice' o 'exam'
          const [isSubmitted, setIsSubmitted] = useState(false);
          
          // DUA Ajustes de Accesibilidad
          const [textSize, setTextSize] = useState('md'); // 'sm', 'md', 'lg', 'xl'
          const [theme, setTheme] = useState('professional'); // 'professional', 'dark', 'highcontrast'
          const [isPlayingText, setIsPlayingText] = useState(false);
          const [voiceNotification, setVoiceNotification] = useState('');

          // Temporizador para Modo Examen
          const [timer, setTimer] = useState(0);
          const [timerActive, setTimerActive] = useState(false);

          // Referencia para síntesis de voz
          const speechUtteranceRef = useRef(null);

          // Atajos para leer las preguntas actuales
          const QUESTIONS = DATASETS[activeTopic].questions;
          const currentQuestion = QUESTIONS[currentIdx];
          const totalQuestions = QUESTIONS.length;
          const isCurrentAnswered = answers[currentIdx] !== null;
          const isCurrentCorrect = answers[currentIdx] === currentQuestion.correct;

          // --- Manejo del cambio de tema ---
          const handleTopicChange = (topicKey) => {
            stopSpeech();
            setActiveTopic(topicKey);
            setCurrentIdx(0);
            setAnswers(Array(DATASETS[topicKey].questions.length).fill(null));
            setIsSubmitted(false);
            setTimer(0);
            if (mode === 'exam') {
              setTimerActive(true);
            } else {
              setTimerActive(false);
            }
          };

          // --- Efecto para el Temporizador ---
          useEffect(() => {
            let interval = null;
            if (timerActive && !isSubmitted) {
              interval = setInterval(() => {
                setTimer((prev) => prev + 1);
              }, 1000);
            } else {
              clearInterval(interval);
            }
            return () => clearInterval(interval);
          }, [timerActive, isSubmitted]);

          // Activar temporizador al cambiar a modo examen si no está enviado
          useEffect(() => {
            if (mode === 'exam' && !isSubmitted) {
              setTimerActive(true);
            } else {
              setTimerActive(false);
            }
          }, [mode, isSubmitted]);

          // Cancelar voz al cambiar de pregunta o tema
          useEffect(() => {
            stopSpeech();
          }, [currentIdx, activeTopic]);

          // --- Funciones del Sintetizador de Voz (DUA Representación) ---
          const speakText = (text) => {
            if ('speechSynthesis' in window) {
              window.speechSynthesis.cancel(); // Cancelar cualquier reproducción previa
              
              if (isPlayingText) {
                setIsPlayingText(false);
                return;
              }

              const utterance = new SpeechSynthesisUtterance(text);
              utterance.lang = 'es-ES';
              utterance.rate = 1.0;
              
              utterance.onend = () => {
                setIsPlayingText(false);
              };

              utterance.onerror = () => {
                setIsPlayingText(false);
              };

              speechUtteranceRef.current = utterance;
              setIsPlayingText(true);
              window.speechSynthesis.speak(utterance);
            } else {
              setVoiceNotification("Lo siento, tu navegador no soporta lectura de voz automatizada.");
              setTimeout(() => setVoiceNotification(''), 4000);
            }
          };

          const stopSpeech = () => {
            if ('speechSynthesis' in window) {
              window.speechSynthesis.cancel();
              setIsPlayingText(false);
            }
          };

          // --- Atajos de Teclado (DUA Acción y Expresión) ---
          useEffect(() => {
            const handleKeyDown = (e) => {
              if (isSubmitted) return;

              const key = e.key.toLowerCase();
              if (key === 'v') {
                handleSelectAnswer(true);
              } else if (key === 'f') {
                handleSelectAnswer(false);
              } else if (e.key === 'ArrowRight') {
                handleNext();
              } else if (e.key === 'ArrowLeft') {
                handlePrev();
              }
            };

            window.addEventListener('keydown', handleKeyDown);
            return () => window.removeEventListener('keydown', handleKeyDown);
          }, [currentIdx, answers, isSubmitted, mode, activeTopic]);

          // --- Lógica del Examen ---
          const handleSelectAnswer = (userChoice) => {
            if (isSubmitted && mode === 'exam') return;
            
            const newAnswers = [...answers];
            newAnswers[currentIdx] = userChoice;
            setAnswers(newAnswers);
          };

          const handleNext = () => {
            if (currentIdx < totalQuestions - 1) {
              setCurrentIdx(currentIdx + 1);
            }
          };

          const handlePrev = () => {
            if (currentIdx > 0) {
              setCurrentIdx(currentIdx - 1);
            }
          };

          const handleReset = () => {
            setAnswers(Array(QUESTIONS.length).fill(null));
            setCurrentIdx(0);
            setIsSubmitted(false);
            setTimer(0);
            stopSpeech();
            if (mode === 'exam') setTimerActive(true);
          };

          const handleSubmitExam = () => {
            setTimerActive(false);
            setIsSubmitted(true);
            stopSpeech();
          };

          const getScore = () => {
            let correctCount = 0;
            answers.forEach((ans, idx) => {
              if (ans === QUESTIONS[idx].correct) {
                correctCount++;
              }
            });
            return correctCount;
          };

          // --- Formateadores de Estilo (DUA Diseño y Accesibilidad) ---
          const getTextSizeClass = () => {
            switch (textSize) {
              case 'sm': return 'text-sm md:text-base leading-relaxed';
              case 'lg': return 'text-lg md:text-xl leading-relaxed';
              case 'xl': return 'text-xl md:text-2xl leading-loose font-medium';
              default: return 'text-base md:text-lg leading-relaxed';
            }
          };

          const getHeadingSizeClass = () => {
            switch (textSize) {
              case 'sm': return 'text-lg font-bold';
              case 'lg': return 'text-2xl font-bold';
              case 'xl': return 'text-3xl font-extrabold';
              default: return 'text-xl font-bold';
            }
          };

          const getThemeClasses = () => {
            switch (theme) {
              case 'dark':
                return {
                  bg: 'bg-gray-950 text-gray-100',
                  card: 'bg-gray-900 border-gray-800 shadow-2xl',
                  header: 'bg-gray-900 border-b border-gray-800',
                  tabActive: 'bg-indigo-600 text-white border-indigo-500',
                  tabInactive: 'bg-gray-800 text-gray-300 hover:bg-gray-700 hover:text-white',
                  buttonActive: 'bg-indigo-600 hover:bg-indigo-500 text-white',
                  buttonSec: 'bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700',
                  accentText: 'text-indigo-400',
                  selectedAnswer: 'border-indigo-500 bg-indigo-950 text-indigo-200',
                  correctCard: 'bg-green-950/40 border-green-800 text-green-200',
                  incorrectCard: 'bg-red-950/40 border-red-800 text-red-200',
                  btnTrue: 'border-emerald-600/50 hover:bg-emerald-950/30 text-emerald-400',
                  btnFalse: 'border-rose-600/50 hover:bg-rose-950/30 text-rose-400',
                  btnTrueActive: 'bg-emerald-700 text-white border-emerald-500',
                  btnFalseActive: 'bg-rose-700 text-white border-rose-500',
                  activeStep: 'ring-2 ring-indigo-500 bg-indigo-900 text-indigo-100',
                  unansweredStep: 'bg-gray-800 text-gray-400',
                  answeredStep: 'bg-indigo-950 text-indigo-300 border border-indigo-800',
                };
              case 'highcontrast':
                return {
                  bg: 'bg-black text-yellow-300 font-mono',
                  card: 'bg-black border-4 border-yellow-300 shadow-none',
                  header: 'bg-black border-b-4 border-yellow-300',
                  tabActive: 'bg-yellow-300 text-black font-extrabold border-2 border-white',
                  tabInactive: 'bg-black text-yellow-300 border border-yellow-300 hover:bg-yellow-300 hover:text-black',
                  buttonActive: 'bg-yellow-300 text-black font-extrabold hover:bg-yellow-400',
                  buttonSec: 'bg-black text-yellow-300 border-2 border-yellow-300 hover:bg-yellow-300 hover:text-black',
                  accentText: 'text-yellow-300 underline',
                  selectedAnswer: 'border-dashed border-4 border-yellow-300 bg-yellow-300 text-black font-bold',
                  correctCard: 'border-4 border-green-500 bg-black text-green-400 font-bold',
                  incorrectCard: 'border-4 border-red-500 bg-black text-red-400 font-bold',
                  btnTrue: 'border-2 border-yellow-300 text-yellow-300 hover:bg-yellow-300 hover:text-black',
                  btnFalse: 'border-2 border-yellow-300 text-yellow-300 hover:bg-yellow-300 hover:text-black',
                  btnTrueActive: 'bg-green-500 text-black border-4 border-white font-black',
                  btnFalseActive: 'bg-red-500 text-black border-4 border-white font-black',
                  activeStep: 'border-4 border-white bg-yellow-300 text-black',
                  unansweredStep: 'border border-yellow-300 text-yellow-300',
                  answeredStep: 'bg-yellow-950 text-yellow-300 border-2 border-yellow-300',
                };
              default: // 'professional' (Claro sofisticado)
                return {
                  bg: 'bg-slate-50 text-slate-800',
                  card: 'bg-white border border-slate-200/80 shadow-xl shadow-slate-100/40 rounded-2xl',
                  header: 'bg-white border-b border-slate-200/80 shadow-sm',
                  tabActive: 'bg-indigo-600 text-white shadow-md shadow-indigo-100',
                  tabInactive: 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 hover:text-slate-800',
                  buttonActive: 'bg-indigo-600 hover:bg-indigo-700 text-white transition-all',
                  buttonSec: 'bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 transition-all',
                  accentText: 'text-indigo-600 font-semibold',
                  selectedAnswer: 'border-indigo-600 bg-indigo-50 text-indigo-900',
                  correctCard: 'bg-emerald-50 border-emerald-200 text-emerald-900 rounded-xl',
                  incorrectCard: 'bg-rose-50 border-rose-200 text-rose-900 rounded-xl',
                  btnTrue: 'border-2 border-emerald-100 hover:bg-emerald-50/50 text-emerald-700 hover:border-emerald-300',
                  btnFalse: 'border-2 border-rose-100 hover:bg-rose-50/50 text-rose-700 hover:border-rose-300',
                  btnTrueActive: 'bg-emerald-600 text-white border-emerald-600 shadow-lg shadow-emerald-100',
                  btnFalseActive: 'bg-rose-600 text-white border-rose-600 shadow-lg shadow-rose-100',
                  activeStep: 'ring-2 ring-indigo-600 bg-indigo-600 text-white font-semibold',
                  unansweredStep: 'bg-slate-100 text-slate-500 hover:bg-slate-200',
                  answeredStep: 'bg-indigo-50 text-indigo-700 border border-indigo-100 hover:bg-indigo-100/70',
                };
            }
          };

          const style = getThemeClasses();

          const formatTime = (seconds) => {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
          };

          return (
            <div className={`min-h-screen ${style.bg} font-sans flex flex-col transition-colors duration-200`}>
              
              {/* Mensajes flotantes de ayuda auditiva */}
              {voiceNotification && (
                <div className="fixed bottom-4 right-4 z-50 bg-amber-500 text-white px-4 py-2 rounded-xl shadow-lg font-bold text-sm animate-bounce">
                  {voiceNotification}
                </div>
              )}

              {/* --- CABECERA --- */}
              <header className={`${style.header} py-4 px-4 sm:px-6 sticky top-0 z-50`}>
                <div className="max-w-5xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                  
                  {/* Título y Logos */}
                  <div className="flex items-center gap-3">
                    <div className="p-2.5 bg-indigo-100 rounded-xl text-indigo-700">
                      <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                      </svg>
                    </div>
                    <div>
                      <h1 className="text-lg md:text-xl font-extrabold tracking-tight">EVALUACIÓN INTERACTIVA</h1>
                      <p className="text-xs opacity-80 font-medium">Diseño Universal para el Aprendizaje (DUA)</p>
                    </div>
                  </div>

                  {/* Caja de herramientas DUA */}
                  <div className="flex flex-wrap items-center gap-3 border-t border-slate-200/60 pt-3 md:border-t-0 md:pt-0">
                    
                    {/* Lector de Voz */}
                    <button
                      onClick={() => speakText(`Pregunta ${currentIdx + 1}. ${currentQuestion.question} ${
                        answers[currentIdx] !== null && mode === 'practice' ? `. Tu respuesta ha sido guardada. Justificación: ${currentQuestion.justification}` : ''
                      }`)}
                      className={`px-3 py-1.5 rounded-lg flex items-center gap-1.5 text-xs font-bold transition-all ${
                        isPlayingText 
                          ? 'bg-amber-500 text-white animate-pulse' 
                          : style.buttonSec
                      }`}
                      title="Escuchar pregunta en voz alta"
                      aria-label="Escuchar pregunta en voz alta"
                    >
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                        {isPlayingText ? (
                          <path strokeLinecap="round" strokeLinejoin="round" d="M15.75 5.25v13.5m-3-13.5v13.5m-3-10.5v7.5M4.5 12h.008v.008H4.5V12zm15 0h.008v.008H19.5V12z" />
                        ) : (
                          <path strokeLinecap="round" strokeLinejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z" />
                        )}
                      </svg>
                      <span>{isPlayingText ? 'Detener Voz' : 'Escuchar Pregunta'}</span>
                    </button>

                    {/* Ajuste de Texto */}
                    <div className="flex items-center rounded-lg overflow-hidden border border-slate-300 dark:border-gray-700" role="group" aria-label="Ajuste de Tamaño de Texto">
                      <button
                        onClick={() => setTextSize('sm')}
                        className={`px-2.5 py-1 text-xs font-bold ${textSize === 'sm' ? 'bg-indigo-600 text-white' : 'bg-white text-slate-700 dark:bg-gray-800 dark:text-gray-200'}`}
                        title="Texto Pequeño"
                      >
                        A-
                      </button>
                      <button
                        onClick={() => setTextSize('md')}
                        className={`px-2.5 py-1 text-xs font-bold ${textSize === 'md' ? 'bg-indigo-600 text-white' : 'bg-white text-slate-700 dark:bg-gray-800 dark:text-gray-200'}`}
                        title="Texto Normal"
                      >
                        A
                      </button>
                      <button
                        onClick={() => setTextSize('lg')}
                        className={`px-2.5 py-1 text-xs font-bold ${textSize === 'lg' ? 'bg-indigo-600 text-white' : 'bg-white text-slate-700 dark:bg-gray-800 dark:text-gray-200'}`}
                        title="Texto Grande"
                      >
                        A+
                      </button>
                      <button
                        onClick={() => setTextSize('xl')}
                        className={`px-2.5 py-1 text-xs font-bold ${textSize === 'xl' ? 'bg-indigo-600 text-white' : 'bg-white text-slate-700 dark:bg-gray-800 dark:text-gray-200'}`}
                        title="Texto Extra Grande"
                      >
                        A++
                      </button>
                    </div>

                    {/* Selector de Contraste (Tema) */}
                    <div className="flex items-center rounded-lg overflow-hidden border border-slate-300 dark:border-gray-700" role="group" aria-label="Selector de Tema">
                      <button
                        onClick={() => setTheme('professional')}
                        className={`px-2 py-1 text-xs font-bold ${theme === 'professional' ? 'bg-indigo-600 text-white' : 'bg-white text-slate-700 dark:bg-gray-800'}`}
                        title="Tema Profesional Claro"
                      >
                        Claro
                      </button>
                      <button
                        onClick={() => setTheme('dark')}
                        className={`px-2 py-1 text-xs font-bold ${theme === 'dark' ? 'bg-indigo-600 text-white' : 'bg-white text-slate-700 dark:bg-gray-800 dark:text-gray-200'}`}
                        title="Tema Modo Oscuro"
                      >
                        Oscuro
                      </button>
                      <button
                        onClick={() => setTheme('highcontrast')}
                        className={`px-2 py-1 text-xs font-bold ${theme === 'highcontrast' ? 'bg-yellow-300 text-black font-black' : 'bg-white text-slate-700 dark:bg-gray-800 dark:text-gray-200'}`}
                        title="Tema de Alto Contraste"
                      >
                        A.C.
                      </button>
                    </div>

                  </div>
                </div>
              </header>

              {/* --- CONTENIDO PRINCIPAL --- */}
              <main className="flex-grow max-w-5xl w-full mx-auto p-4 sm:p-6 flex flex-col gap-6">

                {/* --- PESTAÑAS DE CAMBIO DE TEMA --- */}
                {}
                <div className="flex flex-col sm:flex-row gap-2 items-center justify-between border-b border-slate-200/60 dark:border-gray-800 pb-3">
                  <div className="flex gap-2 w-full sm:w-auto overflow-x-auto pb-1 scrollbar-none">
                    {Object.keys(DATASETS).map((key) => {
                      const active = activeTopic === key;
                      return (
                        <button
                          key={key}
                          onClick={() => handleTopicChange(key)}
                          className={`flex-1 sm:flex-none px-4 py-2.5 rounded-xl font-bold text-xs sm:text-sm tracking-wide transition-all uppercase whitespace-nowrap ${
                            active ? style.tabActive : style.tabInactive
                          }`}
                          aria-selected={active}
                          role="tab"
                        >
                          {DATASETS[key].shortTitle}
                        </button>
                      );
                    })}
                  </div>
                  
                  <div className="text-right w-full sm:w-auto mt-2 sm:mt-0">
                    <span className="text-xs font-bold opacity-70 block uppercase tracking-wider">Materia Activa:</span>
                    <span className="text-xs font-extrabold text-indigo-500 dark:text-indigo-400">
                      {DATASETS[activeTopic].title}
                    </span>
                  </div>
                </div>

                {/* --- SELECTOR DE MODALIDAD Y ESTADO --- */}
                {!isSubmitted && (
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4 items-center bg-indigo-50/60 dark:bg-gray-900/40 p-3 sm:p-4 rounded-2xl border border-indigo-100/70 dark:border-gray-800">
                    
                    {/* Modo de Examen */}
                    <div className="flex items-center gap-2 md:col-span-2">
                      <span className="text-xs font-bold uppercase tracking-wider text-indigo-500 dark:text-indigo-400">Modalidad:</span>
                      <div className="flex bg-slate-200/75 dark:bg-gray-800 p-1 rounded-xl w-full sm:w-auto">
                        <button
                          onClick={() => { setMode('practice'); handleReset(); }}
                          className={`flex-1 sm:flex-initial px-4 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1.5 ${
                            mode === 'practice' ? 'bg-white dark:bg-gray-700 text-indigo-700 dark:text-indigo-300 shadow-sm' : 'text-slate-600 dark:text-gray-400'
                          }`}
                        >
                          <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
                          </svg>
                          Modo Práctica
                        </button>
                        <button
                          onClick={() => { setMode('exam'); handleReset(); }}
                          className={`flex-1 sm:flex-initial px-4 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1.5 ${
                            mode === 'exam' ? 'bg-white dark:bg-gray-700 text-indigo-700 dark:text-indigo-300 shadow-sm' : 'text-slate-600 dark:text-gray-400'
                          }`}
                        >
                          <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                          </svg>
                          Modo Examen (Real)
                        </button>
                      </div>
                    </div>

                    {/* Temporizador o Información de Modo */}
                    <div className="flex justify-start md:justify-end items-center gap-2">
                      {mode === 'exam' ? (
                        <div className="flex items-center gap-1.5 bg-rose-50 dark:bg-rose-950/30 text-rose-700 dark:text-rose-400 px-3 py-1.5 rounded-xl border border-rose-100 dark:border-rose-900/50 w-full md:w-auto justify-center">
                          <span className="relative flex h-2 w-2">
                            <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
                            <span className="relative inline-flex rounded-full h-2 w-2 bg-rose-500"></span>
                          </span>
                          <span className="text-xs font-bold tracking-wider">TIEMPO TRANSCURRIDO:</span>
                          <span className="font-mono text-sm font-black">{formatTime(timer)}</span>
                        </div>
                      ) : (
                        <div className="text-xs text-emerald-700 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/30 px-3 py-1.5 rounded-xl border border-emerald-100 dark:border-emerald-900/50 w-full md:w-auto text-center font-bold flex items-center gap-1.5 justify-center">
                          <span className="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
                          Feedback inmediato activo
                        </div>
                      )}
                    </div>

                  </div>
                )}

                {/* --- DESARROLLO DEL EXAMEN --- */}
                {!isSubmitted ? (
                  <div className="grid grid-cols-1 lg:grid-cols-4 gap-6 items-start">
                    
                    {/* Columna Izquierda: Panel de Navegación (DUA Acción y Expresión) */}
                    <div className={`${style.card} p-4 lg:col-span-1`}>
                      <h2 className="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-3">Navegación de Preguntas</h2>
                      <div className="grid grid-cols-5 gap-2 lg:grid-cols-3">
                        {QUESTIONS.map((q, idx) => {
                          const isCurrent = idx === currentIdx;
                          const isAnswered = answers[idx] !== null;
                          
                          let btnStyle = style.unansweredStep;
                          if (isCurrent) {
                            btnStyle = style.activeStep;
                          } else if (isAnswered) {
                            btnStyle = style.answeredStep;
                          }

                          return (
                            <button
                              key={q.id}
                              onClick={() => setCurrentIdx(idx)}
                              className={`h-10 rounded-xl text-xs font-bold flex items-center justify-center transition-all ${btnStyle}`}
                              title={`Ir a pregunta ${idx + 1}`}
                              aria-label={`Pregunta ${idx + 1}`}
                            >
                              {idx + 1}
                              {isAnswered && !isCurrent && (
                                <span className="ml-1 w-1.5 h-1.5 rounded-full bg-indigo-500 dark:bg-indigo-400"></span>
                              )}
                            </button>
                          );
                        })}
                      </div>

                      {/* Información de Ayuda Teclado */}
                      <div className="mt-5 pt-4 border-t border-slate-200/60 dark:border-gray-800 text-xxs text-slate-400 dark:text-gray-500 hidden sm:block">
                        <p className="font-bold uppercase tracking-wider mb-1">Accesos Rápidos:</p>
                        <ul className="space-y-1">
                          <li>• <kbd className="px-1 bg-slate-200 dark:bg-gray-800 rounded">Teclas ← / →</kbd> : Navegar</li>
                          <li>• <kbd className="px-1 bg-slate-200 dark:bg-gray-800 rounded">Tecla V</kbd> : Verdadero</li>
                          <li>• <kbd className="px-1 bg-slate-200 dark:bg-gray-800 rounded">Tecla F</kbd> : Falso</li>
                        </ul>
                      </div>
                    </div>

                    {/* Columna Derecha: Tarjeta de Pregunta */}
                    <div className="lg:col-span-3 flex flex-col gap-6">
                      
                      <div className={`${style.card} p-6 sm:p-8 flex flex-col gap-6 relative overflow-hidden`}>
                        
                        {/* Indicador superior de progreso */}
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-950/50 px-3 py-1 rounded-full">
                            PREGUNTA {currentIdx + 1} DE {totalQuestions}
                          </span>
                          
                          {/* Barra de progreso visual */}
                          <div className="w-1/3 bg-slate-200 dark:bg-gray-800 rounded-full h-2">
                            <div 
                              className="bg-indigo-600 h-2 rounded-full transition-all duration-300"
                              style={{ width: `${((currentIdx + 1) / totalQuestions) * 100}%` }}
                            ></div>
                          </div>
                        </div>

                        {/* Enunciado de la Pregunta */}
                        <div className="py-4">
                          <p className={getTextSizeClass()}>
                            {currentQuestion.question}
                          </p>
                        </div>

                        {/* Botones de Selección de Respuesta */}
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                          
                          {/* Botón VERDADERO */}
                          <button
                            onClick={() => handleSelectAnswer(true)}
                            className={`p-5 rounded-2xl flex items-center justify-between transition-all border-2 text-left ${
                              answers[currentIdx] === true 
                                ? style.btnTrueActive 
                                : style.btnTrue
                            }`}
                          >
                            <div className="flex items-center gap-3">
                              <div className={`p-2 rounded-xl ${answers[currentIdx] === true ? 'bg-white/20' : 'bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600'}`}>
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
                                  <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"></path>
                                </svg>
                              </div>
                              <div>
                                <span className="block text-xs font-bold uppercase tracking-wider opacity-80">OPCIÓN A</span>
                                <span className="text-lg font-bold">VERDADERO</span>
                              </div>
                            </div>
                            {answers[currentIdx] === true && (
                              <span className="w-3 h-3 rounded-full bg-white ring-4 ring-emerald-300/50"></span>
                            )}
                          </button>

                          {/* Botón FALSO */}
                          <button
                            onClick={() => handleSelectAnswer(false)}
                            className={`p-5 rounded-2xl flex items-center justify-between transition-all border-2 text-left ${
                              answers[currentIdx] === false 
                                ? style.btnFalseActive 
                                : style.btnFalse
                            }`}
                          >
                            <div className="flex items-center gap-3">
                              <div className={`p-2 rounded-xl ${answers[currentIdx] === false ? 'bg-white/20' : 'bg-rose-50 dark:bg-rose-950/50 text-rose-600'}`}>
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
                                  <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                              </div>
                              <div>
                                <span className="block text-xs font-bold uppercase tracking-wider opacity-80">OPCIÓN B</span>
                                <span className="text-lg font-bold">FALSO</span>
                              </div>
                            </div>
                            {answers[currentIdx] === false && (
                              <span className="w-3 h-3 rounded-full bg-white ring-4 ring-rose-300/50"></span>
                            )}
                          </button>

                        </div>

                        {/* FEEDBACK INMEDIATO (DUA: Múltiples medios de representación/Compromiso en Modo Práctica) */}
                        {mode === 'practice' && isCurrentAnswered && (
                          <div className={`mt-4 p-5 border transition-all duration-300 rounded-xl ${
                            isCurrentCorrect ? style.correctCard : style.incorrectCard
                          }`}>
                            <div className="flex items-start gap-3">
                              <div className="mt-0.5">
                                {isCurrentCorrect ? (
                                  <div className="p-1 bg-emerald-500 text-white rounded-full">
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24">
                                      <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"></path>
                                    </svg>
                                  </div>
                                ) : (
                                  <div className="p-1 bg-rose-500 text-white rounded-full">
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24">
                                      <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                                    </svg>
                                  </div>
                                )}
                              </div>
                              <div className="flex-1">
                                <div className="flex items-center justify-between mb-2">
                                  <h4 className="text-sm font-bold uppercase tracking-wider">
                                    {isCurrentCorrect ? '¡Excelente! Respuesta Correcta' : 'Respuesta Incorrecta'}
                                  </h4>
                                  {/* Botón Voz para Justificación */}
                                  <button
                                    onClick={() => speakText(`Justificación. ${currentQuestion.justification}`)}
                                    className="p-1 hover:bg-slate-200 dark:hover:bg-gray-800 rounded"
                                    title="Escuchar justificación"
                                  >
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                                      <path strokeLinecap="round" strokeLinejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z" />
                                    </svg>
                                  </button>
                                </div>
                                <p className={`text-sm ${theme === 'highcontrast' ? 'text-yellow-300' : 'text-slate-700 dark:text-slate-300'}`}>
                                  <strong>Justificación:</strong> {currentQuestion.justification}
                                </p>
                              </div>
                            </div>
                          </div>
                        )}

                      </div>

                      {/* Botones de Navegación Inferior */}
                      <div className="flex items-center justify-between gap-4">
                        
                        <button
                          onClick={handlePrev}
                          disabled={currentIdx === 0}
                          className={`px-5 py-3 rounded-xl flex items-center gap-2 font-bold transition-all ${
                            currentIdx === 0 
                              ? 'opacity-40 cursor-not-allowed bg-slate-200 text-slate-400 dark:bg-gray-800 dark:text-gray-600' 
                              : style.buttonSec
                          }`}
                        >
                          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" d="M15 19l-7-7 7-7"></path>
                          </svg>
                          Anterior
                        </button>

                        {currentIdx < totalQuestions - 1 ? (
                          <button
                            onClick={handleNext}
                            className={`px-5 py-3 rounded-xl flex items-center gap-2 font-bold transition-all ${style.buttonActive}`}
                          >
                            Siguiente
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" d="M9 5l7 7-7 7"></path>
                            </svg>
                          </button>
                        ) : (
                          <button
                            onClick={handleSubmitExam}
                            className="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold flex items-center gap-2 shadow-lg shadow-indigo-100 dark:shadow-none transition-all"
                          >
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            Finalizar Examen
                          </button>
                        )}

                      </div>

                    </div>

                  </div>
                ) : (
                  
                  /* --- PÁGINA DE RESULTADOS (DUA: Metacognición y Evaluación Formativa) --- */
                  <div className="flex flex-col gap-6 animate-fadeIn">
                    
                    {/* Tarjeta de Resumen General */}
                    <div className={`${style.card} p-6 sm:p-10 text-center flex flex-col items-center gap-4`}>
                      <div className="p-4 bg-indigo-50 dark:bg-indigo-950/40 rounded-full text-indigo-600 dark:text-indigo-400">
                        <svg className="w-16 h-16" fill="none" stroke="currentColor" strokeWidth="1.5" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"></path>
                        </svg>
                      </div>

                      <div>
                        <h2 className={getHeadingSizeClass()}>¡Has completado el examen de {DATASETS[activeTopic].shortTitle}!</h2>
                        <p className="text-sm text-slate-500 dark:text-gray-400 mt-1">Revisa detalladamente tu desempeño a continuación</p>
                      </div>

                      {/* Puntuación */}
                      <div className="my-2">
                        <div className="inline-block relative">
                          <span className="text-6xl font-black text-indigo-600 dark:text-indigo-400">{getScore()}</span>
                          <span className="text-3xl font-bold text-slate-400"> / {totalQuestions}</span>
                        </div>
                        <div className="mt-2 text-sm font-bold uppercase tracking-wider text-indigo-500 dark:text-indigo-400">
                          Nota Final: {(getScore() / totalQuestions * 10).toFixed(1)} / 10.0
                        </div>
                      </div>

                      {/* Retroalimentación Motivadora DUA */}
                      <div className="max-w-md bg-slate-50 dark:bg-gray-950 p-4 rounded-xl border border-slate-200/60 dark:border-gray-800 text-sm">
                        {getScore() === totalQuestions ? (
                          <p className="text-emerald-600 font-bold">¡Excelente puntuación! Dominas a la perfección todos los conceptos teóricos de este tema.</p>
                        ) : getScore() >= 7 ? (
                          <p className="text-indigo-600 dark:text-indigo-400 font-bold">¡Muy bien hecho! Has demostrado una comprensión sólida del temario de {DATASETS[activeTopic].shortTitle}.</p>
                        ) : (
                          <p className="text-amber-600 font-bold">Buen intento. Utiliza las justificaciones de la revisión de abajo para reforzar los conceptos y volver a intentarlo.</p>
                        )}
                      </div>

                      {/* Acciones de Resultados */}
                      <div className="flex flex-wrap items-center justify-center gap-4 mt-2">
                        <button
                          onClick={handleReset}
                          className={`px-5 py-3 rounded-xl font-bold flex items-center gap-2 ${style.buttonActive}`}
                        >
                          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 8H18.2"></path>
                          </svg>
                          Volver a Realizar Examen
                        </button>
                        <button
                          onClick={() => window.print()}
                          className={`px-5 py-3 rounded-xl font-bold flex items-center gap-2 ${style.buttonSec}`}
                        >
                          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-3a2 2 0 00-2-2H9a2 2 0 00-2 2v3a2 2 0 002 2zm5-12V5a3 3 0 00-3-3H9a3 3 0 00-3 3v4h10z"></path>
                          </svg>
                          Imprimir / Guardar PDF
                        </button>
                      </div>
                    </div>

                    {/* Revisión Interactiva de Preguntas */}
                    <h3 className="text-lg font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 mt-4">Análisis Pregunta por Pregunta ({DATASETS[activeTopic].shortTitle})</h3>
                    
                    <div className="flex flex-col gap-4">
                      {QUESTIONS.map((q, idx) => {
                        const userAns = answers[idx];
                        const isCorrect = userAns === q.correct;

                        return (
                          <div key={q.id} className={`${style.card} p-5 flex flex-col gap-4 relative`}>
                            
                            {/* Encabezado de Pregunta en Revisión */}
                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-100 dark:border-gray-800 pb-3">
                              <span className="text-xs font-bold text-slate-400 dark:text-slate-500">
                                PREGUNTA {idx + 1}
                              </span>
                              <div className="flex flex-wrap gap-2">
                                <span className={`px-2.5 py-1 text-xs font-bold rounded-lg ${
                                  userAns === q.correct 
                                    ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950/50 dark:text-emerald-300' 
                                    : 'bg-rose-100 text-rose-800 dark:bg-rose-950/50 dark:text-rose-300'
                                }`}>
                                  {isCorrect ? 'Correcta ✓' : 'Incorrecta ✗'}
                                </span>
                                <span className="px-2.5 py-1 text-xs font-bold rounded-lg bg-indigo-50 text-indigo-800 dark:bg-indigo-950/50 dark:text-indigo-300">
                                  Respuesta correcta: {q.correct ? 'Verdadero' : 'Falso'}
                                </span>
                                <span className="px-2.5 py-1 text-xs font-bold rounded-lg bg-slate-100 text-slate-800 dark:bg-slate-800 dark:text-gray-300">
                                  Tu respuesta: {userAns === null ? 'No contestada' : userAns ? 'Verdadero' : 'Falso'}
                                </span>
                              </div>
                            </div>

                            {/* Enunciado */}
                            <p className={getTextSizeClass()}>{q.question}</p>

                            {/* Justificación */}
                            <div className="p-4 bg-slate-50 dark:bg-gray-950/60 rounded-xl border border-slate-200/60 dark:border-gray-800 text-sm">
                              <div className="flex items-center gap-1.5 mb-1.5">
                                <svg className="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
                                  <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                                </svg>
                                <strong className="text-xs font-bold uppercase tracking-wider text-slate-400">Justificación Teórica:</strong>
                              </div>
                              <p className="text-slate-600 dark:text-slate-300">{q.justification}</p>
                            </div>

                          </div>
                        );
                      })}
                    </div>

                  </div>

                )}

              </main>

              {/* --- PIE DE PÁGINA --- */}
              <footer className="py-6 mt-12 text-center text-xs opacity-60 border-t border-slate-200/50 dark:border-gray-900">
                <div className="max-w-5xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
                  <p>© {new Date().getFullYear()} - Examen Interactivo de Procesamiento y Control Motor (DUA)</p>
                  <div className="flex gap-4">
                    <span className="font-semibold">Accesibilidad Integrada</span>
                    <span>•</span>
                    <span className="font-semibold">Diseño Universal para el Aprendizaje</span>
                  </div>
                </div>
              </footer>

            </div>
          );
        }

        // Renderizado del componente App en el DOM
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
