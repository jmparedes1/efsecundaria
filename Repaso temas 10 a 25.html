    <script>
        const quizData = {
            tema10: [
                { id: 1, question: "Los sistemas naturales surgieron históricamente como una evolución directa de los métodos analíticos escandinavos, conservando su rigidez técnica.", answer: "Falso", justification: "Nacen como oposición a la artificialidad y rigidez de los métodos analíticos." },
                { id: 2, question: "Georges Hébert concluyó que los pueblos considerados primitivos presentaban un desarrollo físico y una adaptación funcional superiores a los del hombre civilizado.", answer: "Verdadero", justification: "Esta observación constituye una de las bases fundamentales del Método Natural francés." },
                { id: 3, question: "En su obra 'Emilio' (1762), Rousseau defendió una educación centrada en la experiencia, la naturaleza y el desarrollo armónico.", answer: "Verdadero", justification: "El tema destaca la influencia decisiva de Rousseau como precursor de los sistemas naturales." },
                { id: 4, question: "Demeny mantuvo una adhesión permanente a la gimnasia sueca tradicional y rechazó cualquier crítica a su carácter anatómico.", answer: "Falso", justification: "Demeny se separó de ella precisamente por su carácter anatómico y estático." },
                { id: 5, question: "Hébert subordinaba el desarrollo físico de su método a un ideal moral basado en el altruismo.", answer: "Verdadero", justification: "El altruismo aparece explícitamente como elemento moral dominante del método natural." },
                { id: 6, question: "El método natural francés se distinguía por establecer metodologías muy diferenciadas y específicas para niños, hombres y mujeres.", answer: "Falso", justification: "Hébert no diferenciaba entre niño, hombre y mujer, siendo precisamente criticado por ello." },
                { id: 7, question: "En la organización sobre 'plateau', Hébert estructuraba el trabajo mediante 'olas' y 'contra-olas' para alternar esfuerzo y recuperación.", answer: "Verdadero", justification: "El sistema de organización en oleadas permite alternancia y recuperación entre fases de esfuerzo." },
                { id: 8, question: "Gaulhofer y Streicher desarrollaron la doctrina austríaca orientada exclusivamente al rendimiento deportivo especializado.", answer: "Falso", justification: "Su finalidad era el desarrollo integral del ser humano: 'desde el cuerpo, sobre el alma, hacia el hombre'." },
                { id: 9, question: "Seybolk (1974) identifica como principios técnico-pedagógicos de la gimnasia austríaca la espontaneidad y la adaptación al niño.", answer: "Verdadero", justification: "Estos principios aparecen expresamente recogidos en el tema." },
                { id: 10, question: "El modelo MovNat actual promueve la especialización temprana y una tecnificación orientada al rendimiento competitivo.", answer: "Falso", justification: "MovNat posee un enfoque no especializado, práctico y orientado a movimientos útiles y naturales." }
            ],
            tema11: [{ id: 1, question: "Guts Muths, mediante su obra Gymnastik für die Jugend (1793), fue el primero en defender una Educación Física basada en principios anatómicos y fisiológicos.", answer: "Verdadero", justification: "Fue el primero en comprender la necesidad de practicar según leyes fisiológicas y conocimientos anatómicos." }, { id: 2, question: "Pehr Henrik Ling comenzó a ejercer oficialmente como maestro de Educación Física inmediatamente después de regresar a Suecia en 1804.", answer: "Falso", justification: "Ling no comenzó a ejercer oficialmente hasta 1822, tras reglamentarse el título de maestro." }, { id: 3, question: "Entre los principios de Ling se encuentra desarrollar armónicamente el cuerpo mediante ejercicios simétricos y una distribución proporcional del trabajo.", answer: "Verdadero", justification: "El desarrollo armónico y la proporcionalidad del trabajo aparecen expresamente en el método." }, { id: 4, question: "La gimnasia sueca tradicional defendía movimientos amplios, dinámicos y poco sujetos a posiciones definidas.", answer: "Falso", justification: "La gimnasia sueca utilizaba movimientos mecánicos, analíticos, cortos y limitados a posiciones determinadas." }, { id: 5, question: "Hjalmar Ling abandonó la clasificación inicial de su padre e intentó reorganizar los ejercicios utilizando fundamentos anatómicos y fisiológicos.", answer: "Verdadero", justification: "Esta reorganización fue una de las principales aportaciones de Hjalmar Ling." }, { id: 6, question: "Nyblaeus defendía la mezcla entre gimnasia educativa y militar realizada por Hjalmar Ling y rechazaba ejercicios naturales.", answer: "Falso", justification: "Nyblaeus criticó esa mezcla y defendió ejercicios naturales y libres centrados en la persona." }, { id: 7, question: "Niels Bukh fue una figura clave del movimiento neosueco masculino y anticipó principios actuales relacionados con la sobrecarga del entrenamiento.", answer: "Verdadero", justification: "Es identificado como precursor del actual principio de sobrecarga." }, { id: 8, question: "Elin Falk rechazó completamente el entrenamiento descalzo y consideró que los ejercicios respiratorios tenían utilidad muy limitada.", answer: "Falso", justification: "Promovió la gimnasia descalza y valoró los ejercicios respiratorios para mejorar la postura." }, { id: 9, question: "La tendencia científica de J. Lindhard permitió elevar la gimnasia desde sus orígenes campesinos hasta un reconocimiento universitario.", answer: "Verdadero", justification: "Su trabajo contribuyó decisivamente a legitimar la gimnasia como disciplina educativa y universitaria." }, { id: 10, question: "Dentro de las características didácticas actuales del ejercicio analítico se atribuye al alumnado un elevado nivel de decisiones y resolución cognitiva.", answer: "Falso", justification: "Se presenta bajo nivel perceptivo y cognitivo, dejando pocas decisiones al alumnado." }],
            tema12: [{ id: 1, question: "Jahn sustituyó el término 'Gymnastik' por 'Turnkunst' con el propósito de reforzar el carácter nacional de su sistema y alejarlo de las ideas filantrópicas de Guts Muths.", answer: "Verdadero", justification: "Reemplazó deliberadamente la denominación para enfatizar la dimensión patriótico-social y nacionalista." }, { id: 2, question: "Thomas Arnold constituye una figura central de la escuela francesa debido a su influencia directa sobre los métodos gimnásticos militares desarrollados posteriormente por Amorós.", answer: "Falso", justification: "Thomas Arnold pertenece a la escuela inglesa, basada en juegos, actividades atléticas y deporte." }, { id: 3, question: "Langlade y colaboradores (1985) consideran que la Primera Lingiada celebrada en Estocolmo en 1939 inició un proceso de influencias recíprocas y universalización gimnástica.", answer: "Verdadero", justification: "Se señala este acontecimiento como punto de inicio de la integración y fusión de sistemas gimnásticos." }, { id: 4, question: "La Rítmica de Dalcroze fue concebida desde su origen como una modalidad específicamente gimnástica y destinada prioritariamente a la educación física de adultos.", answer: "Falso", justification: "La Rítmica no constituye una modalidad gimnástica y se orienta especialmente hacia la educación infantil." }, { id: 5, question: "Steele Mackaye trasladó las ideas de Delsarte a Estados Unidos, donde sufrieron modificaciones hasta transformarse en una variante particular de la calistenia.", answer: "Verdadero", justification: "La adaptación norteamericana incorporó relajación, expresión emocional y postura atractiva." }, { id: 6, question: "Hilma Jalkanen formuló una ley del movimiento armonioso donde el movimiento debía iniciarse preferentemente por músculos periféricos alejados del centro corporal.", answer: "Falso", justification: "La ley indica lo contrario: el movimiento comienza por músculos que rodean la pelvis." }, { id: 7, question: "Rudolf Bode fundó en 1911 una escuela de gimnasia rítmica en Munich como reacción frente a los modelos anatómicos y analíticos dominantes.", answer: "Verdadero", justification: "Su oposición a los movimientos construidos y analíticos es el fundamento de su propuesta." }, { id: 8, question: "El principio de economía formulado por Bode considera que los movimientos más eficaces son aquellos caracterizados por tensión muscular continua y ausencia de alternancia entre contracción y relajación.", answer: "Falso", justification: "El principio establece lo contrario: la economía surge de la alternancia rítmica entre contracción y relajación." }, { id: 9, question: "Hinrich Medau incorporó a la Gimnasia Moderna elementos como aparatos portátiles, improvisación musical y nuevas interpretaciones de movimientos oscilatorios.", answer: "Verdadero", justification: "Estas son aportaciones fundamentales reconocidas a Medau." }, { id: 10, question: "El Gym-Jazz creado por Mónica Beckman concede escasa importancia a la pelvis y rechaza tanto la improvisación como los componentes rítmico-respiratorios del movimiento.", answer: "Falso", justification: "Se destaca la importancia de la pelvis, la improvisación y el ritmo respiratorio como rasgos esenciales." }],
            tema13: [{ id: 1, question: "Lian, en 1916, consideró que la aptitud física dependía exclusivamente de parámetros fisiológicos y descartó la relación entre las tareas exigidas y la capacidad de ejecución individual.", answer: "Falso", justification: "El tema señala que Lian estableció precisamente una relación entre las tareas a realizar y la capacidad para ejecutarlas." }, { id: 2, question: "Grösser (1988) definió la condición física como una suma ponderada de capacidades físicas necesarias para el rendimiento, incorporando además aspectos psicológicos y volitivos del deportista.", answer: "Verdadero", justification: "El autor incluye capacidades físicas junto con componentes de personalidad, psicológicos y volitivos." }, { id: 3, question: "El Modelo de Toronto de Bouchard y Shephard introducido en 1990 excluye factores psicológicos y limita la condición física únicamente a componentes fisiológicos y motrices.", answer: "Falso", justification: "El modelo incorpora condición anatómica, psíquica, fisiológica y físico-motora." }, { id: 4, question: "Russell Pate (2007) defendió que la condición física orientada a la salud debía facilitar la adquisición de habilidades, conocimientos y actitudes para una participación activa futura.", answer: "Verdadero", justification: "El tema recoge esta finalidad vinculada a hábitos permanentes y participación autónoma en el tiempo libre." }, { id: 5, question: "Según Grösser, la velocidad máxima cíclica hace referencia a la capacidad para ejecutar movimientos segmentarios aislados en el menor tiempo posible.", answer: "Falso", justification: "La velocidad máxima cíclica se refiere a movimientos repetitivos de desplazamiento, mientras la acíclica afecta a movimientos segmentarios." }, { id: 6, question: "Lizaur, Martín y Padial (1990) consideran las capacidades coordinativas como elementos responsables de adaptar el comportamiento mediante una adecuada organización espacio-temporal muscular.", answer: "Verdadero", justification: "El tema presenta exactamente esta función para las capacidades coordinativas." }, { id: 7, question: "La época del entrenamiento neomoderno se caracterizó por una intensificación extrema de métodos agresivos y una reducción del interés por formas naturales de actividad física.", answer: "Falso", justification: "El tema señala justamente una vuelta hacia formas más naturales y menos agresivas." }, { id: 8, question: "Marcos Becerro (2013) entiende el fitness como una filosofía donde el ejercicio físico adquiere un papel preventivo frente a enfermedades relacionadas con el sedentarismo.", answer: "Verdadero", justification: "El tema asocia el fitness con prevención de diabetes, hipertensión e hipercolesterolemia." }, { id: 9, question: "El entrenamiento funcional se diferencia del convencional porque persigue prioritariamente rendimiento competitivo específico mediante ejercicios analíticos y monoarticulares de elevada especialización deportiva.", answer: "Falso", justification: "El entrenamiento funcional utiliza ejercicios multiarticulares y multimusculares, orientados principalmente a salud y bienestar." }, { id: 10, question: "Reindell y Gerschler fueron considerados estudiosos del interval-training, aunque dicho procedimiento había sido utilizado intuitivamente anteriormente por Zatopek.", answer: "Verdadero", justification: "El tema señala expresamente que Zatopek lo utilizó intuitivamente y posteriormente fue sistematizado científicamente." }],
            tema14: [{ id: 1, question: "Zimmermann (1987) define los principios metodológicos del acondicionamiento físico como preceptos científicos cuya verificación empírica se limita a procesos de adaptación biológica derivados del esfuerzo físico.", answer: "Verdadero", justification: "El tema recoge literalmente esta definición y destaca su papel como reglas rectoras del entrenamiento." }, { id: 2, question: "Oliver (1985) sitúa la individualización dentro de los principios relacionados directamente con el estímulo, junto con variedad, continuidad y progresión de la carga.", answer: "Falso", justification: "Oliver incluye la individualización entre los principios relacionados con la respuesta al estímulo, no dentro del estímulo." }, { id: 3, question: "Según la ley de estímulos de Schult-Arnodt, los estímulos débiles situados ligeramente por encima del umbral desencadenan modificaciones fisiológicas y morfológicas profundas y permanentes.", answer: "Falso", justification: "Los estímulos débiles solo mantienen el nivel funcional, mientras que los cambios fisiológicos aparecen con estímulos fuertes u óptimos." }, { id: 4, question: "Hollmann y Hettinguer (1980) indican que un principiante comienza a desarrollar fuerza con intensidades próximas al treinta o cuarenta por ciento de su fuerza máxima.", answer: "Verdadero", justification: "El tema establece ese porcentaje para sujetos principiantes y un mínimo del 70 % para entrenados." }, { id: 5, question: "Platonov (2007) sostiene que cuando las cargas permanecen invariables durante largos periodos, su efecto entrenable aumenta progresivamente y evita procesos de estancamiento funcional.", answer: "Falso", justification: "El mantenimiento constante de cargas conduce a plateau o estancamiento, seguido posteriormente por disminución del rendimiento." }, { id: 6, question: "Ozolín (1983) propone ritmos diferentes de mejora, indicando que la flexibilidad evoluciona diariamente, la fuerza semanalmente y la resistencia anualmente.", answer: "Verdadero", justification: "El tema recoge exactamente esta progresión temporal diferenciada entre capacidades físicas." }, { id: 7, question: "El principio de variedad considera que el incremento del rendimiento se optimiza manteniendo cargas homogéneas y métodos constantes para evitar interferencias adaptativas.", answer: "Falso", justification: "El tema afirma que la mejora se consigue mediante variación de cargas y métodos." }, { id: 8, question: "El fenómeno de supercompensación explica que una adecuada relación entre carga y recuperación permite aumentar el rendimiento aprovechando procesos adaptativos posteriores al esfuerzo.", answer: "Verdadero", justification: "El fundamento biológico de la relación carga-recuperación es precisamente la supercompensación." }, { id: 9, question: "Grösser (1992) señala que las adaptaciones metabólicas necesitan meses para consolidarse, mientras que las estructuras reguladoras nerviosas se estabilizan en apenas dos semanas.", answer: "Falso", justification: "El tema afirma lo contrario: el metabolismo se adapta en 2–3 semanas, mientras el SNC requiere meses." }, { id: 10, question: "Ritter propone que el deportista participe activamente en planificación, controles periódicos y entrenamientos autónomos como aplicación práctica del principio consciente formulado por Ozolín.", answer: "Verdadero", justification: "Estas reglas aparecen expresamente derivadas del principio de participación activa y consciente." }],
            tema15: [{ id: 1, question: "McArdle sostiene una defensa categórica del calentamiento previo al ejercicio y considera empíricamente demostrados sus beneficios sobre rendimiento, prevención lesional y aprendizaje motor.", answer: "Falso", justification: "El tema señala precisamente que McArdle es uno de los autores que pone en duda dichos beneficios por falta de demostración empírica suficiente." }, { id: 2, question: "Álvarez del Villar define el calentamiento como un conjunto de ejercicios inicialmente generales y posteriormente específicos destinados a disponer al deportista para un rendimiento máximo posterior.", answer: "Verdadero", justification: "La definición aparece prácticamente de forma literal dentro del apartado conceptual del tema." }, { id: 3, question: "Freiwald (1996) atribuye al calentamiento exclusivamente mejoras fisiológicas y coordinativas, excluyendo funciones preventivas y aspectos relacionados con la disposición psicológica hacia el esfuerzo.", answer: "Falso", justification: "El tema incluye disposición psicológica y prevención de lesiones entre los efectos principales del calentamiento." }, { id: 4, question: "Durante el calentamiento, la frecuencia respiratoria en un adulto puede aumentar aproximadamente desde valores de reposo cercanos a quince o veinte respiraciones hasta unas veinticinco por minuto.", answer: "Verdadero", justification: "El tema proporciona específicamente estos valores fisiológicos de referencia." }, { id: 5, question: "El aumento de temperatura muscular producido durante el calentamiento alcanza aproximadamente treinta y siete grados y provoca incremento de la viscosidad intramuscular y reducción de la elasticidad.", answer: "Falso", justification: "El tema indica que la temperatura puede alcanzar 38,5 °C, disminuyendo viscosidad y aumentando elasticidad." }, { id: 6, question: "Un incremento aproximado de dos grados en la temperatura central puede acelerar la velocidad de conducción nerviosa y de contracción muscular alrededor de un veinte por ciento.", answer: "Verdadero", justification: "El tema atribuye este efecto a una mejora funcional del sistema neuromuscular." }, { id: 7, question: "El calentamiento pasivo mediante termoterapia o masajes puede sustituir completamente al calentamiento activo porque permite alcanzar todos los beneficios fisiológicos y psicológicos descritos.", answer: "Falso", justification: "El tema señala que el calentamiento pasivo solo puede actuar como complemento, nunca sustituir al activo." }, { id: 8, question: "En el calentamiento previo a competición, el volumen de trabajo específico debería progresar aproximadamente desde un cincuenta por ciento inicial hasta valores próximos al noventa por ciento final.", answer: "Verdadero", justification: "El tema establece exactamente esta progresión de intensidades." }, { id: 9, question: "Klumper considera que muchas lesiones musculares derivan exclusivamente de insuficiente irrigación sanguínea y descarta factores relacionados con coordinación agonista-antagonista o estiramientos excesivos.", answer: "Falso", justification: "El tema atribuye dichas lesiones a estiramientos excesivos y descoordinación agonista-antagonista, entre otros factores." }, { id: 10, question: "Cheatham (2015) observó que la autoliberación miofascial mediante foam rolling aplicada durante más de un minuto y menos de cinco puede mejorar el rango articular sin perjudicar el rendimiento.", answer: "Verdadero", justification: "El tema recoge exactamente esta conclusión respecto al foam rolling." }],
            tema16: [{ id: 1, question: "Zacziorskij (1974) definió las capacidades físicas básicas como habilidades técnicas específicas directamente dependientes de la ejecución motriz especializada y no como prerrequisitos de la acción deportiva.", answer: "Falso", justification: "Zacziorskij las define como presupuestos o prerrequisitos motrices de base sobre los que se desarrollan habilidades técnicas." }, { id: 2, question: "Manno (1989) utiliza el concepto capacidad motriz como término integrador que engloba capacidades condicionales, coordinativas e intermedias según la clasificación de Gundlach.", answer: "Verdadero", justification: "El tema presenta expresamente esa utilización conceptual por parte de Manno." }, { id: 3, question: "Bompa (1983) emplea la expresión habilidad biomotriz para referirse exclusivamente a procesos coordinativos y excluye fuerza, velocidad, resistencia y flexibilidad de dicha categoría.", answer: "Falso", justification: "Bompa incluye precisamente fuerza, resistencia, velocidad, flexibilidad y coordinación dentro de las habilidades biomotrices." }, { id: 4, question: "Entre las características atribuidas a las capacidades condicionales se encuentran la participación de procesos metabólicos, automatización elevada y movilización de grandes grupos musculares.", answer: "Verdadero", justification: "Estas características aparecen recogidas literalmente en el apartado correspondiente." }, { id: 5, question: "Gundlach (1968) incluyó la flexibilidad dentro de las capacidades coordinativas y consideró la resistencia una capacidad motora intermedia.", answer: "Falso", justification: "Gundlach clasificó fuerza, resistencia y velocidad como capacidades condicionales, mientras flexibilidad fue considerada intermedia." }, { id: 6, question: "Mora (1989) afirma que cualquier movimiento requiere participación conjunta del sistema de movimiento, alimentación y dirección, sin subordinación absoluta entre ellos.", answer: "Verdadero", justification: "El tema destaca la interacción inseparable y superposición funcional entre dichos sistemas." }, { id: 7, question: "Fidelus (1982) atribuye la producción del movimiento exclusivamente al sistema de alimentación y transporte, considerando el sistema motor un elemento accesorio sin función principal.", answer: "Falso", justification: "El tema señala que el sistema motor realiza el movimiento mediante la contracción muscular." }, { id: 8, question: "Las fases sensibles se definen como períodos ontogenéticos de tres a cinco años caracterizados por elevada predisposición para desarrollar una capacidad física determinada.", answer: "Verdadero", justification: "El tema recoge literalmente esta definición y duración aproximada." }, { id: 9, question: "Astrand y Rodahl (1985) sostienen que el VO₂ máximo relativo alcanza sus mayores valores entre los quince y dieciocho años, mientras los absolutos aparecen hacia los once años.", answer: "Falso", justification: "El tema indica lo contrario: valores absolutos entre 15–18 años y relativos entre 11–13 años." }, { id: 10, question: "Meinel y Schnabel (1988) indican que la velocidad de reacción y frecuencia de movimiento alcanzan valores similares a los adultos al finalizar la pubertad.", answer: "Verdadero", justification: "El tema explica que estas capacidades maduran tempranamente y tienden a estabilizarse alrededor de los 15–16 años." }],
            tema17: [{ id: 1, question: "Zintl (1991) define la carga de entrenamiento únicamente como el trabajo mecánico realizado durante una sesión, excluyendo expresamente las modificaciones orgánicas posteriores producidas por dicho trabajo.", answer: "Falso", justification: "Zintl incluye tanto la totalidad de estímulos aplicados como las modificaciones producidas en el organismo." }, { id: 2, question: "Manno (1991) considera la carga física un elemento central del entrenamiento que integra estímulos adaptados a necesidades físicas, psíquicas e intelectuales del deportista.", answer: "Verdadero", justification: "El tema recoge literalmente esta definición y su carácter integrador." }, { id: 3, question: "Según Verjoshanski (1990), el volumen de la carga depende exclusivamente del número total de repeticiones y excluye intensidad, densidad o complejidad del entrenamiento.", answer: "Falso", justification: "El tema indica que el volumen está determinado por volumen, intensidad, densidad y complejidad." }, { id: 4, question: "Grösser propone incrementar la carga siguiendo una secuencia que comienza aumentando frecuencia de sesiones y finaliza incrementando la intensidad del entrenamiento.", answer: "Verdadero", justification: "El orden indicado es: frecuencia, volumen, densidad e intensidad." }, { id: 5, question: "Navarro considera la dinámica monotónica como la forma más efectiva de distribución de cargas debido a su progresión continua sin disminuciones intermedias.", answer: "Falso", justification: "El tema señala que la dinámica no monotónica es más efectiva que la monotónica." }, { id: 6, question: "El principio de supercompensación establece que tras un estímulo estresante el organismo incrementa procesos regenerativos para protegerse frente a futuros esfuerzos similares.", answer: "Verdadero", justification: "El tema explica que el organismo eleva procesos regenerativos por encima del nivel inicial." }, { id: 7, question: "Nespereira define el volumen como el componente cualitativo del entrenamiento y lo expresa principalmente mediante potencia desarrollada por unidad temporal.", answer: "Falso", justification: "Nespereira define el volumen como la cantidad de solicitación ejercida sobre el organismo, siendo un componente cuantitativo." }, { id: 8, question: "Arnold, mediante la Ley del Umbral, sostiene que un estímulo solo produce adaptaciones cuando se sitúa entre una intensidad mínima y máxima determinadas.", answer: "Verdadero", justification: "El tema recoge que por debajo no hay adaptación y por encima puede producirse daño." }, { id: 9, question: "Fox y Haskell propusieron la fórmula de frecuencia cardíaca máxima de 220 menos edad, considerándola la más fiable y precisa para todas las poblaciones.", answer: "Falso", justification: "El tema señala que es la más utilizada, pero también la menos fiable." }, { id: 10, question: "Bompa (1986) establece para el entrenamiento anaeróbico aláctico una densidad óptima comprendida entre relaciones de trabajo-descanso de 1/4 y 1/25.", answer: "Verdadero", justification: "El tema recoge exactamente ese intervalo de densidad para dicho sistema metabólico." }],
            tema18: [{ id: 1, question: "Manno (1987) define la adaptación al entrenamiento como modificaciones orgánicas y funcionales dirigidas a adecuar las capacidades del organismo a las cargas específicas aplicadas.", answer: "Verdadero", justification: "El tema recoge literalmente esta definición vinculada a modificaciones de órganos y sistemas del deportista." }, { id: 2, question: "Wilhelm sostenía que una estimulación orgánica superior a lo habitual altera las capacidades funcionales reduciendo progresivamente el rendimiento y dificultando mecanismos adaptativos posteriores.", answer: "Falso", justification: "Wilhelm afirma precisamente lo contrario: la estimulación exigente incrementa la capacidad de rendimiento gracias a la adaptación." }, { id: 3, question: "Viru (1984) considera que ante estímulos inespecíficos se movilizan reservas energéticas, reservas funcionales plásticas y mecanismos defensivos específicos frente al estrés.", answer: "Verdadero", justification: "Estas tres respuestas aparecen expresamente recogidas en el apartado dedicado a adaptación." }, { id: 4, question: "Platonov considera que la adaptación rápida incluye cambios morfológicos estables y permanentes derivados de la repetición continua de estímulos durante largos periodos de entrenamiento.", answer: "Falso", justification: "La adaptación rápida comprende respuestas fisiológicas y metabólicas inmediatas, no modificaciones estables." }, { id: 5, question: "Manno (1989) afirma que la adaptación rápida engloba ajustes cardiorrespiratorios y modificaciones bioquímicas relacionadas con la activación metabólica celular.", answer: "Verdadero", justification: "El tema atribuye exactamente estos cambios funcionales a la adaptación rápida." }, { id: 6, question: "Según el tema, la fuerza y la flexibilidad requieren meses para estabilizarse, mientras el VO₂ máximo puede modificarse significativamente en pocas semanas.", answer: "Falso", justification: "El tema señala lo contrario: fuerza y flexibilidad en semanas, mientras el VO₂ máximo requiere meses." }, { id: 7, question: "La ley de Arndt-Schultz establece que las adaptaciones aparecen mediante asimilación de estímulos óptimos situados entre intensidad umbral y máxima tolerancia.", answer: "Verdadero", justification: "El tema recoge literalmente esta formulación sobre intensidad eficaz y adaptación." }, { id: 8, question: "Matveyev (1983) sostiene que estímulos inferiores al treinta por ciento de la capacidad máxima resultan eficaces para generar adaptaciones positivas y duraderas.", answer: "Falso", justification: "El tema indica expresamente que intensidades inferiores al 30 % son demasiado bajas para provocar adaptaciones duraderas." }, { id: 9, question: "Hans Selye (1955) definió el síndrome general de adaptación como un conjunto de respuestas inespecíficas funcionales desencadenadas ante cualquier estímulo agresor.", answer: "Verdadero", justification: "El tema presenta exactamente esta definición del SGA o teoría general del estrés." }, { id: 10, question: "Kaznaceev describe sujetos simpático-tónicos caracterizados por soportar cargas prolongadas y mantener adaptaciones muy estables asociadas principalmente a deportes de resistencia.", answer: "Falso", justification: "Esa descripción corresponde a los vago-tónicos; los simpático-tónicos presentan respuestas rápidas e intensas de corta duración." }],
            tema19: [{ id: 1, question: "Dal Monte (1983) clasifica las actividades de potencia como esfuerzos superiores a cuarenta segundos donde predomina la glucólisis anaeróbica frente al sistema de fosfágenos.", answer: "Falso", justification: "Las actividades de potencia duran menos de 30 segundos y predomina el sistema ATP-PC o fosfágenos." }, { id: 2, question: "La tasa metabólica de reposo suele situarse aproximadamente un quince por ciento por encima de la tasa metabólica basal al medirse en condiciones menos estrictas.", answer: "Verdadero", justification: "El tema establece que la TMR es aproximadamente un 15 % superior a la TMB." }, { id: 3, question: "Durante el proceso contracción-relajación muscular, la totalidad de la energía derivada de ATP se emplea exclusivamente en el mecanismo contráctil sin requerimientos metabólicos complementarios.", answer: "Falso", justification: "El tema indica que 2/3 se emplean en contracción y 1/3 en relajación, además del metabolismo basal celular." }, { id: 4, question: "La vía anaeróbica aláctica presenta escasa capacidad, gran potencia, mínima inercia y recuperación rápida, siendo especialmente utilizada en esfuerzos explosivos inferiores a veinte segundos.", answer: "Verdadero", justification: "Son las características fisiológicas que el tema atribuye expresamente al sistema ATP-PC." }, { id: 5, question: "La fosfofructokinasa constituye la principal enzima reguladora de la glucólisis anaeróbica y participa en procesos desarrollados fundamentalmente dentro de las mitocondrias musculares.", answer: "Falso", justification: "La glucólisis anaeróbica ocurre en el citoplasma celular, no en las mitocondrias." }, { id: 6, question: "El ciclo de Cori permite transformar ácido láctico en glucosa mediante procesos hepáticos, participando junto con bicarbonatos, corazón y riñones en su eliminación.", answer: "Verdadero", justification: "El tema recoge exactamente estos mecanismos de neutralización y reutilización del lactato." }, { id: 7, question: "La utilización significativa de grasas como fuente energética comienza aproximadamente desde los diez minutos de actividad física intensa independientemente del nivel de entrenamiento.", answer: "Falso", justification: "El tema sitúa el uso apreciable de grasas a partir de unos treinta minutos, iniciándose antes únicamente en entrenados." }, { id: 8, question: "El continuum energético establece que todas las vías metabólicas participan simultáneamente durante cualquier actividad física, aunque con proporciones variables según intensidad y duración.", answer: "Verdadero", justification: "El tema señala expresamente que ninguna vía actúa de forma aislada durante el esfuerzo." }, { id: 9, question: "El umbral anaeróbico suele asociarse con concentraciones aproximadas de dos milimoles de lactato por litro y frecuencias cardíacas inferiores a ciento veinte pulsaciones por minuto.", answer: "Falso", justification: "El tema relaciona el umbral anaeróbico con 4 mmol/l y frecuencias aproximadas de 160–170 ppm." }, { id: 10, question: "El VO₂ máximo posee una elevada dependencia genética y suele mejorar únicamente entre un diez y un veinte por ciento mediante entrenamiento específico.", answer: "Verdadero", justification: "El tema establece esta limitada capacidad de mejora frente a la mayor entrenabilidad del umbral anaeróbico." }],
            tema20: [{ id: 1, question: "Zintl (1991) define la resistencia exclusivamente como una capacidad fisiológica de larga duración, excluyendo componentes psíquicos y la recuperación posterior al esfuerzo realizado.", answer: "Falso", justification: "Zintl incluye tanto la totalidad de estímulos aplicados como las modificaciones producidas en el organismo." }, { id: 2, question: "Hollmann y Hettinger consideran resistencia general aquella que implica la participación de más de una sexta o séptima parte de la musculatura esquelética.", answer: "Verdadero", justification: "El tema establece como criterio de resistencia general la participación superior a 1/7–1/6 de la musculatura esquelética." }, { id: 3, question: "Según Zatsiorsky, la resistencia local requiere aproximadamente dos tercios de la musculatura corporal mientras que la resistencia regional utiliza únicamente un tercio.", answer: "Falso", justification: "Zatsiorsky clasifica la resistencia como local (1/3), regional (2/3) y global." }, { id: 4, question: "La resistencia aeróbica presenta elevada capacidad energética, baja potencia y una inercia aproximada entre uno y tres minutos para alcanzar un funcionamiento eficaz cardiorrespiratorio.", answer: "Verdadero", justification: "Estas características aparecen descritas literalmente en el apartado dedicado a resistencia aeróbica." }, { id: 5, question: "McArdle (2015) sostiene que el exceso de consumo de oxígeno postejercicio o COPE suele ser inferior al déficit de oxígeno generado inicialmente durante la carga.", answer: "Falso", justification: "El tema señala expresamente que la deuda de oxígeno es mayor que el déficit por necesidades recuperadoras adicionales." }, { id: 6, question: "Barbany (1990) indica que el sistema aeróbico comienza aproximadamente a partir de los treinta segundos, utilizando glucosa, aminoácidos, ácidos grasos y cetoácidos como sustratos.", answer: "Verdadero", justification: "El tema sitúa el inicio aproximado del predominio aeróbico alrededor de los 30 segundos." }, { id: 7, question: "El método interválico extensivo medio utiliza cargas entre tres y quince minutos con intensidad media y destaca especialmente por incrementar la capilarización periférica.", answer: "Falso", justification: "Esa descripción corresponde al interválico extensivo largo (IEL); el IEM utiliza cargas de 1–3 minutos." }, { id: 8, question: "Navarro (2014) considera el entrenamiento modelado una variación del método de repeticiones destinada a reproducir características específicas de la competición deportiva.", answer: "Verdadero", justification: "El tema recoge exactamente esta consideración metodológica propuesta por Navarro." }, { id: 9, question: "El entrenamiento LSD se caracteriza por intensidades próximas al máximo esfuerzo competitivo, frecuencias cardíacas superiores a ciento ochenta pulsaciones y una elevada exigencia cardiovascular continua.", answer: "Falso", justification: "El LSD se caracteriza por baja intensidad, ritmos cómodos y frecuencias generalmente inferiores a 160 ppm en jóvenes." }, { id: 10, question: "Astrand y Rodahl (2010) señalan que los mayores valores absolutos de VO₂ máximo aparecen aproximadamente entre los quince y dieciocho años.", answer: "Verdadero", justification: "El tema recoge expresamente este rango cronológico para el VO₂ máximo absoluto." }],
            tema21: [{ id: 1, question: "Guyton y Hall (2016) atribuyen al sistema cardiovascular durante el ejercicio una función principal relacionada exclusivamente con el transporte de oxígeno hacia el tejido muscular activo.", answer: "Falso", justification: "El tema indica que además transporta nutrientes y productos metabólicos hacia hígado, riñones y pulmones." }, { id: 2, question: "El plasma representa aproximadamente el cincuenta y cinco por ciento del volumen sanguíneo y está constituido principalmente por agua, proteínas y otros solutos.", answer: "Verdadero", justification: "El tema establece una composición aproximada de 91 % agua, 7 % proteínas y 2 % otros solutos." }, { id: 3, question: "Los eritrocitos poseen núcleo, presentan una vida media aproximada de noventa días y su principal función consiste en la defensa inmunológica del organismo.", answer: "Falso", justification: "Los eritrocitos carecen de núcleo, viven unos 120 días y transportan oxígeno y dióxido de carbono." }, { id: 4, question: "El nódulo sinusal situado en la aurícula derecha actúa como marcapasos cardíaco principal y origina impulsos eléctricos que regulan el ritmo cardíaco.", answer: "Verdadero", justification: "El tema identifica expresamente al nódulo sinusal como marcapasos cardíaco principal." }, { id: 5, question: "Durante la diástole cardíaca permanecen abiertas las válvulas aórtica y pulmonar, facilitando la expulsión sanguínea desde los ventrículos hacia las arterias principales.", answer: "Falso", justification: "Durante la diástole están abiertas mitral y tricúspide, mientras aórtica y pulmonar permanecen cerradas." }, { id: 6, question: "El gasto cardíaco o volumen minuto corriente depende directamente de la frecuencia cardíaca y del volumen sistólico mediante una relación multiplicativa.", answer: "Verdadero", justification: "El tema recoge la fórmula GC = FC × VS, alcanzando durante ejercicio hasta 20–30 litros/minuto." }, { id: 7, question: "Durante la espiración el dióxido de carbono abandona el organismo transportándose únicamente unido a la hemoglobina y nunca disuelto ni formando bicarbonatos.", answer: "Falso", justification: "El CO₂ se transporta 7 % disuelto, 23 % unido a hemoglobina y 70 % como bicarbonato." }, { id: 8, question: "La difusión pulmonar constituye un proceso pasivo cuya velocidad depende del grosor y superficie de la membrana respiratoria y del gradiente de presión.", answer: "Verdadero", justification: "El tema establece estos factores como determinantes directos de la velocidad de difusión gaseosa." }, { id: 9, question: "Astrand y Rodahl (2010) atribuyen el flato exclusivamente a una acumulación excesiva de ácido láctico procedente de la glucólisis anaeróbica muscular intensa.", answer: "Falso", justification: "El tema relaciona el flato con isquemia del diafragma, hígado o intestinos, no con acumulación láctica." }, { id: 10, question: "Durante el desarrollo evolutivo, la frecuencia cardíaca máxima infantil supera la adulta y solo inicia su descenso tras completarse la maduración biológica.", answer: "Verdadero", justification: "El tema indica expresamente que la FC máxima es superior en niños y disminuye posteriormente con la edad." }],
            tema22: [{ id: 1, question: "Harre (1991) define la fuerza máxima como la capacidad neuromuscular para efectuar una máxima contracción voluntaria exclusivamente en condiciones estáticas y sin desplazamiento articular alguno.", answer: "Falso", justification: "Harre incluye contracciones estáticas y dinámicas, siendo la fuerza máxima la mayor contracción voluntaria posible." }, { id: 2, question: "Los valores de fuerza excéntrica superan aproximadamente en un 39,7 % a la fuerza concéntrica y en un 13,5 % a la isométrica.", answer: "Verdadero", justification: "El tema recoge expresamente estos porcentajes comparativos entre modalidades de contracción muscular." }, { id: 3, question: "La eficiencia mecánica aumenta cuando el brazo de potencia se reduce y el brazo de resistencia se incrementa, favoreciendo especialmente la producción de fuerza máxima.", answer: "Falso", justification: "El tema indica que esta relación favorece velocidad y amplitud del movimiento, no la fuerza máxima." }, { id: 4, question: "El ciclo de estiramiento-acortamiento incrementa la potencia de la fase concéntrica gracias al reflejo miotático y a la capacidad elástica muscular acumulada previamente.", answer: "Verdadero", justification: "El tema atribuye el efecto potenciador del CEA a reflejo miotático y almacenamiento de energía elástica." }, { id: 5, question: "García Manso (1996) clasifica la fuerza máxima, fuerza veloz y fuerza resistencia como manifestaciones reactivas debido a la presencia constante de estiramiento previo.", answer: "Falso", justification: "Estas formas pertenecen a las fuerzas activas, mientras las reactivas requieren estiramiento previo." }, { id: 6, question: "Grösser (1988) señala que la potencia y la fuerza resistencia pueden iniciarse entre los ocho y trece años utilizando poca sobrecarga.", answer: "Verdadero", justification: "El tema indica que este trabajo temprano es posible por la maduración nerviosa y capacidad contráctil muscular." }, { id: 7, question: "Bompa (1983) considera que la fase general y multilateral del entrenamiento de fuerza debe centrarse prioritariamente en sobrecargas externas elevadas desde edades tempranas.", answer: "Falso", justification: "Esta fase utiliza autocargas y movimientos naturales, evitando sobrecargas elevadas en edades tempranas." }, { id: 8, question: "Entre los criterios escolares del entrenamiento de fuerza se recomienda equilibrar musculatura flexora y extensora para prevenir desequilibrios funcionales y posturales.", answer: "Verdadero", justification: "El tema incluye expresamente este criterio para evitar alteraciones musculares y posturales." }, { id: 9, question: "González Badillo y Gorostiaga (1995) describen el método de intensidades máximas I utilizando cargas próximas al cincuenta o sesenta por ciento de una repetición máxima.", answer: "Falso", justification: "El método utiliza intensidades entre 90–100 % de 1RM, con pocas repeticiones y velocidad máxima." }, { id: 10, question: "El Nordic Hamstring Exercise constituye un trabajo excéntrico donde los isquiotibiales se alargan mientras generan tensión para controlar el descenso corporal.", answer: "Verdadero", justification: "El tema lo presenta como ejemplo de entrenamiento excéntrico con importantes adaptaciones estructurales y neuromusculares." }],
            tema23: [{ id: 1, question: "Astrand (2010), Guyton (2016) y McArdle (2015) señalan que la masa muscular representa aproximadamente entre el treinta y cinco y cincuenta por ciento del peso corporal masculino.", answer: "Verdadero", justification: "El tema establece para los varones un porcentaje aproximado del 35–50 % del peso corporal." }, { id: 2, question: "Según el modelo mecánico de Hill, los elementos elásticos en paralelo están constituidos exclusivamente por líneas Z, tendones y puentes cruzados actina-miosina.", answer: "Falso", justification: "Estos corresponden a elementos elásticos en serie; los paralelos incluyen endomisio, perimisio, epimisio, aponeurosis y sarcolema." }, { id: 3, question: "Las unidades motoras pequeñas permiten movimientos más precisos porque una motoneurona inerva un número reducido de fibras musculares.", answer: "Verdadero", justification: "El tema indica que menos fibras por motoneurona proporcionan mayor control y precisión motriz, aunque menor fuerza." }, { id: 4, question: "El sarcómero, considerado unidad funcional de la miofibrilla, presenta una longitud aproximada de diez micras entre dos líneas Z consecutivas.", answer: "Falso", justification: "El tema establece una longitud aproximada de 2,5 micras, no diez micras." }, { id: 5, question: "Durante la contracción muscular, la liberación de calcio desde el retículo sarcoplásmico permite descubrir los centros activos de actina mediante cambios troponina-tropomiosina.", answer: "Verdadero", justification: "El calcio se une a la troponina C, modificando el complejo troponina-tropomiosina y permitiendo formar puentes cruzados." }, { id: 6, question: "La bomba de calcio consume una molécula de ATP por cada molécula de calcio introducida nuevamente en las cisternas del retículo sarcoplásmico.", answer: "Falso", justification: "El tema señala que se consume una molécula de ATP por cada dos moléculas de calcio transportadas." }, { id: 7, question: "Las fibras tipo IIb presentan elevada capacidad glucolítica, motoneuronas grandes y producción intensa de energía anaeróbica con escasa resistencia a la fatiga.", answer: "Verdadero", justification: "El tema atribuye exactamente estas características a las fibras rápidas glucolíticas IIb." }, { id: 8, question: "McArdle (2015) y Wilmore (1994) indican que el músculo sóleo presenta aproximadamente un ochenta por ciento de fibras rápidas FT.", answer: "Falso", justification: "El sóleo presenta aproximadamente 80 % fibras lentas ST y 20 % FT." }, { id: 9, question: "Wilmore (2014) afirma que el entrenamiento en adolescentes provoca importantes procesos de hipertrofia muscular incluso antes de la maduración endocrina completa.", answer: "Falso", justification: "El tema indica que la hipertrofia significativa no parece inducirse plenamente hasta la maduración endocrina completa." }, { id: 10, question: "Entre las consideraciones didácticas se recomienda evitar trabajos de fuerza máxima y cargas elevadas, priorizando calidad técnica y progresión de cargas.", answer: "Verdadero", justification: "El tema recoge estas recomendaciones como medidas preventivas para evitar lesiones y desequilibrios." }],
            tema24: [{ id: 1, question: "El sistema nervioso central está compuesto por el encéfalo y la médula espinal, mientras el sistema nervioso periférico incluye nervios craneales y espinales.", answer: "Verdadero", justification: "Esta es la división anatómica básica del sistema nervioso descrita en el tema." }, { id: 2, question: "La neuroglia tiene una función puramente estructural, proporcionando soporte mecánico a las neuronas sin intervenir en la nutrición o defensa neuronal.", answer: "Falso", justification: "La neuroglia, además de soporte, realiza funciones metabólicas, nutritivas, aislantes y defensivas." }, { id: 3, question: "Las dendritas son prolongaciones neuronales encargadas principalmente de recibir estímulos y conducirlos hacia el cuerpo neuronal o soma.", answer: "Verdadero", justification: "El tema define a las dendritas como receptores de estímulos que conducen el impulso hacia el soma." }, { id: 4, question: "El potencial de reposo de la neurona se mantiene gracias a la acción exclusiva de la difusión pasiva de iones a través de la membrana.", answer: "Falso", justification: "La bomba sodio-potasio es fundamental para mantener el potencial de reposo mediante transporte activo." }, { id: 5, question: "El potencial de acción es un fenómeno todo o nada donde la despolarización debe alcanzar un umbral crítico para propagarse a lo largo del axón.", answer: "Verdadero", justification: "Este principio explica cómo se propagan los impulsos nerviosos en las neuronas." }, { id: 6, question: "La transmisión sináptica química ocurre cuando el impulso nervioso alcanza el botón presináptico y desencadena la liberación de neurotransmisores.", answer: "Verdadero", justification: "La liberación de neurotransmisores es el mecanismo fundamental de la sinapsis química." }, { id: 7, question: "Los ganglios basales participan principalmente en el procesamiento sensorial consciente y el aprendizaje reflexivo de conceptos complejos.", answer: "Falso", justification: "Los ganglios basales están involucrados en la regulación del movimiento, tono muscular y aprendizaje motor." }, { id: 8, question: "El sistema nervioso autónomo regula funciones involuntarias como la frecuencia cardíaca, digestión y presión arterial, actuando de forma refleja.", answer: "Verdadero", justification: "El sistema autónomo o vegetativo controla precisamente estas funciones vitales automáticas." }, { id: 9, question: "La médula espinal solo actúa como vía de transmisión ascendente y descendente, sin capacidad para generar respuestas motoras reflejas.", answer: "Falso", justification: "La médula es el centro de muchos actos reflejos, independientemente de su función de vía de transmisión." }, { id: 10, question: "La plasticidad neuronal es la capacidad del sistema nervioso para reorganizar sus conexiones funcionales en respuesta a la experiencia o al aprendizaje.", answer: "Verdadero", justification: "Este concepto es clave para entender la adaptabilidad del sistema nervioso al entrenamiento y aprendizaje motor." }],
            tema25: [{ id: 1, question: "Guyton y Hall (2016) consideran que el sistema nervioso controla principalmente actividades lentas y procesos metabólicos sostenidos, mientras el sistema endocrino regula respuestas rápidas.", answer: "Falso", justification: "El tema establece justamente lo contrario: el sistema nervioso controla actividades rápidas, mientras el endocrino actúa generalmente de forma más lenta." }, { id: 2, question: "Las células de Schwann participan en la formación de la vaina de mielina alrededor de determinados axones, dejando entre ellas los nódulos de Ranvier.", answer: "Verdadero", justification: "El tema explica que las zonas no recubiertas por células de Schwann constituyen los nódulos de Ranvier." }, { id: 3, question: "Las neuronas multipolares presentan una única prolongación que se divide posteriormente en dos ramas con características estructurales y funcionales de axón.", answer: "Falso", justification: "Esa descripción corresponde a las neuronas unipolares, no a las multipolares." }, { id: 4, question: "El potencial de membrana en reposo neuronal presenta aproximadamente un valor de menos setenta milivoltios, manteniendo el interior celular eléctricamente negativo respecto al exterior.", answer: "Verdadero", justification: "El tema señala exactamente un potencial de reposo de −70 mV." }, { id: 5, question: "El principio del todo o nada establece que cualquier estímulo inferior a cinco milivoltios desencadena automáticamente un potencial de acción completo y propagado.", answer: "Falso", justification: "El tema sitúa el umbral entre 15–20 mV, y valores inferiores no desencadenan potencial de acción." }, { id: 6, question: "Thibodeau y Patton (1998) definen el impulso nervioso como una onda autopropagada de alteraciones eléctricas que recorre la membrana plasmática neuronal.", answer: "Verdadero", justification: "La definición aparece prácticamente de forma literal en el apartado dedicado a transmisión nerviosa." }, { id: 7, question: "La transmisión sináptica presenta carácter bidireccional, permitiendo que un impulso nervioso avance o retroceda indistintamente entre neuronas conectadas.", answer: "Falso", justification: "El tema señala el principio de conducción anterógrada o transmisión unidireccional." }, { id: 8, question: "El sistema extrapiramidal participa especialmente en el control inconsciente de la marcha, el equilibrio y determinados movimientos lentos o poco precisos.", answer: "Verdadero", justification: "El tema atribuye exactamente estas funciones al sistema extrapiramidal." }, { id: 9, question: "El reflejo miotático utiliza como receptor principal el órgano tendinoso de Golgi y provoca relajación muscular automática ante pequeños estiramientos.", answer: "Falso", justification: "El reflejo miotático utiliza el huso neuromuscular y desencadena contracción refleja, no relajación." }, { id: 10, question: "Astrand (2010) señala que durante la pubertad el sistema nervioso vegetativo presenta inestabilidad funcional relacionada con cambios orgánicos y bruscas variaciones emocionales.", answer: "Verdadero", justification: "El tema recoge expresamente esta característica evolutiva propia de la pubertad y adolescencia." }]
        };

        let currentTopic = 'tema10';

        function switchTab(topic) {
            currentTopic = topic;
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + topic).classList.add('active');
            renderQuiz();
        }

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = `<h2 class="text-xl font-bold mb-4 capitalize text-gray-800">${currentTopic.replace('tema', 'Tema ')}</h2>`;
            
            quizData[currentTopic].forEach((q, index) => {
                const qDiv = document.createElement('div');
                qDiv.className = "mb-6 p-4 bg-gray-50 rounded-lg shadow-sm border border-gray-100";
                qDiv.innerHTML = `
                    <p class="font-medium mb-3 text-gray-700">${index + 1}. ${q.question}</p>
                    <div class="flex gap-4">
                        <label class="cursor-pointer flex items-center text-sm"><input type="radio" name="q${q.id}" value="Verdadero" class="mr-2"> Verdadero</label>
                        <label class="cursor-pointer flex items-center text-sm"><input type="radio" name="q${q.id}" value="Falso" class="mr-2"> Falso</label>
                    </div>
                    <div id="feedback-${q.id}" class="mt-3 hidden p-3 rounded-md text-sm font-medium"></div>
                `;
                container.appendChild(qDiv);
            });

            container.innerHTML += `<button onclick="submitQuiz()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold mt-4 hover:bg-blue-700 transition duration-200">Finalizar Examen</button>`;
        }

        function submitQuiz() {
            quizData[currentTopic].forEach(q => {
                const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
                const feedbackDiv = document.getElementById(`feedback-${q.id}`);
                const userAnswer = selected ? selected.value : null;
                
                feedbackDiv.classList.remove('hidden');
                if (userAnswer === q.answer) {
                    feedbackDiv.className = "mt-3 p-3 rounded-md text-sm bg-green-100 text-green-800";
                    feedbackDiv.innerHTML = `<strong>¡Correcto!</strong> ${q.justification}`;
                } else if (!userAnswer) {
                    feedbackDiv.className = "mt-3 p-3 rounded-md text-sm bg-yellow-100 text-yellow-800";
                    feedbackDiv.innerHTML = `<strong>Incompleto.</strong> La respuesta era ${q.answer}. ${q.justification}`;
                } else {
                    feedbackDiv.className = "mt-3 p-3 rounded-md text-sm bg-red-100 text-red-800";
                    feedbackDiv.innerHTML = `<strong>Incorrecto.</strong> La respuesta era ${q.answer}. ${q.justification}`;
                }
            });
        }

        window.onload = () => {
            switchTab('tema10');
        };
    </script>
</body>
