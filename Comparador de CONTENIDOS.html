<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<meta content="light dark" name="color-scheme"/>
<title>Comparativa Currículo EF (ESO / Bachillerato)</title>
<style>
    :root{
      /* Brand-ish neutral palette (PREMIR-friendly) */
      --bg: #f5f7fb;
      --panel: #ffffff;
      --panel2: #fbfcff;
      --text: #0f172a;
      --muted: #475569;
      --muted2:#64748b;
      --accent: #111827;
      --accent2:#0b1220;
      --brand: #2563eb; /* subtle blue for focus & highlights */
      --brand2:#1d4ed8;
      --used: #16a34a; /* visited/used example chip */
      --border:#e5e7eb;
      --shadow: 0 10px 30px rgba(15,23,42,.08);
      --shadow2: 0 10px 18px rgba(15,23,42,.08);
      --radius: 14px;
      --radius2: 18px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif;
      --ring: 0 0 0 3px rgba(37,99,235,.22);

      --chip-bg:#eef2ff;
      --chip-border:#c7d2fe;

      --details-bg:#ffffff;
      --details-hover:#f8fafc;

      --kbd-bg:#0b1220;
      --kbd-bd: rgba(255,255,255,.18);
      --kbd-tx: rgba(255,255,255,.92);

      --footer-bg: rgba(11,18,32,.84);
    }

    /* Dark mode */
    [data-theme="dark"]{
      --bg:#0b1220;
      --panel:#0f172a;
      --panel2:#0c1426;
      --text:#e5e7eb;
      --muted:#b6c2d1;
      --muted2:#8fa1b7;
      --accent:#e5e7eb;
      --accent2:#ffffff;
      --border: rgba(255,255,255,.12);
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --shadow2: 0 10px 18px rgba(0,0,0,.35);
      --ring: 0 0 0 3px rgba(96,165,250,.22);

      --chip-bg: rgba(99,102,241,.16);
      --chip-border: rgba(99,102,241,.35);

      --details-bg:#0f172a;
      --details-hover:#0c1528;

      --footer-bg: rgba(2,6,23,.78);
    }

    *{box-sizing:border-box}
    html, body{height:100%}
    body{
      margin:0;
      font-family:var(--sans);
      background: radial-gradient(1100px 400px at 10% -10%, rgba(37,99,235,.10), transparent 60%),
                  radial-gradient(800px 300px at 90% -20%, rgba(99,102,241,.10), transparent 55%),
                  linear-gradient(180deg, var(--bg) 0%, color-mix(in srgb, var(--bg), #000 2%) 100%);
      color:var(--text);
    }
    a{color:var(--brand2)}
    .wrap{max-width:1280px; margin:0 auto; padding:14px}
    .wrap.full{max-width:none}
    header{
      position:static;
      background: var(--panel);
      border-bottom:1px solid var(--border);
    }
    .head-inner{
      max-width:1280px;
      margin:0 auto;
      padding:10px 14px 8px;
    }
    .brand{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:8px;
    }
    .brand-left{
      display:flex;
      align-items:center;
      gap:14px;
      min-width: 260px;
    }
    .brand img{height:44px;width:auto;display:block}
    h1{font-size:18px; margin:0; letter-spacing:.2px}
    .sub{color:var(--muted); font-size:12px; line-height:1.35; margin:2px 0 0}
    .top-actions{
      display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    }

    .controls{
      display:grid;
      grid-template-columns: 1fr 1fr;
      grid-template-areas:
        "courses block"
        "search search";
      gap:8px;
      align-items:stretch;
    }
        .controls .area-search{grid-area: search}
    .controls .area-courses{grid-area: courses}
    .controls .area-block{grid-area: block}
    @media (max-width: 1080px){
      .controls{
        grid-template-columns: 1fr;
        grid-template-areas:
          "courses"
          "block"
          "search";
      }
    }

    .card{
      width:100%;
      background: var(--panel);
      border:1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding:8px;
    }
    .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
    label{font-size:11px; color:var(--muted); font-weight:900; letter-spacing:.2px}
    .seg{display:flex; gap:5px; flex-wrap:wrap;}

    .btn{
      cursor:pointer;
      border:1px solid var(--border);
      background: var(--panel2);
      color: var(--text);
      padding:8px 12px;
      border-radius:999px;
      font-size:13px;
      font-weight:800;
      transition: .15s transform, .15s background, .15s border, .15s color, .15s box-shadow;
      user-select:none;
      display:inline-flex;
      gap:8px;
      align-items:center;
      line-height:1;
    }
    .btn:hover{transform: translateY(-1px); box-shadow: 0 10px 24px rgba(15,23,42,.10)}
    .btn:active{transform: translateY(0px)}
    .btn:focus-visible{outline:none; box-shadow: var(--ring)}
    .btn.active{
      background: var(--accent);
      color: color-mix(in srgb, var(--accent), #fff 90%);
      border-color: color-mix(in srgb, var(--accent), #fff 18%);
    }
    .btn.ghost{
      background: transparent;
      border-color: var(--border);
      color: var(--text);
    }
    .btn.danger{
      background: color-mix(in srgb, #ef4444, transparent 85%);
      border-color: color-mix(in srgb, #ef4444, transparent 55%);
      color: color-mix(in srgb, #ef4444, #fff 20%);
    }
    .btn.small{padding:7px 10px; font-size:12px}

    .search{
      width:100%;
      padding:6px 9px;
      border-radius:10px;
      border:1px solid var(--border);
      background: var(--panel2);
      color: var(--text);
      outline:none;
      font-size:13px;
    }
    .search::placeholder{color: color-mix(in srgb, var(--muted2), transparent 10%)}
    .search:focus{box-shadow: var(--ring); border-color: color-mix(in srgb, var(--brand), transparent 40%)}

    .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
    .quickWrap{margin-top:6px}
    .quickTerms{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      max-height:88px;
      overflow:auto;
      padding:2px;
    }
    .quickChip{
      cursor:pointer;
      border:1px solid var(--border);
      background: var(--panel2);
      color: var(--text);
      padding:6px 8px;
      border-radius:999px;
      font-size:11.5px;
      font-weight:900;
      line-height:1;
      white-space:nowrap;
      transition: .12s transform, .12s background;
      user-select:none;
    }
    .quickChip:hover{transform: translateY(-1px)}
    .quickChip.active{
      background: color-mix(in srgb, var(--brand), transparent 86%);
      border-color: color-mix(in srgb, var(--brand), transparent 55%);
    }
    /* Ejemplos de búsqueda (caja moderna con chips numerados) */
    .quickWrap{ margin-top: 10px; }
    .quickBox{
      background: color-mix(in srgb, var(--panel), transparent 0%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,.06);
    }
    .quickBoxHead{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap: 10px;
      padding: 0 2px 8px 2px;
      border-bottom: 1px solid color-mix(in srgb, var(--border), transparent 35%);
      margin-bottom: 10px;
    }
    .quickBoxTitle{ font-weight: 700; letter-spacing: .2px; }
    .quickBoxHint{ color: var(--muted); font-size: 12px; }

    .quickTerms{ display:block; }

    /* Grid de chips (numeración con counter) */
    .exampleList{
      list-style: none;
      counter-reset: ex;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 6px;
    }
    .exampleList li{
      counter-increment: ex;
      margin: 0;
    }

    .exampleItem{
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;

      cursor: pointer;
      border: 1px solid var(--border);
      background: color-mix(in srgb, var(--panel), transparent 0%);
      color: var(--text);

      padding: 7px 10px;
      border-radius: 12px;
      text-align: left;
      font: inherit;
      font-size: 11px;
      line-height: 1.25;

      transition: .12s transform, .12s background, .12s border-color;
    }

    .exampleItem::before{
      content: counter(ex);
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      font-weight: 700;
      font-size: 11px;
      background: color-mix(in srgb, var(--brand), transparent 86%);
      border: 1px solid color-mix(in srgb, var(--brand), transparent 55%);
      color: var(--text);
    }

    .exampleItem:hover{
      transform: translateY(-1px);
      background: color-mix(in srgb, var(--brand), transparent 93%);
      border-color: color-mix(in srgb, var(--brand), transparent 55%);
    }

    .exampleItem:focus-visible{
      outline: 2px solid color-mix(in srgb, var(--brand), transparent 35%);
      outline-offset: 2px;
    }

    .exampleItem.used{
      background: color-mix(in srgb, var(--used), transparent 88%);
      border-color: color-mix(in srgb, var(--used), transparent 45%);
    }

    .exampleItem.used::before{
      background: color-mix(in srgb, var(--used), transparent 86%);
      border-color: color-mix(in srgb, var(--used), transparent 45%);
      color: color-mix(in srgb, var(--used), var(--text) 18%);
    }

    .exampleItem.active{
      background: color-mix(in srgb, var(--brand), transparent 88%);
      border-color: color-mix(in srgb, var(--brand), transparent 40%);
    }
.chip{
      background: var(--chip-bg);
      border:1px solid var(--chip-border);
      padding:6px 8px;
      border-radius:999px;
      font-size:12px;
      color: var(--text);
      display:flex;
      gap:8px;
      align-items:center;
    }
    .chip button{
      cursor:pointer;
      border:none;
      background: transparent;
      color: color-mix(in srgb, var(--text), transparent 25%);
      font-size:14px;
      line-height:1;
      padding:0;
      margin:0;
    }
    .chip button:focus-visible{outline:none; box-shadow: var(--ring); border-radius:8px}

    .hint{font-size:11px;color:var(--muted2);margin-top:6px;line-height:1.35}
    .content{margin-top:14px}

    .toolbar{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      margin-top:8px;
    }
    .stats{
      font-size:12px;
      color:var(--muted);
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
    }
    .badge{
      font-family: var(--mono);
      font-size:11px;
      padding:4px 8px;
      border-radius:999px;
      border:1px solid var(--border);
      background: color-mix(in srgb, var(--panel2), transparent 10%);
      color: var(--text);
    }

    .grid{
      display:grid;
      gap:12px;
      align-items:start;
    }
    .grid.grid-5{ grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .grid.grid-6{ grid-template-columns: repeat(6, minmax(0, 1fr)); }
    @media (max-width: 1500px){
      .grid.grid-6{ grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 1400px){
      .grid.grid-5{ grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 1000px){
      .grid.grid-5, .grid.grid-6{ grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 640px){
      .grid.grid-5, .grid.grid-6{ grid-template-columns: 1fr; }
    }

    .col{
      --colbg: var(--panel);
      background: var(--colbg);
      border:1px solid var(--border);
      border-radius: var(--radius2);
      overflow:hidden;
      box-shadow: var(--shadow);
      min-height: 140px;
    }
    .col-title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:12px 14px;
      border-bottom:1px solid var(--border);
      background: linear-gradient(180deg, color-mix(in srgb, var(--panel2), transparent 0%), var(--colbg));
      }
    .col-title h2{font-size:14px; margin:0}
    .pill{
      font-family:var(--mono);
      font-size:11px;
      color: var(--muted);
      border:1px solid var(--border);
      background: color-mix(in srgb, var(--panel2), transparent 10%);
      padding:4px 8px;
      border-radius:999px;
      white-space:nowrap;
    }

    details{
      border-bottom: 1px solid var(--border);
      padding:10px 14px;
      background: var(--details-bg);
    }
    details:hover{background: var(--details-hover)}
    details:last-child{border-bottom:none}

    summary{
      cursor:pointer;
      list-style:none;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      font-weight:900;
      font-size:13px;
      color: var(--text);
    }
    summary::-webkit-details-marker{display:none}
    .sum-left{display:flex; align-items:center; gap:10px; min-width:0}
    .blockTag{
      font-family:var(--mono);
      font-size:11px;
      padding:4px 7px;
      border-radius:10px;
      border:1px solid color-mix(in srgb, var(--brand), transparent 60%);
      background: color-mix(in srgb, var(--brand), transparent 88%);
      color: color-mix(in srgb, var(--text), transparent 0%);
      flex:0 0 auto;
    }

    /* Block icon system (faster scanning) */
    .blockTag{
      font-family:var(--sans);
      font-size:14px;
      padding:4px 7px;
      border-radius:999px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:30px;
      line-height:1;
      border:1px solid var(--border);
      background: var(--panel2);
    }
    .blockTag .ico{filter:saturate(1.05)}
    .blockTag[data-b="1"]{background: color-mix(in srgb, #22c55e, transparent 85%); border-color: color-mix(in srgb, #22c55e, transparent 55%)}
    .blockTag[data-b="2"]{background: color-mix(in srgb, #06b6d4, transparent 85%); border-color: color-mix(in srgb, #06b6d4, transparent 55%)}
    .blockTag[data-b="3"]{background: color-mix(in srgb, #f59e0b, transparent 85%); border-color: color-mix(in srgb, #f59e0b, transparent 55%)}
    .blockTag[data-b="4"]{background: color-mix(in srgb, #a855f7, transparent 86%); border-color: color-mix(in srgb, #a855f7, transparent 58%)}
    .blockTag[data-b="5"]{background: color-mix(in srgb, #ef4444, transparent 86%); border-color: color-mix(in srgb, #ef4444, transparent 58%)}
    .blockTag[data-b="6"]{background: color-mix(in srgb, #3b82f6, transparent 86%); border-color: color-mix(in srgb, #3b82f6, transparent 58%)}

    .blockTitle{
      font-weight:900;
      font-size:12.5px;
      color: var(--text);
    }

    .sum-text{
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .sum-right{
      color: var(--muted);
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
    }

    .list{margin:6px 0 0; padding:0; list-style:none}
    .list li{
      margin:4px 0;
      line-height:1.4;
      color: var(--text);
      font-size:12.5px;
    }
    .code{
      font-family:var(--mono);
      font-size:10.5px;
      color: var(--text);
      font-weight:900;
      background: color-mix(in srgb, var(--panel2), transparent 0%);
      border:1px solid var(--border);
      padding:1px 6px;
      border-radius:999px;
    }

    mark{
      background: color-mix(in srgb, var(--brand), transparent 75%);
      color: inherit;
      border-radius: 6px;
      padding: 0 2px;
    }

    .empty{
      padding:16px;
      border:1px dashed color-mix(in srgb, var(--border), transparent 0%);
      border-radius: var(--radius);
      color: var(--muted);
      background: color-mix(in srgb, var(--panel2), transparent 0%);
      margin:12px;
    }

    .footer{display:none}
    .footer-inner{
      max-width:1280px;
      width:100%;
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
    }
    .kbd{
      font-family:var(--mono);
      font-size:11px;
      padding:3px 6px;
      border-radius:8px;
      border:1px solid var(--kbd-bd);
      background: color-mix(in srgb, var(--kbd-bg), transparent 0%);
      color: var(--kbd-tx);
    }
    .footer .btn{
      background: rgba(255,255,255,.10);
      color: rgba(255,255,255,.92);
      border-color: rgba(255,255,255,.16);
    }
    .footer .btn.active{background: rgba(255,255,255,.18)}
    .footer .btn:hover{box-shadow:none}

    /* Better checkboxes */
    .check{
      display:flex;
      align-items:center;
      gap:8px;
      padding:7px 10px;
      border:1px solid var(--border);
      border-radius:999px;
      background: var(--panel2);
      cursor:pointer;
      user-select:none;
    }
    .check input{accent-color: var(--brand)}
    .check span{font-size:12px; font-weight:800; color: var(--text)}
    .check:has(input:focus-visible){box-shadow: var(--ring)}
    .check.off{opacity:.55}

    /* Print */
    @media print{
      header, .footer{display:none}
      body{background:#fff}
      .wrap{padding:0}
      .grid{grid-template-columns: 1fr 1fr !important}
      details{break-inside: avoid}
      .col{box-shadow:none}
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce){
      .btn{transition:none}
      header{backdrop-filter:none}
    }
  

/* ===== Ajustes solicitados (v3) ===== */
/* Solo el encabezado (título) queda flotante */
header.appbar{
  position: sticky;
  top: 0;
  z-index: 1000;
  background: rgba(255,255,255,.78);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
[data-theme="dark"] .appbar{
  background: rgba(15,23,42,.72);
  border-bottom: 1px solid rgba(255,255,255,.10);
}

.modebar{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  padding:6px 8px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--panel);
  box-shadow: 0 6px 18px rgba(15,23,42,.06);
}
.modebar-label{
  font-size:.85rem;
  color: var(--muted2);
  font-weight:600;
}
.modebar #modeSeg .btn{
  padding: 6px 10px;
  font-size: .82rem;
}
@media (max-width: 720px){
  .modebar-label{display:none;}
  .modebar #modeSeg .btn{padding:6px 9px; font-size:.8rem;}
}

/* Los módulos superiores (cards de controles) NO flotan y ocupan menos */
.controls{
  margin-top: 10px;
  gap: 10px;
}
.controls .card{
  box-shadow: none;
  padding: 6px 8px;
}
.controls .card label{
  margin-bottom: 6px;
}

/* Caja de ejemplos más compacta y sin sombra */
.quickBox{
  padding: 8px;
  box-shadow: none;
}
.quickBoxHead{
  margin-bottom: 8px;
  padding-bottom: 6px;
}

/* Chips de ejemplo más pequeños */
.exampleList{
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 6px;
}
.exampleItem{
  padding: 6px 8px;
  border-radius: 10px;
  font-size: 10.5px;
}
.exampleItem::before{
  width: 18px;
  height: 18px;
  border-radius: 7px;
  font-size: 10px;
}


    /* === Colores alternos para resultados (bloques) === */
    .grid > .col:nth-child(6n+1){ --colbg: color-mix(in srgb, #3b82f6, transparent 92%); border-color: color-mix(in srgb, #3b82f6, transparent 70%); }
    .grid > .col:nth-child(6n+2){ --colbg: color-mix(in srgb, #22c55e, transparent 92%); border-color: color-mix(in srgb, #22c55e, transparent 70%); }
    .grid > .col:nth-child(6n+3){ --colbg: color-mix(in srgb, #a855f7, transparent 92%); border-color: color-mix(in srgb, #a855f7, transparent 70%); }
    .grid > .col:nth-child(6n+4){ --colbg: color-mix(in srgb, #f59e0b, transparent 92%); border-color: color-mix(in srgb, #f59e0b, transparent 70%); }
    .grid > .col:nth-child(6n+5){ --colbg: color-mix(in srgb, #06b6d4, transparent 92%); border-color: color-mix(in srgb, #06b6d4, transparent 70%); }
    .grid > .col:nth-child(6n+6){ --colbg: color-mix(in srgb, #64748b, transparent 92%); border-color: color-mix(in srgb, #64748b, transparent 70%); }

    /* === Módulo Buscar palabras con fondo profesional diferenciado === */
    .area-search{
      background: color-mix(in srgb, #0ea5e9, transparent 93%);
      border-color: color-mix(in srgb, #0ea5e9, transparent 72%);
    }
    .area-search .quickBox{
      background: color-mix(in srgb, #0ea5e9, transparent 96%);
      border-color: color-mix(in srgb, #0ea5e9, transparent 82%);
    }


/* =========================
   Modern professional skin
   (solo estilos; sin tocar JS)
   ========================= */

:root{
  --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
  --bg: #f6f7fb;
  --panel: #ffffff;
  --panel2: #f3f5f9;
  --text: #0f172a;
  --muted: #475569;
  --border: rgba(15,23,42,.12);
  --shadow: 0 10px 30px rgba(15,23,42,.08);
  --shadow2: 0 6px 18px rgba(15,23,42,.06);
  --ring: 0 0 0 4px rgba(37,99,235,.18);
  --radius: 14px;
  --radius2: 16px;
  --accent: #2563eb;
  --accent-2: #1d4ed8;
}

[data-theme="dark"]{
  --bg:#0b1220;
  --panel:#0f172a;
  --panel2:#0b1324;
  --text:#e5e7eb;
  --muted:#a7b0c0;
  --border: rgba(148,163,184,.18);
  --shadow: 0 16px 36px rgba(0,0,0,.35);
  --shadow2: 0 10px 22px rgba(0,0,0,.28);
  --ring: 0 0 0 4px rgba(96,165,250,.22);
}

body{
  background:
    radial-gradient(900px 420px at 15% -10%, rgba(37,99,235,.10), transparent 60%),
    radial-gradient(900px 420px at 95% -15%, rgba(99,102,241,.08), transparent 55%),
    var(--bg) !important;
  color: var(--text) !important;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

a{color: inherit}
h1, h2, h3{letter-spacing: .1px}

/* Header (único sticky) */
.appbar{
  background: color-mix(in srgb, var(--panel), transparent 4%) !important;
  border-bottom: 1px solid var(--border) !important;
  box-shadow: 0 10px 22px rgba(15,23,42,.06) !important;
  backdrop-filter: blur(10px);
}
.brand img{height:40px !important}
h1{font-size: 17px !important; font-weight: 700 !important}
.sub{font-size: 12px !important; color: var(--muted) !important}

/* Cards / panels */
.card{
  background: var(--panel) !important;
  border-color: var(--border) !important;
  box-shadow: var(--shadow2) !important;
  padding: 10px 12px !important;
}
label{
  font-weight: 700 !important;
  color: color-mix(in srgb, var(--muted), var(--text) 20%) !important;
}

/* Inputs */
.search, input[type="text"], select, textarea{
  background: color-mix(in srgb, var(--panel), var(--panel2) 12%) !important;
  border: 1px solid var(--border) !important;
  box-shadow: none !important;
}
.search:focus, input[type="text"]:focus, select:focus, textarea:focus{
  outline: none !important;
  box-shadow: var(--ring) !important;
  border-color: color-mix(in srgb, var(--accent), var(--border) 50%) !important;
}

/* Buttons */
.btn{
  font-weight: 650 !important;
  letter-spacing: .1px;
  background: var(--panel2) !important;
  border-color: var(--border) !important;
  box-shadow: none !important;
}
.btn:hover{
  transform: translateY(-1px);
  box-shadow: 0 10px 20px rgba(15,23,42,.10) !important;
  border-color: color-mix(in srgb, var(--border), var(--accent) 18%) !important;
}
.btn.active{
  background: var(--accent) !important;
  border-color: color-mix(in srgb, var(--accent), #fff 18%) !important;
  color: #fff !important;
}
.btn.ghost{
  background: transparent !important;
}

/* "Buscar palabras" panel */
#searchCard, .searchCard, .card.searchCard, .card[data-card="search"], .card.search, .card.area-search{
  background: linear-gradient(180deg,
    color-mix(in srgb, var(--accent), transparent 92%),
    var(--panel) 60%) !important;
  border-color: color-mix(in srgb, var(--accent), var(--border) 70%) !important;
}

/* Quick terms box */
.quickBox{
  background: color-mix(in srgb, var(--panel2), var(--panel) 30%) !important;
  border-color: var(--border) !important;
  box-shadow: none !important;
}
.quickChip{
  background: var(--panel) !important;
  border-color: var(--border) !important;
  font-weight: 650 !important;
}
.quickChip:hover{
  border-color: color-mix(in srgb, var(--accent), var(--border) 55%) !important;
  box-shadow: 0 10px 18px rgba(15,23,42,.08) !important;
}
.quickChip.active{
  background: color-mix(in srgb, var(--accent), transparent 86%) !important;
  border-color: color-mix(in srgb, var(--accent), transparent 55%) !important;
}

/* Result columns */
.col{
  border-color: var(--border) !important;
  box-shadow: var(--shadow2) !important;
}
.col-title{
  background: color-mix(in srgb, var(--panel), var(--panel2) 18%) !important;
}
details{
  background: color-mix(in srgb, var(--panel2), var(--panel) 10%) !important;
}
details:hover{
  background: color-mix(in srgb, var(--panel2), var(--panel) 2%) !important;
}
summary{
  font-weight: 650 !important;
}

/* Improve readability in long content */
.content, .txt, .item, details p, details li{
  color: color-mix(in srgb, var(--text), var(--muted) 8%) !important;
  line-height: 1.55 !important;
}

const THEMES = [
  {id:"silver",   label:"Plata"},

  {id:"mint",     label:"Menta"},

  {id:"blush",    label:"Rubor"},
  {id:"lemon",    label:"Limón"},
];

function applyTheme(id){
  const root = document.documentElement;
  root.dataset.theme = id;
  try{ localStorage.setItem("premir_theme", id); }catch(e){}
  const t = THEMES.find(x=>x.id===id);
  const btn = document.getElementById("btnTheme");
  if(btn && t) btn.title = `Tema: ${t.label} (clic para cambiar)`;
}

function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem("premir_theme"); }catch(e){}
    const initial = THEMES.some(t=>t.id===saved) ? saved : "silver";
  applyTheme(initial);
  const btn = document.getElementById("btnTheme");
  if(btn){
    btn.addEventListener("click", ()=>{
            const cur = document.documentElement.dataset.theme || "silver";
      const idx = Math.max(0, THEMES.findIndex(t=>t.id===cur));
      const next = THEMES[(idx+1)%THEMES.length].id;
      applyTheme(next);
    });
  }
}

/* User-added quick examples (persist in localStorage) */
const USER_QUICK_TERMS_KEY = "cmp_user_quick_terms_v1";
function loadUserQuickTerms(){
  try{
    const raw = localStorage.getItem(USER_QUICK_TERMS_KEY);
    if(!raw) return [];
    const arr = JSON.parse(raw);
    if(!Array.isArray(arr)) return [];
    return arr
      .filter(v => typeof v === "string")
      .map(v => v.trim())
      .filter(Boolean);
  }catch(_e){ return []; }
}
function saveUserQuickTerms(arr){
  try{ localStorage.setItem(USER_QUICK_TERMS_KEY, JSON.stringify(arr)); }catch(_e){}
}
let userQuickTerms = loadUserQuickTerms();

function getAllQuickTerms(){
  const out = [];
  const seen = new Set();
  const add = (t)=>{
    const nt = norm(t);
    if(!nt || seen.has(nt)) return;
    seen.add(nt);
    out.push(t);
  };
  QUICK_TERMS.forEach(add);
  userQuickTerms.forEach(add);
  return out;
}

/* Parse query into normalized terms */
function parseQueryTerms(qRaw){
  const raw = (qRaw ?? "").toString().trim();
  if(!raw) return [];
  // Split by commas. If no commas, keep whole string as one term.
  const parts = raw.includes(",")
    ? raw.split(",")
    : [raw];
  return parts
    .map(s => norm(s.trim()))
    .filter(Boolean);
}


function markQuickUsedFromQuery(qRaw){
  const terms = new Set(parseQueryTerms(qRaw));
  if(terms.size === 0) return;
  let changed = false;
  for(const t of getAllQuickTerms()){
    const nt = norm(t);
    if(terms.has(nt) && !state.usedQuick.has(nt)){
      state.usedQuick.add(nt);
      changed = true;
    }
  }
  if(changed) saveState();
}

/* Build a mapping from normalized-string positions to raw-string indices */
function buildNormMap(raw){
  // normPosToRaw[i] = raw index that produced normalized char at position i
  const normPosToRaw = [];
  for(let i=0;i<raw.length;i++){
    const nn = norm(raw[i]);
    for(let k=0;k<nn.length;k++){
      normPosToRaw.push(i);
    }
  }
  return normPosToRaw;
}

/* Highlight ALL matches in text for better UX */
function highlight(text, qRaw){
  const terms = parseQueryTerms(qRaw);
  if(terms.length === 0) return escapeHtml(text);

  const raw = (text ?? "").toString();
  const hay = norm(raw);
  if(!hay) return escapeHtml(raw);

  // Collect [start,end) ranges in NORMALIZED space for all terms
  let ranges = [];
  terms.forEach(t=>{
    if(!t) return;
    let from = 0;
    while(true){
      const idx = hay.indexOf(t, from);
      if(idx < 0) break;
      ranges.push([idx, idx + t.length]);
      from = idx + Math.max(1, t.length);
    }
  });

  if(ranges.length === 0) return escapeHtml(raw);

  // Merge overlapping ranges
  ranges.sort((a,b)=>a[0]-b[0]);
  const merged = [];
  for(const r of ranges){
    const last = merged[merged.length-1];
    if(!last || r[0] > last[1]) merged.push(r);
    else last[1] = Math.max(last[1], r[1]);
  }

  // Map merged normalized ranges back to RAW indices
  const map = buildNormMap(raw);
  const rawRanges = merged.map(([ns, ne])=>{
    const rs = map[Math.min(ns, map.length-1)] ?? 0;
    const re = map[Math.min(ne-1, map.length-1)] ?? (raw.length-1);
    return [rs, re+1];
  });

  // Merge again in raw space (just in case)
  rawRanges.sort((a,b)=>a[0]-b[0]);
  const rawMerged = [];
  for(const r of rawRanges){
    const last = rawMerged[rawMerged.length-1];
    if(!last || r[0] > last[1]) rawMerged.push(r);
    else last[1] = Math.max(last[1], r[1]);
  }

  // Build HTML safely
  let out = "";
  let cursor = 0;
  rawMerged.forEach(([s,e])=>{
    out += escapeHtml(raw.slice(cursor, s));
    out += "<mark>" + escapeHtml(raw.slice(s, e)) + "</mark>";
    cursor = e;
  });
  out += escapeHtml(raw.slice(cursor));
  return out;
}

function matchesQuery(item, qRaw){
  const terms = parseQueryTerms(qRaw);
  if(terms.length === 0) return true;
  const hay = norm(item.code + " " + item.text);
  // Match if any term appears
  return terms.some(t => t && hay.includes(t));
}

/* ===========================
   Persistencia + URL (share)
   =========================== */
const LS_KEY = "premir_curriculo_compare_v2";

function serializeState(){
  return {
    mode: state.mode,
    selectedCourses: Array.from(state.selectedCourses),
    selectedBlock: state.selectedBlock,
    q: state.q,
    theme: state.theme,
    usedQuick: Array.from(state.usedQuick)
  };
}

function applyTheme(){
  // theme: auto uses prefers-color-scheme
  let theme = state.theme;
  if(theme === "auto"){
    theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  document.documentElement.dataset.theme = theme;
}

function saveState(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(serializeState()));
  }catch(_){}
}

function loadState(){
  // 1) URL params override
  const url = new URL(window.location.href);
  const courses = url.searchParams.get("courses");
  const mode = url.searchParams.get("mode");
  const block = url.searchParams.get("block");
  const q = url.searchParams.get("q");
  const theme = url.searchParams.get("theme");

  // 2) LocalStorage fallback
  let fromLS = null;
  try{ fromLS = JSON.parse(localStorage.getItem(LS_KEY) || "null"); }catch(_){}

  const src = { ...(fromLS || {}), ...(Object.fromEntries(url.searchParams.entries())) };

  // mode
  state.mode = (mode || fromLS?.mode || DEFAULT_STATE.mode) === "blocks" ? "blocks" : "courses";

  // courses
  let selectedCourses = null;
  if(typeof courses === "string" && courses.trim()){
    selectedCourses = courses.split("|").map(decodeURIComponent).filter(Boolean);
  }else if(Array.isArray(fromLS?.selectedCourses)){
    selectedCourses = fromLS.selectedCourses;
  }else{
    selectedCourses = DEFAULT_STATE.selectedCourses;
  }
  // keep only existing courses
  const allCourses = new Set(DATA.map(d=>d.course));
  state.selectedCourses = new Set(selectedCourses.filter(c=>allCourses.has(c)));

  // block
  const b = Number(block || fromLS?.selectedBlock || DEFAULT_STATE.selectedBlock || 0);
  state.selectedBlock = (b >= 1 && b <= 6) ? b : null;

  // query
  state.q = (q ?? fromLS?.q ?? DEFAULT_STATE.q) || "";

  // theme
  const t = (theme || fromLS?.theme || DEFAULT_STATE.theme);
  state.theme = (t === "light" || t === "dark" || t === "auto") ? t : "auto";



  // used quick terms (local only)
  state.usedQuick = new Set(fromLS?.usedQuick || DEFAULT_STATE.usedQuick || []);
  applyTheme();
}

function updateURL(){
  // Keep URL clean (only include non-defaults)
  const url = new URL(window.location.href);
  url.searchParams.set("mode", state.mode);
  url.searchParams.set("courses", Array.from(state.selectedCourses).map(encodeURIComponent).join("|"));
  if(state.selectedBlock) url.searchParams.set("block", String(state.selectedBlock));
  else url.searchParams.delete("block");
  if(state.q.trim()) url.searchParams.set("q", state.q.trim());
  else url.searchParams.delete("q");
  if(state.theme !== "auto") url.searchParams.set("theme", state.theme);
  else url.searchParams.delete("theme");
  history.replaceState(null, "", url.toString());
}

function renderQuickTerms(){

  getAllQuickTerms().forEach(term=>{
    const li = document.createElement("li");

    const btn = document.createElement("button");
    btn.type = "button";

    btn.className = "exampleItem" + (isUsed ? " used" : "") + (current === term ? " active" : "");
    btn.textContent = term;
    btn.title = "Copiar al buscador: " + term;

    btn.addEventListener("click", ()=>{
      // Si ya está puesta, permite limpiar con otro clic.
      const next = ((state.q || "").trim() === term) ? "" : term;

      state.q = next;

      // Mark as used once it has been searched/clicked
      state.usedQuick.add(norm(term));

      const qEl = document.getElementById("q");
      if(qEl){
        qEl.value = next;
        qEl.focus();
        // Dispara el evento para que el filtrado reaccione igual que si escribieras
        qEl.dispatchEvent(new Event("input", { bubbles: true }));
      }

      saveState(); updateURL();
      renderQuickTerms();
      renderChips();
      renderContent();
    });

    li.appendChild(btn);
    ol.appendChild(li);
  });

  box.appendChild(ol);
}



function renderStats(matchesCount){

}

function renderBlockDetails(block, q, forceOpen){
  if(!block) return `<div class="empty">Este curso no tiene datos para el bloque seleccionado.</div>`;
  const items = (block.items ?? []).filter(it=>matchesQuery(it,q));
  if(items.length === 0) return `<div class="empty">No hay coincidencias.</div>`;

  let html = "";
  let current = [];
  let currentHeader = null;

  function flush(){
    if(!currentHeader && current.length===0) return;
    const openAttr = (forceOpen || q) ? " open" : "";
    const title = currentHeader ? currentHeader : (block.title || getBlockMeta(block.id).title);
    html += `
      <details${openAttr}>
        <summary>
          <span class="sum-left">
            <span class="blockTag" data-b="${block.id}" aria-label="Bloque ${block.id}"><span class="ico">★</span></span> ${block.id}</span></span>
            <span class="sum-text"></span>
          </span>
          <span class="sum-right">${current.length} ítem(s)</span>
        </summary>
        <ul class="list">
          ${current.map(it => `
            <li>
              <span class="code">${escapeHtml(it.code)}</span>
              — <span>${highlight(it.text, q)}</span>
            </li>
          `).join("")}
        </ul>
      </details>
    `;
    current = [];
    currentHeader = null;
  }

  items.forEach(it=>{
    const isHeader = it.text.trim().endsWith(":") && !/\d+\.\d+\.\d+/.test(it.code);
    if(isHeader){
      flush();
      currentHeader = it.text.replace(/:$/,"");
      current = [];
    }else{
      current.push(it);
    }
  });
  flush();
  return html;
}

function renderContent(){
  const root = $("#content");
  const q = state.q.trim();
  const selected = Array.from(state.selectedCourses);

  let matchesCount = 0;

  if(selected.length === 0){
    root.innerHTML = `<div class="empty">Selecciona al menos un curso para ver contenido.</div>`;
    renderStats(0);
    return;
  }


  if(state.mode === "course6"){
    const course = Array.from(state.selectedCourses)[0];
    if(!course){
      root.innerHTML = `<div class="empty">Selecciona un curso para ver sus 6 bloques.</div>`;
      renderStats(0);
      return;
    }

    // 6 columnas = bloques 1..6 del mismo curso
    const cols = Array.from({length:6}, (_,i)=>i+1).map(blockId=>{
      const b = blockFromCourse(course, blockId);
      const items = (b?.items ?? []).filter(it=>matchesQuery(it,q));
      matchesCount += items.length;

      const body = items.length
        ? renderBlockDetails(b, q, true)
        : `<div class="empty">No hay coincidencias para este bloque con el filtro actual.</div>`;

      return `
        <section class="col">
          <div class="col-title">
            <h2><span class="blockTag" data-b="${blockId}" aria-label="Bloque ${blockId}"><span class="ico">★</span></span></h2>
            <span class="pill">${escapeHtml(course)}${b?.title ? " · "+escapeHtml(b.title):""}</span>
          </div>
          ${body}
        </section>
      `;
    }).join("");

    root.innerHTML = `<div class="grid grid-6">${cols}</div>`;
    renderStats(matchesCount);
    return;
  }

  if(state.mode === "blocks"){
    if(!state.selectedBlock){
      root.innerHTML = `<div class="empty">Estás en <b>Comparar un bloque</b>. Selecciona un bloque (1–6) para comparar entre cursos.</div>`;
      renderStats(0);
      return;
    }

    const cols = selected.map(course=>{
      const b = blockFromCourse(course, state.selectedBlock);
      const items = (b?.items ?? []).filter(it=>matchesQuery(it,q));
      matchesCount += items.length;

      const body = items.length
        ? `<div>${renderBlockDetails(b, q, true)}</div>`
        : `<div class="empty">No hay coincidencias para este bloque con el filtro actual.</div>`;

      return `
        <section class="col">
          <div class="col-title">
            <h2>${escapeHtml(course)}</h2>
            <span class="pill">${getBlockMeta(state.selectedBlock).icon} ${state.selectedBlock}${b?.title ? " · "+escapeHtml(b.title):""}</span>
          </div>
          ${body}
        </section>
      `;
    }).join("");

    root.innerHTML = `<div class="grid grid-5">${cols}</div>`;
    renderStats(matchesCount);
    return;
  }

  const cols = selected.map(course=>{
    const c = courseByName(course);

    const blocks = (c?.blocks ?? []).map(b=>{
      const filtered = (b.items ?? []).filter(it=>matchesQuery(it,q));
      if(filtered.length === 0) return "";
      matchesCount += filtered.length;

      const openAttr = q ? " open" : "";
      return `
        <details${openAttr}>
          <summary>
            <span class="sum-left">
              <span class="blockTag" data-b="${b.id}" aria-label="Bloque ${b.id}"><span class="ico">★</span></span> ${b.id}</span></span>
              <span class="sum-text"></span>
            </span>
            <span class="sum-right">${filtered.length} ítem(s)</span>
          </summary>
          <ul class="list">
            ${filtered.map(it => `
              <li>
                <span class="code">${escapeHtml(it.code)}</span>
                — <span>${highlight(it.text, q)}</span>
              </li>
            `).join("")}
          </ul>
        </details>
      `;
    }).join("");

    return `
      <section class="col">
        <div class="col-title">
          <h2>${escapeHtml(course)}</h2>
          <span class="pill">${(c?.blocks?.length ?? 0)} bloques</span>
        </div>
        ${blocks || `<div class="empty">No hay coincidencias con el filtro actual.</div>`}
      </section>
    `;
  }).join("");

  root.innerHTML = `<div class="grid grid-5">${cols}</div>`;
  renderStats(matchesCount);
}

async function copyShareLink(){
  const url = window.location.href;
  try{
    await navigator.clipboard.writeText(url);
    toast("Enlace copiado ✅");
  }catch(_){
    // fallback
    const ta = document.createElement("textarea");
    ta.value = url;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
    toast("Enlace copiado ✅");
  }
}

function toggleTheme(){
  // cycle: auto -> light -> dark -> auto
  const order = ["auto", "light", "dark"];
  const idx = order.indexOf(state.theme);
  state.theme = order[(idx+1) % order.length];
  applyTheme();
  saveState(); updateURL();
  toast(`Tema: ${state.theme}`);
}

    el.style.position = "fixed";
    el.style.left = "50%";

    window.addEventListener("resize", setHeaderH);

    const loadState = ()=>{
      try{ return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}") || {}; }
      catch{ return {}; }
    };
    const saveState = (patch)=>{
      const s = Object.assign(loadState(), patch);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
      return s;
    };

    const applyState = ()=>{
      const s = loadState();
      areaSearch.classList.toggle("floating", !!s.floating);
      areaSearch.classList.toggle("collapsed", !!s.collapsed);

      btnFloat.textContent = s.floating ? "Anclar" : "Flotar";
      btnFloat.title = s.floating ? "Volver a anclar este módulo en la página" : "Poner este módulo en modo flotante";
      btnCollapse.textContent = s.collapsed ? "Expandir" : "Minimizar";
      btnCollapse.setAttribute("aria-expanded", String(!s.collapsed));

      if(s.floating){
        // Restore geometry
        if(typeof s.left === "number") areaSearch.style.left = s.left + "px";
        if(typeof s.top === "number") areaSearch.style.top = s.top + "px";
        if(typeof s.width === "number") areaSearch.style.width = s.width + "px";
        if(typeof s.height === "number") areaSearch.style.height = s.height + "px";
        // When floating we don't want right/bottom interfering
        areaSearch.style.right = "auto";
        areaSearch.style.bottom = "auto";
      }else{
        // Clean inline geometry when docked
        areaSearch.style.left = "";
        areaSearch.style.top = "";
        areaSearch.style.right = "";
        areaSearch.style.bottom = "";
        areaSearch.style.width = "";
        areaSearch.style.height = "";
      }
    };

    applyState();

    btnFloat.addEventListener("click", ()=>{
      const s = loadState();
      const next = !s.floating;

      // When enabling floating, capture current visible size as start size
      if(next){
        const r = areaSearch.getBoundingClientRect();
        saveState({
          floating: true,
          left: Math.max(8, Math.round(r.left)),
          top: Math.max(8, Math.round(r.top)),
          width: Math.round(r.width),
          height: Math.round(r.height),
        });
      }else{
        saveState({ floating: false });
      }
      applyState();
    });

    btnCollapse.addEventListener("click", ()=>{
      const s = loadState();
      saveState({ collapsed: !s.collapsed });
      applyState();
    });

    // Dragging (only when floating)
    let dragging = false;
    let startX = 0, startY = 0, startLeft = 0, startTop = 0;

    const clamp = (v, min, max)=> Math.max(min, Math.min(max, v));

    floatBar.addEventListener("pointerdown", (ev)=>{
      // No iniciar arrastre cuando se interactúa con controles
      if(ev.target && ev.target.closest && ev.target.closest("button, input, textarea, select, a")) return;
const s = loadState();
      if(!s.floating) return;

      // Don't start drag when clicking buttons
      if(ev.target && (ev.target.closest("button") || ev.target.closest("a") || ev.target.closest("input"))) return;

      dragging = true;
      floatBar.setPointerCapture(ev.pointerId);

      const r = areaSearch.getBoundingClientRect();
      startX = ev.clientX;
      startY = ev.clientY;
      startLeft = r.left;
      startTop = r.top;

      ev.preventDefault();
    });

    floatBar.addEventListener("pointermove", (ev)=>{
      if(!dragging) return;

      const headerH = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--headerH")) || 64;
      const maxX = window.innerWidth - areaSearch.offsetWidth - 8;
      const maxY = window.innerHeight - areaSearch.offsetHeight - 8;

      const nextLeft = clamp(startLeft + (ev.clientX - startX), 8, Math.max(8, maxX));
      const nextTop  = clamp(startTop  + (ev.clientY - startY), headerH + 8, Math.max(headerH + 8, maxY));

      areaSearch.style.left = Math.round(nextLeft) + "px";
      areaSearch.style.top  = Math.round(nextTop) + "px";
    });

    const endDrag = (ev)=>{
      if(!dragging) return;
      dragging = false;

      const r = areaSearch.getBoundingClientRect();
      saveState({
        left: Math.round(r.left),
        top: Math.round(r.top),
        width: Math.round(r.width),
        height: Math.round(r.height),
      });
    };

    floatBar.addEventListener("pointerup", endDrag);
    floatBar.addEventListener("pointercancel", endDrag);

    // Persist resize while floating
    const ro = new ResizeObserver(()=>{
      const s = loadState();
      if(!s.floating) return;
      const r = areaSearch.getBoundingClientRect();
      saveState({
        width: Math.round(r.width),
        height: Math.round(r.height),
      });
    });
    ro.observe(areaSearch);
  })();

  // react to OS scheme changes when theme = auto
  if(window.matchMedia){
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ()=>{
      if(state.theme === "auto") applyTheme();
    });
  }
}

$("#q").value = state.q || "";

/* ===========================
   Toggle Modo Oscuro
   =========================== */
(function(){
  const btn = document.getElementById("btnDark");
  const root = document.documentElement;
  let dark = false;
  try{ dark = localStorage.getItem("premir_dark")==="on"; }catch(e){}
  if(dark) root.dataset.dark="on";

  if(btn){
    btn.addEventListener("click", ()=>{
      const isOn = root.dataset.dark==="on";
      if(isOn){
        delete root.dataset.dark;
        try{ localStorage.setItem("premir_dark","off"); }catch(e){}
        btn.title = "Activar modo oscuro";
      }else{
        root.dataset.dark="on";
        try{ localStorage.setItem("premir_dark","on"); }catch(e){}
        btn.title = "Desactivar modo oscuro";
      }
    });
  }
})();

</script>
